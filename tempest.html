<style>

<body>
<div id="wrap">
  <div id="hud"><button id="back" onclick="location.href='index.html'">← Tornar</button><span>PUNTS <b id="score">0</b></span><span>NIVELL <b id="nivell">1</b></span><span>NAUS <b id="lives">3</b></span><span style="color:#ff0"><b id="best">—</b></span></div>

<script src="records.js"></script>
<script>

// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(f,d,type='square',vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.005);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(MG);o.start(n);o.stop(n+d+.02);
}
function noise(d=.15,vol=.25){
  if(!AC)return;
  const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),dd=b.getChannelData(0);
  for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(),g=AC.createGain(),now=AC.currentTime;
  s.buffer=b;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  s.connect(g);g.connect(MG);s.start();s.stop(now+d);
}
function sndTret(){aInit();tone(1200,.05,'square',.13,-700)}
function sndEsclat(){aInit();noise(.14,.24)}
function sndFlip(){aInit();tone(260,.05,'square',.1,120)}
function sndZap(){aInit();noise(.6,.32);[900,700,500,300].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sawtooth',.24,-120),i*110))}
function sndPols(){aInit();tone(90,.12,'sawtooth',.18,60)}
function sndBaixa(){aInit();[200,300,450,650,900].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.2),i*110))}
function sndMor(){aInit();[600,480,360,260,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sawtooth',.26,-60),i*110))}
function sndNivell(){aInit();[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.24),i*95))}
function sndVida(){aInit();[659,880,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.24),i*85))}
function sndFi(){aInit();[300,240,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.3,'square',.26,-50),i*260))}

const c=document.getElementById('game'),x=c.getContext('2d');
const W=448,H=470;

// ===== EL TUB =====
// Setze carrils que van de la vora (a prop teu) fins al fons. Cada nivell te
// una forma diferent, com a la maquina: cercle, quadrat, creu, triangle, i
// tambe formes obertes on no pots donar la volta.
const NC=16;                                   // carrils
const CX=224, CY=250, RX=176, RY=150;
const FONS_ESC=0.14, FONS_DY=-56;              // el fons, petit i una mica amunt

function mostreja(punts,n,tancat){
  // repartim n punts (o n+1 si es oberta) al llarg del perimetre
  const segs=[];let total=0;
  const lim=tancat?punts.length:punts.length-1;
  for(let i=0;i<lim;i++){
    const a=punts[i],b=punts[(i+1)%punts.length];
    const d=Math.hypot(b.x-a.x,b.y-a.y);
    segs.push({a,b,d});total+=d;
  }
  const quants=tancat?n:n+1;
  const pas=tancat?total/n:total/(quants-1);
  const out=[];let si=0,acum=0;
  for(let k=0;k<quants;k++){
    let dist=k*pas;
    while(si<segs.length-1&&acum+segs[si].d<dist){acum+=segs[si].d;si++}
    const s=segs[si],t=Math.min(1,(dist-acum)/s.d);
    out.push({x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t});
  }
  return out;
}
const FORMES=[
  {nom:'cercle',tancat:true,punts:()=>{
    const p=[];for(let i=0;i<64;i++){const a=-Math.PI/2+i*2*Math.PI/64;p.push({x:Math.cos(a),y:Math.sin(a)})}return p}},
  {nom:'quadrat',tancat:true,punts:()=>[{x:-1,y:-1},{x:1,y:-1},{x:1,y:1},{x:-1,y:1}]},
  {nom:'creu',tancat:true,punts:()=>[
    {x:-.34,y:-1},{x:.34,y:-1},{x:.34,y:-.34},{x:1,y:-.34},{x:1,y:.34},{x:.34,y:.34},
    {x:.34,y:1},{x:-.34,y:1},{x:-.34,y:.34},{x:-1,y:.34},{x:-1,y:-.34},{x:-.34,y:-.34}]},
  {nom:'triangle',tancat:true,punts:()=>[{x:0,y:-1},{x:1,y:.8},{x:-1,y:.8}]},
  {nom:'v',tancat:false,punts:()=>[{x:-1,y:-.7},{x:0,y:.9},{x:1,y:-.7}]},
  {nom:'escala',tancat:false,punts:()=>[
    {x:-1,y:.6},{x:-.6,y:.6},{x:-.6,y:0},{x:-.2,y:0},{x:-.2,y:-.5},
    {x:.2,y:-.5},{x:.2,y:0},{x:.6,y:0},{x:.6,y:.6},{x:1,y:.6}]},
  {nom:'linia',tancat:false,punts:()=>[{x:-1,y:0},{x:1,y:0}]},
];

let VORA=[],FONS=[],tancat=true,NPUNTS=0;
function muntaTub(n){
  const f=FORMES[(n-1)%FORMES.length];
  tancat=f.tancat;
  const base=mostreja(f.punts(),NC,tancat);
  VORA=base.map(p=>({x:CX+p.x*RX,y:CY+p.y*RY}));
  FONS=base.map(p=>({x:CX+p.x*RX*FONS_ESC,y:CY+p.y*RY*FONS_ESC+FONS_DY}));
  NPUNTS=VORA.length;
  return f.nom;
}
// un punt del vertex i a la fondaria z (0 = fons, 1 = vora)
function punt(i,z){
  const f=Math.pow(Math.max(0,Math.min(1,z)),1.7);
  const P=VORA[i],Q=FONS[i];
  return {x:Q.x+(P.x-Q.x)*f, y:Q.y+(P.y-Q.y)*f};
}
function vora(i){return (i+NPUNTS*4)%NPUNTS}
// el centre d'un carril a una fondaria
function centre(l,z){
  const a=punt(l,z), b=punt(tancat?vora(l+1):l+1, z);
  return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
}
function seguent(l,d){
  if(tancat)return (l+d+NC)%NC;
  return Math.max(0,Math.min(NC-1,l+d));
}

// ===== PUNTUACIONS DE LA MAQUINA =====
const PUNTS={flipper:150,tanker:100,spiker:50,fuseball:250,pulsar:200};

let score=0,lives=3,nivell=1,state='play',paused=false,animT=0;
let jugador=null,trets=[],enemics=[],tretsEn=[],punxes=[],espurnes=[];
let zapsQueden=2,tSurt=0,perSortir=0,congelat=0,proximaVida=20000,flash=0;
let baixada=0,formaNom='cercle';

const JOC='tempest';
Records.pintaMillor(JOC,document.getElementById('best'));
let bestScore=Records.local(JOC);
function saveBest(){
  if(score>bestScore){bestScore=score;Records.desaLocal(JOC,score)}
  Records.marcador(JOC,document.getElementById('best'),score);
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('nivell').textContent=nivell;
  document.getElementById('lives').textContent=lives;
  saveBest();
}
function addScore(n){
  score+=n;
  while(score>=proximaVida){lives++;proximaVida+=20000;sndVida()}
  updateHUD();
}
function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}

// ===== MUNTAR EL NIVELL =====
function nouNivell(){
  formaNom=muntaTub(nivell);
  jugador={l:0,mort:0};
  trets=[];tretsEn=[];enemics=[];espurnes=[];
  punxes=new Array(NC).fill(0);
  // a partir del nivell 3 el fons ja ve amb punxes fetes
  if(nivell>=3)for(let i=0;i<NC;i++)if(Math.random()<.35)punxes[i]=.1+Math.random()*.3;
  zapsQueden=2;                                 // el segon nomes se n'endu un
  perSortir=Math.min(24,10+nivell*2);
  tSurt=900;congelat=0;baixada=0;flash=0;
  state='play';updateHUD();
}
function start(){
  score=0;lives=3;nivell=1;proximaVida=20000;paused=false;
  bestScore=Records.local(JOC);
  nouNivell();hideMsg();
}

// ===== ENEMICS =====
function nouEnemic(tipus,l){
  return {tipus,l,z:0,vz:0,mort:false,flip:null,t:Math.random()*1000,
          tTret:1500+Math.random()*2500,pols:0,aVora:false,tVora:0};
}
function treuEnemic(){
  if(perSortir<=0)return;
  perSortir--;
  const l=Math.floor(Math.random()*NC);
  const r=Math.random();
  let tipus='flipper';
  if(nivell>=2&&r<.18)tipus='tanker';
  else if(nivell>=4&&r<.30)tipus='spiker';
  else if(nivell>=5&&r<.40)tipus='pulsar';
  else if(nivell>=6&&r<.48)tipus='fuseball';
  else if(nivell>=3&&r<.62)tipus='spiker';
  enemics.push(nouEnemic(tipus,l));
}
function velEnemic(e){
  const base=0.000105*(1+(nivell-1)*0.08);
  return e.tipus==='fuseball'?base*1.35:e.tipus==='tanker'?base*.8:base;
}
function esclata(l,z,color,n=10){
  const p=centre(l,z);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=.4+Math.random()*1.8;
    espurnes.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vida:300+Math.random()*350,color});
  }
}
function mataEnemic(e,punts=true){
  e.mort=true;
  if(punts)addScore(PUNTS[e.tipus]||100);
  esclata(e.l,e.z,e.tipus==='pulsar'?'#ffd000':e.tipus==='fuseball'?'#40ffff':'#ff5020');
  sndEsclat();
  if(e.tipus==='tanker'){
    // els tankers es parteixen en dos flippers
    for(const d of [-1,1]){
      const f=nouEnemic('flipper',seguent(e.l,d));
      f.z=e.z;enemics.push(f);
    }
  }
}
function mouEnemic(e,dt){
  if(e.mort)return;
  e.t+=dt;
  if(e.flip){
    e.flip.t+=dt;
    if(e.flip.t>=e.flip.d){e.l=e.flip.a;e.flip=null}
  }
  if(e.aVora){
    // ja ha arribat a la vora: et persegueix per la vora
    e.tVora-=dt;
    if(!e.flip&&e.tVora<=0){
      e.tVora=Math.max(150,340-nivell*14);
      const d=distCarril(e.l,jugador.l);
      if(d!==0){
        const pas=Math.sign(d);
        e.flip={de:e.l,a:seguent(e.l,pas),t:0,d:e.tVora};
        sndFlip();
      }
    }
    return;
  }
  e.z+=velEnemic(e)*dt;
  if(e.tipus==='spiker'){
    // va deixant punxa al seu carril i torna a baixar
    punxes[e.l]=Math.max(punxes[e.l],Math.min(.86,e.z));
    if(e.z>=.86){e.z=.86;e.vz=-1}
    if(e.vz===-1){e.z-=velEnemic(e)*dt*1.6;if(e.z<=0.02){e.vz=0}}
    return;
  }
  if(e.tipus==='pulsar'){
    e.pols=(Math.sin(e.t/240)+1)/2;
    if(e.pols>.94&&jugador&&e.l===jugador.l&&e.z>.5&&state==='play'){mor();return}
  }
  if(!e.flip&&(e.tipus==='flipper'||e.tipus==='fuseball')){
    const cada=e.tipus==='fuseball'?700:1100;
    if(e.t%cada<dt&&e.z<.95){
      const d=Math.random()<.5?-1:1;
      const desti=seguent(e.l,d);
      if(desti!==e.l){e.flip={de:e.l,a:desti,t:0,d:e.tipus==='fuseball'?220:300};sndFlip()}
    }
  }
  if(e.z>=1){
    e.z=1;e.aVora=true;e.tVora=300;
  }
  // disparen mentre pugen
  if(e.tipus==='flipper'||e.tipus==='tanker'){
    e.tTret-=dt;
    if(e.tTret<=0&&e.z>.15&&e.z<.9){
      e.tTret=1800+Math.random()*2600;
      tretsEn.push({l:e.l,z:e.z,v:0.00042*(1+(nivell-1)*.05)});
    }
  }
}
function distCarril(a,b){
  if(!tancat)return b-a;
  let d=(b-a+NC)%NC;
  if(d>NC/2)d-=NC;
  return d;
}
function posEnemic(e){
  if(!e.flip)return centre(e.l,e.z);
  const p=e.flip.t/e.flip.d;
  const a=centre(e.flip.de,e.z), b=centre(e.flip.a,e.z);
  return {x:a.x+(b.x-a.x)*p, y:a.y+(b.y-a.y)*p};
}

// ===== EL JUGADOR =====
function gira(d){
  if(state!=='play'&&state!=='baixa')return;
  if(paused||jugador.mort>0)return;
  jugador.l=seguent(jugador.l,d);
}
function dispara(){
  if(state!=='play'||paused||jugador.mort>0)return;
  if(trets.filter(t=>!t.mort).length>=8)return;
  trets.push({l:jugador.l,z:1,v:0.0016,mort:false});
  sndTret();
}
function superzap(){
  if(state!=='play'||paused||zapsQueden<=0)return;
  const vius=enemics.filter(e=>!e.mort);
  if(zapsQueden===2){                            // el primer se'ls endu tots
    for(const e of vius)mataEnemic(e);
  }else if(vius.length){                         // el segon, nomes un
    mataEnemic(vius[Math.floor(Math.random()*vius.length)]);
  }
  zapsQueden--;flash=320;sndZap();updateHUD();
  comprovaNivell();
}

// ===== MORIR I PASSAR DE NIVELL =====
function mor(){
  if(state!=='play'&&state!=='baixa')return;
  state='mor';sndMor();
  esclata(jugador.l,state==='baixa'?baixada:1,'#ffffff',22);
  setTimeout(()=>{
    lives--;updateHUD();
    if(lives<=0){state='over';sndFi();finalPartida('GAME OVER')}
    else{
      // tornes amb el mateix tub i el que quedava d'enemics
      jugador={l:jugador.l,mort:0};trets=[];tretsEn=[];baixada=0;state='play';
    }
  },1500);
}
async function finalPartida(titol){
  msg(titol);
  const r=await Records.fiPartida(JOC,score);
  msg(titol+(r.posicio?'<br><small style="color:#ff0">Ets el número '+r.posicio+'!</small>':'')+
      '<div style="margin:10px 0">'+r.html+'</div>'+
      Records.peuFinal('o prem ENTER per tornar a jugar'));
  Records.pintaMillor(JOC,document.getElementById('best'),score);
}
function comprovaNivell(){
  if(state!=='play')return;
  if(perSortir>0||enemics.some(e=>!e.mort))return;
  // nivell net: ara baixes pel tub, i les punxes et poden enxampar
  state='baixa';baixada=1;sndBaixa();
}
function acabaBaixada(){
  state='fi';sndNivell();
  msg('NIVELL '+nivell+' NET!');
  setTimeout(()=>{hideMsg();nivell++;nouNivell()},1600);
}

// ===== BUCLE =====
function update(dt){
  if(paused||state==='over')return;
  animT+=dt;
  if(flash>0)flash-=dt;
  for(let i=espurnes.length-1;i>=0;i--){
    const s=espurnes[i];s.vida-=dt;s.x+=s.vx*dt/16.7;s.y+=s.vy*dt/16.7;
    if(s.vida<=0)espurnes.splice(i,1);
  }
  if(state==='baixa'){
    baixada-=dt*0.00042;
    // si al teu carril hi ha punxa i hi topes, s'ha acabat
    if(punxes[jugador.l]>0&&baixada<=punxes[jugador.l]+.02){mor();return}
    if(baixada<=0){acabaBaixada();return}
    return;
  }
  if(state!=='play')return;

  // van sortint enemics
  tSurt-=dt;
  if(tSurt<=0&&perSortir>0){
    treuEnemic();
    tSurt=Math.max(280,1100-nivell*55)*(0.6+Math.random()*0.8);
  }

  for(const e of enemics)mouEnemic(e,dt);
  if(state!=='play')return;

  // trets teus
  for(const t of trets){
    if(t.mort)continue;
    t.z-=t.v*dt;
    // La punxa atura el tret i se n'escapça un tros per dalt, com a la
    // maquina: el tret no la travessa.
    if(punxes[t.l]>0&&t.z<=punxes[t.l]){
      punxes[t.l]=Math.max(0,punxes[t.l]-.12);addScore(1);
      t.mort=true;continue;
    }
    if(t.z<=0){t.mort=true;continue}
    for(const e of enemics){
      if(e.mort||e.l!==t.l&&!(e.flip&&(e.flip.de===t.l||e.flip.a===t.l)))continue;
      if(Math.abs(e.z-t.z)<.05){mataEnemic(e);t.mort=true;break}
    }
  }
  trets=trets.filter(t=>!t.mort&&t.z>0);

  // trets dels enemics
  for(let i=tretsEn.length-1;i>=0;i--){
    const t=tretsEn[i];
    t.z+=t.v*dt;
    if(t.z>=1){
      if(t.l===jugador.l){mor();return}
      tretsEn.splice(i,1);continue;
    }
  }

  // topar amb un enemic a la vora
  for(const e of enemics){
    if(e.mort||!e.aVora)continue;
    const l=e.flip?e.flip.a:e.l;
    if(l===jugador.l||e.l===jugador.l){mor();return}
  }
  enemics=enemics.filter(e=>!e.mort);
  comprovaNivell();
}

// ===== DIBUIX =====
function dibuixaTub(){
  x.lineWidth=2;
  // els carrils
  for(let i=0;i<NPUNTS;i++){
    if(!tancat&&i===NPUNTS-1&&false)continue;
    const a=punt(i,0),b=punt(i,1);
    x.strokeStyle='#2040c0';
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
  }
  // el fons i la vora
  for(const z of [0,1]){
    x.strokeStyle=z?'#4060ff':'#203090';
    x.beginPath();
    for(let i=0;i<NPUNTS;i++){
      const p=punt(i,z);
      i===0?x.moveTo(p.x,p.y):x.lineTo(p.x,p.y);
    }
    if(tancat)x.closePath();
    x.stroke();
  }
  // punxes
  for(let l=0;l<NC;l++){
    if(punxes[l]<=0)continue;
    x.strokeStyle='#40e0a0';x.lineWidth=2;
    const a=centre(l,0),b=centre(l,punxes[l]);
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
    x.fillStyle='#40e0a0';x.beginPath();x.arc(b.x,b.y,3,0,7);x.fill();
  }
}
function dibuixaJugador(){
  const z=state==='baixa'?baixada:1;
  const i2=tancat?vora(jugador.l+1):jugador.l+1;
  const a=punt(jugador.l,z), b=punt(i2,z);
  const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  // les dues potes agafades a les vores del carril i la punta del mig cap
  // endins: la forma de la maquina
  const ai=punt(jugador.l,Math.max(0,z-.17)), bi=punt(i2,Math.max(0,z-.17));
  const punta=centre(jugador.l,Math.max(0,z-.30));
  x.strokeStyle='#ffd000';x.lineWidth=3;x.lineJoin='round';x.lineCap='round';
  x.beginPath();
  x.moveTo(a.x,a.y);x.lineTo(ai.x,ai.y);
  x.moveTo(b.x,b.y);x.lineTo(bi.x,bi.y);
  x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.lineTo(b.x,b.y);
  x.moveTo(m.x,m.y);x.lineTo(punta.x,punta.y);
  x.stroke();
  x.lineCap='butt';
}
function dibuixaEnemic(e){
  const p=posEnemic(e), r=6+18*Math.pow(e.z,1.7);
  if(e.tipus==='flipper'){
    x.strokeStyle='#ff3020';x.lineWidth=2;
    x.beginPath();
    x.moveTo(p.x-r,p.y);x.lineTo(p.x,p.y-r*.7);x.lineTo(p.x+r,p.y);
    x.lineTo(p.x,p.y+r*.7);x.closePath();x.stroke();
    x.beginPath();x.moveTo(p.x-r,p.y);x.lineTo(p.x+r,p.y);x.stroke();
  }else if(e.tipus==='tanker'){
    x.strokeStyle='#c040ff';x.lineWidth=2;
    x.beginPath();
    x.moveTo(p.x-r,p.y);x.lineTo(p.x,p.y-r);x.lineTo(p.x+r,p.y);x.lineTo(p.x,p.y+r);
    x.closePath();x.stroke();
    x.beginPath();x.moveTo(p.x-r*.5,p.y);x.lineTo(p.x+r*.5,p.y);x.stroke();
  }else if(e.tipus==='spiker'){
    x.strokeStyle='#40e0a0';x.lineWidth=2;
    x.beginPath();
    for(let k=0;k<10;k++){
      const an=k*.9+e.t/160, rr=r*(1-k/13);
      const px=p.x+Math.cos(an)*rr, py=p.y+Math.sin(an)*rr*.6;
      k===0?x.moveTo(px,py):x.lineTo(px,py);
    }
    x.stroke();
  }else if(e.tipus==='pulsar'){
    const b=.4+e.pols*.6;
    x.strokeStyle='rgba(255,208,0,'+b.toFixed(2)+')';x.lineWidth=2+e.pols*2;
    x.beginPath();
    x.moveTo(p.x-r,p.y-r*.6);x.lineTo(p.x+r*.3,p.y);x.lineTo(p.x-r*.3,p.y);
    x.lineTo(p.x+r,p.y+r*.6);x.stroke();
  }else{
    x.strokeStyle='#40ffff';x.lineWidth=2;
    const f=Math.sin(e.t/90)*r*.4;
    x.beginPath();x.arc(p.x,p.y,r*.7,0,7);x.stroke();
    x.beginPath();x.moveTo(p.x-r,p.y+f);x.lineTo(p.x+r,p.y-f);x.stroke();
    x.beginPath();x.moveTo(p.x-r,p.y-f);x.lineTo(p.x+r,p.y+f);x.stroke();
  }
}
function draw(){
  x.fillStyle='#000';x.fillRect(0,0,W,H);
  dibuixaTub();
  // trets
  for(const t of trets){
    const a=centre(t.l,t.z), b=centre(t.l,Math.min(1,t.z+.05));
    x.strokeStyle='#ffffff';x.lineWidth=3;
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
  }
  for(const t of tretsEn){
    const p=centre(t.l,t.z);
    x.fillStyle='#ff40ff';
    x.beginPath();x.arc(p.x,p.y,3+3*t.z,0,7);x.fill();
  }
  for(const e of enemics)if(!e.mort)dibuixaEnemic(e);
  for(const s of espurnes){
    x.fillStyle=s.color;x.globalAlpha=Math.max(0,Math.min(1,s.vida/350));
    x.fillRect(s.x-1.5,s.y-1.5,3,3);x.globalAlpha=1;
  }
  if(state!=='mor')dibuixaJugador();
  // marcadors de dalt
  x.fillStyle='#4ad8ff';x.font='12px monospace';x.textAlign='left';
  x.fillText('ZAP '+zapsQueden,10,20);
  x.textAlign='right';
  x.fillStyle='#888';x.fillText('QUEDEN '+(perSortir+enemics.filter(e=>!e.mort).length),W-10,20);
  if(state==='baixa'){
    x.fillStyle='#ffd000';x.font='14px monospace';x.textAlign='center';
    x.fillText('BAIXANT PEL TUB',W/2,H-16);
  }
  if(flash>0){x.fillStyle='rgba(255,0,255,'+Math.min(.5,flash/640)+')';x.fillRect(0,0,W,H)}
  if(paused){x.fillStyle='#fff';x.font='24px monospace';x.textAlign='center';x.fillText('PAUSA',W/2,H/2)}
}
let last=performance.now();
function loop(t){const dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ===== CONTROLS =====
const keys={esq:false,dre:false,foc:false};
let tGir=0,tFoc=0;
setInterval(()=>{
  const ara=performance.now();
  if(keys.esq&&ara>tGir){gira(-1);tGir=ara+110}
  if(keys.dre&&ara>tGir){gira(1);tGir=ara+110}
  if(keys.foc&&ara>tFoc){dispara();tFoc=ara+130}
},25);
function mante(id,k){
  const e=document.getElementById(id);
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();
    if(state==='over'){start();return}
    keys[k]=true;
    if(k==='esq')gira(-1);else if(k==='dre')gira(1);else dispara();
    tGir=performance.now()+240;tFoc=performance.now()+130;
  });
  e.addEventListener('pointerup',ev=>{ev.preventDefault();keys[k]=false});
  e.addEventListener('pointercancel',()=>keys[k]=false);
  e.addEventListener('pointerleave',()=>keys[k]=false);
}
mante('esq','esq');mante('dre','dre');mante('foc','foc');
document.getElementById('zap').addEventListener('pointerdown',e=>{
  e.preventDefault();aInit();if(state==='over'){start();return}superzap();
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  aInit();
  if(state==='over'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();start();return}
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();if(!keys.esq)gira(-1);keys.esq=true}
  if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();if(!keys.dre)gira(1);keys.dre=true}
  if(e.code==='Space'){e.preventDefault();if(!keys.foc)dispara();keys.foc=true}
  if(e.code==='KeyZ'&&!e.repeat)superzap();
  if(e.code==='KeyP'&&state!=='over')paused=!paused;
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.esq=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.dre=false;
  if(e.code==='Space')keys.foc=false;
});
document.getElementById('msg').addEventListener('click',()=>{if(state==='over'){aInit();start()}});

start();
// En entrar al joc, els records uns segons, com les maquines de debo.
// El joc queda en pausa mentre es veuen.
Records.pantallaInicial(JOC,()=>paused=true,()=>paused=false);
