// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type="sine",vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+dur);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.008);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(MG);o.start(now);o.stop(now+dur+.02);
}
function sndTecla(){aInit();tone(700,.03,"triangle",.08)}
function sndNo(){aInit();tone(170,.12,"square",.1,-40)}
function sndBe(){aInit();[659,880].forEach((f,i)=>setTimeout(()=>tone(f,.14,"triangle",.22),i*80))}
function sndMal(){aInit();tone(220,.35,"sawtooth",.16,-80)}
function sndPassa(){aInit();tone(500,.12,"sine",.14,250)}
function sndTic(){aInit();tone(1200,.03,"square",.06)}
function sndFi(){aInit();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,"triangle",.24),i*110))}

// ===== LES DEFINICIONS =====

// paraules facils, les del mig una mica menys, i les ultimes (de la Q a la Z),
// les dificils: la roda va de menys a mes.

const ORDRE=['A','B','C','Ç','D','E','F','G','H','I','J','L','M','N','O','P','Q','R','S','T','U','V','X','Y','Z'];
function llegeixPools(text){
  const P={};let cur=null;
  for(const l of text.split('\n')){
    if(!l.trim())continue;
    if(l[0]==='#'){cur=l.slice(1).trim();P[cur]=[];continue}
    const i=l.indexOf(': ');if(i<0||!cur)continue;
    const [resp,...alts]=l.slice(0,i).split('/');
    P[cur].push({resp,alts,def:l.slice(i+2)});
  }
  return P;
}
const POOLS=llegeixPools(DEFINICIONS),POOLS_D=llegeixPools(DIFICILS);
// Per comparar el que escrius: sense accents ni majuscules, la ç com una c
// i la l·l com dues l. Així «canco» val per «cançó».
const pla=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
// a la dificil es diu quantes lletres te: la l·l en son dues i la ç, una
const lletresDe=p=>pla(p.resp).length;
const esBona=(escrit,p)=>[p.resp,...p.alts].some(r=>pla(r)===pla(escrit));
// «Comença per la A» o, si no hi comença, «Conté la Ç»
const comencaPer=(L,p)=>L!=='Ç'&&pla(p.resp)[0]===pla(L);

// ===== ATZAR AMB LLAVOR =====
function hashText(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
  return (h^h>>>16)>>>0;
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function barreja(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== LA RODA DEL DIA =====
// Cada lletra te la seva llista barrejada sempre igual, i cada dia n'agafa la
// seguent: una paraula no torna a sortir fins que no han sortit totes les de
// la seva lletra (de 33 a 42 dies). Com que cada llista fa un llarg diferent,
// les combinacions no es repeteixen.
// La dificil fa el mateix amb les seves llistes i la seva llavor.
const ORDRES={},ORDRES_D={};
for(const L of ORDRE){
  ORDRES[L]=barreja(mulberry(hashText('ABECEDARI-'+L)),POOLS[L].map((_,i)=>i));
  ORDRES_D[L]=barreja(mulberry(hashText('ABECEDARI-DIFICIL-'+L)),POOLS_D[L].map((_,i)=>i));
}
const indexDe=(O,P)=>(L,n)=>O[L][((n-1)%P[L].length+P[L].length)%P[L].length];
const indexDia=indexDe(ORDRES,POOLS),indexDif=indexDe(ORDRES_D,POOLS_D);
function rodaDia(n){return ORDRE.map(L=>({L,...POOLS[L][indexDia(L,n)]}))}
function rodaDificil(n){return ORDRE.map(L=>({L,...POOLS_D[L][indexDif(L,n)]}))}
// La de practica, a l'atzar, pero sense les paraules d'avui
function rodaPractica(n){return ORDRE.map(L=>{
  const ps=POOLS[L],avui=indexDia(L,n);let i;
  do i=Math.floor(Math.random()*ps.length);while(i===avui&&ps.length>1);
  return {L,...ps[i]}})}

const TEMPS=240;              // quatre minuts per a les vint-i-cinc
// La dificil: deu minuts, pero el rellotge nomes corre mentre la tens oberta,
// i la pots fer a estones durant tot el dia. Amb tot el dia i sense rellotge,
// qualsevol les trobaria totes al diccionari.
const TEMPS_DIF=600;
const JOC='abecedari';
let R=null,mode='dia',dia='',numero=0,state='inici',paused=false,revelaT=0,desatT=0;

function diaAvui(){
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(new Date())}
  catch(e){return new Date().toISOString().slice(0,10)}
}
const nomDia=d=>{const[a,m,dd]=d.split('-');return Number(dd)+'/'+Number(m)+'/'+a};
// la primera roda va ser la del 21 d'octubre del 2026
const numeroDe=(d,d0='2026-10-21')=>Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(d0+'T12:00:00Z'))/864e5)+1;
// i la primera dificil, la del 23
const numeroDif=d=>numeroDe(d,'2026-10-23');
const xifra=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

const llegeix=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}};
const desa=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const STATS0={jugades:0,encerts:0,ratxa:0,millor:0,ultim:'',rodona:0};
let stats=llegeix('abecedari-stats',{...STATS0}),statsD=llegeix('abecedari-stats-dificil',{...STATS0});
const statsMode=()=>mode==='dificil'?statsD:stats;

// ===== LA PARTIDA =====
// estat de cada lletra: 0 per fer (blava), 1 encertada (verda), 2 fallada (vermella)
function nova(lletres,temps=TEMPS){return{lletres,estat:Array(25).fill(0),respostes:Array(25).fill(''),cur:0,temps,escrit:'',fi:false,comencada:false}}
// Les del dia es desen a cada resposta i cada segon: si tanques, la trobes
// igual (amb el temps que et quedava) i no la pots tornar a començar.
const delDia=()=>mode==='dia'||mode==='dificil';
const clauDe=(m,d)=>(m==='dificil'?'abecedari-dificil-':'abecedari-')+d;
function desaDia(){
  if(!delDia()||!R)return;
  desa(clauDe(mode,dia),{v:1,estat:R.estat,respostes:R.respostes,cur:R.cur,temps:R.temps,fi:R.fi,comencada:R.comencada});
}
function obre(m){
  mode=m;dia=diaAvui();numero=m==='dificil'?numeroDif(dia):numeroDe(dia);
  R=m==='dificil'?nova(rodaDificil(numero),TEMPS_DIF):nova(rodaDia(numero));
  const d=llegeix(clauDe(m,dia),null);
  if(d&&d.v===1&&d.estat&&d.estat.length===25)Object.assign(R,{estat:d.estat,respostes:d.respostes||R.respostes,cur:d.cur||0,temps:d.temps,fi:d.fi,comencada:d.comencada});
  // en tornar a entrar al joc, s'obre la que feies
  desa('abecedari-ultim',m);
  state='inici';pinta();pintaLider();
  if(R.fi){state='fi';finalPartida();return}
  benvinguda();
}
const obreDia=()=>obre('dia'),obreDificil=()=>obre('dificil');
// Com va la dificil d'avui, per al boto que hi porta
function comVaDif(){
  const d=llegeix(clauDe('dificil',diaAvui()),null);
  return !d?'nova':d.fi?'feta':d.comencada?'mig':'nova';
}
function obrePractica(){
  mode='practica';dia=diaAvui();numero=numeroDe(dia);
  R=nova(rodaPractica(numero));R.comencada=true;
  state='joc';hideMsg();pinta();pintaLider();
}
// El boto gros que porta a la dificil, amb com la tens
function botoDif(){
  const v=comVaDif();
  return v==='feta'?'<a href="#" id="b-dif" style="display:block;margin-top:14px;font:13px monospace;color:#c9a0ff">◆ la difícil d\'avui: ja la tens feta</a>'
    :'<a href="#" class="bt" id="b-dif" style="color:#e2ccff;background:#1e1233;border:1px solid #7a50b0">'+(v==='mig'?'◆ CONTINUA LA DIFÍCIL':'◆ LA DIFÍCIL D\'AVUI')+'</a>'+
     '<small style="color:#a890c8;margin-top:3px">'+(v==='mig'?'la tens a mig fer':'paraules difícils, 10 minuts a estones durant tot el dia')+'</small>';
}
function benvinguda(){
  const fets=R.estat.filter(e=>e).length,dif=mode==='dificil';
  const nom=dif?'LA DIFÍCIL D\'AVUI':'LA RODA D\'AVUI',col=dif?'#c9a0ff':'#f0b429';
  const t=R.comencada
    ?'<div style="color:'+col+'">'+nom+'</div><small>la tenies a mig fer: '+fets+' de 25 lletres i '+mmss(R.temps)+' de rellotge</small>'+
      '<a href="#" class="bt" id="b-comenca" style="color:#1a1200;background:'+col+'">CONTINUA ▸</a>'
    :dif
    ?'<div style="color:'+col+';letter-spacing:.1em">◆ LA DIFÍCIL D\'AVUI</div>'+
      '<small style="color:#a890c8">#'+numero+' · '+nomDia(dia)+' · igual per a tothom</small>'+
      '<small>Vint-i-cinc paraules difícils, de la A a la Z. A cada una et diem <b>quantes lletres té</b>.</small>'+
      '<small>Tens <b>'+(TEMPS_DIF/60)+' minuts</b>, però el rellotge només corre mentre la tens oberta: la pots fer <b>a estones</b> durant tot el dia. Si tanques o surts, es desa sola.</small>'+
      '<a href="#" class="bt" id="b-comenca" style="color:#1a1200;background:'+col+'">COMENÇA ▸</a>'
    :'<div style="color:#f0b429;letter-spacing:.15em">L\'ABECEDARI</div>'+
      '<small style="color:#9fb3e6">roda del dia #'+numero+' · '+nomDia(dia)+'</small>'+
      '<small>Una paraula per a cada lletra. Escriu-la i prem <b>RESPON</b>. Si no la saps, <b>PASSA PARAULA</b>: hi tornaràs quan acabis la volta.</small>'+
      '<small>Tens <b>'+(TEMPS/60)+' minuts</b>, i el rellotge només s\'atura quan s\'ensenya una resposta fallada. Les primeres lletres són fàcils; les últimes, difícils.</small>'+
      '<a href="#" class="bt" id="b-comenca" style="color:#1a1200;background:#f0b429">COMENÇA ▸</a>';
  msg(t+(dif?'<a href="#" id="b-dia" style="display:block;margin-top:14px;font:12px monospace;color:#f0b429">o la roda normal d\'avui</a>':botoDif())+
    '<a href="#" id="b-prac" style="display:block;margin-top:14px;font:12px monospace;color:#9fb3e6">o fes-ne una de pràctica, que no compta</a>');
  enllac('b-comenca',()=>{R.comencada=true;state='joc';hideMsg();desaDia();pinta()});
  enllac('b-prac',obrePractica);enllac('b-dia',obreDia);enllac('b-dif',obreDificil);
}
function enllac(id,fn){const a=document.getElementById(id);if(a)a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();aInit();fn()})}

const pendents=()=>R.estat.reduce((n,e)=>n+(e===0),0);
function seguent(){
  if(!pendents()){acaba();return}
  let i=R.cur;
  do i=(i+1)%25;while(R.estat[i]!==0);
  R.cur=i;R.escrit='';pinta();
}
function respon(){
  if(state!=='joc'||paused)return;
  if(!pla(R.escrit)){sndNo();avisa('escriu la paraula, o PASSA PARAULA');return}
  const p=R.lletres[R.cur];
  if(esBona(R.escrit,p)){R.estat[R.cur]=1;sndBe();desaDia();seguent();return}
  // fallada: es diu quina era, amb el rellotge aturat
  R.estat[R.cur]=2;R.respostes[R.cur]=R.escrit;sndMal();desaDia();
  state='revela';revelaT=2.2;pinta();
}
function passa(){
  if(state!=='joc'||paused)return;
  sndPassa();R.escrit='';seguent();desaDia();
}
function tecla(t){
  if(state!=='joc'||paused)return;
  if(t==='⌫'){R.escrit=R.escrit.slice(0,-1)}
  else if(R.escrit.length<16)R.escrit+=t;
  sndTecla();pintaEscrit();
}
function punts(){
  const be=R.estat.filter(e=>e===1).length;
  return be*100+(pendents()?0:Math.ceil(R.temps));
}
function acaba(){
  if(R.fi&&state==='fi')return;
  state='fi';R.fi=true;R.escrit='';sndFi();
  if(delDia()){
    // les estadistiques nomes es compten una vegada per dia (cada roda les seves)
    const st=statsMode();
    if(st.ultim!==dia){
      const be=R.estat.filter(e=>e===1).length;
      st.jugades++;st.encerts+=be;
      const ahir=new Date(Date.parse(dia+'T12:00:00Z')-864e5).toISOString().slice(0,10);
      st.ratxa=st.ultim===ahir?st.ratxa+1:1;st.millor=Math.max(st.millor,st.ratxa);
      if(be===25)st.rodona++;
      st.ultim=dia;desa(mode==='dificil'?'abecedari-stats-dificil':'abecedari-stats',st);
      R.nova=true;
    }
    desaDia();updateHUD();
  }
  pinta();
  setTimeout(finalPartida,700);
}

// ===== EL QUADRE DEL FINAL =====
function textCompartir(){
  const be=R.estat.filter(e=>e===1).length;
  const files=[0,5,10,15,20].map(i=>R.estat.slice(i,i+5).map(e=>e===1?'🟢':e===2?'🔴':'🔵').join('')).join('\n');
  return 'L\'Abecedari'+(mode==='dia'?' #'+numero:mode==='dificil'?' difícil #'+numero:' (pràctica)')+' · '+be+'/25 · '+xifra(punts())+' punts\n'+files;
}
let enFinal=false;
async function finalPartida(){
  if(enFinal)return;enFinal=true;
  try{
    if(!R||!R.fi){msg('<div style="color:#f0b429">L\'ABECEDARI</div><small>la roda encara és a mig fer</small>'+Records.peuFinal('o toca per tancar'));return}
    const be=R.estat.filter(e=>e===1).length,mal=R.estat.filter(e=>e===2).length,res=25-be-mal,pt=punts();
    const dif=mode==='dificil',st=statsMode();
    let t='<div style="color:'+(be===25?'#7dff9b':dif?'#c9a0ff':'#f0b429')+'">'+(be===25?(dif?'DIFÍCIL PERFECTA!':'RODA PERFECTA!'):mode==='dia'?'LA RODA D\'AVUI':dif?'◆ LA DIFÍCIL D\'AVUI':'RODA DE PRÀCTICA')+'</div>'+
      '<div style="font-size:34px;font-weight:bold">'+be+'<span style="font-size:18px;color:#9fb3e6"> de 25</span></div>'+
      '<small style="color:#ccc">'+be+' encerts × 100'+(res?'':' + '+Math.ceil(R.temps)+' segons que et sobren')+' = <b style="color:#fff">'+xifra(pt)+' punts</b></small>'+
      '<small style="color:#9fb3e6">'+mal+(mal===1?' fallada':' fallades')+(res?' · '+res+' sense respondre':'')+'</small>';
    if(mode==='practica')t+='<small style="color:#a08860">és de PRÀCTICA: no compta per a cap taula</small>';
    else t+='<small style="color:#aaa">ratxa: '+st.ratxa+' · la millor: '+st.millor+' · '+st.encerts+' encerts en '+st.jugades+(st.jugades===1?' dia':' dies')+(dif?' de difícils':'')+'</small>';
    // les que no has encertat, amb la definicio i la resposta: aixi s'apren
    const fallades=R.lletres.map((p,i)=>({p,i})).filter(({i})=>R.estat[i]!==1);
    if(fallades.length)t+='<div class="fallades">'+fallades.map(({p,i})=>
      '<div><b style="color:'+(R.estat[i]===2?'#ff8a7a':'#9fd0ff')+'">'+p.L+'</b> '+p.def+' <b style="color:#fff">'+p.resp.toUpperCase()+'</b>'+
      (R.estat[i]===2&&R.respostes[i]?' <span style="color:#777">(vas posar '+R.respostes[i].toUpperCase()+')</span>':'')+'</div>').join('')+'</div>';
    const enl=location.href.split('#')[0],tx=textCompartir();
    t+='<div class="reptes">'+
      '<a target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(enl)+'&text='+encodeURIComponent(tx)+'">ENVIA A TELEGRAM</a>'+
      '<a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(tx+'\n'+enl)+'">A WHATSAPP</a>'+
      '<a href="#" id="copia">COPIA</a></div>';
    t+='<div id="taula" style="margin:8px 0;color:#888;font-size:12px">…</div>';
    if(mode!=='dificil'&&comVaDif()!=='feta')t+=botoDif();
    t+='<a href="#" class="bt" id="b-prac" style="color:#9fd0ff;background:#0f1e33;border:1px solid #3a6aa0">'+(mode==='practica'?'UNA ALTRA DE PRÀCTICA':'FES-NE UNA DE PRÀCTICA')+'</a>';
    if(mode!=='dia')t+='<a href="#" id="b-dia" style="display:block;margin-top:12px;font:12px monospace;color:#f0b429">'+(dif?'la roda normal d\'avui':'torna a la roda d\'avui')+'</a>';
    if(mode!=='dificil'&&comVaDif()==='feta')t+='<a href="#" id="b-dif" style="display:block;margin-top:12px;font:12px monospace;color:#c9a0ff">◆ com et va anar la difícil d\'avui</a>';
    msg(t+Records.peuFinal(delDia()?'demà n\'hi haurà una altra':'o toca per tancar'));
    lligaCopia(tx+'\n'+enl);
    enllac('b-prac',obrePractica);enllac('b-dia',obreDia);enllac('b-dif',obreDificil);
    // Les dues taules, cadascuna amb el seu titol: la d'avui (els punts de la
    // roda del dia; nomes compta el primer cop que l'acabes) i la dels
    // encerts de sempre, on cadascu surt una vegada.
    // La dificil va a la seva taula del dia, i prou: els encerts de sempre
    // son els de la roda normal.
    let r={html:'',posicio:0};
    const taulaDia=(dif?JOC+'_dificil_dia/':JOC+'_dia/')+(delDia()?dia:diaAvui());
    if(delDia()&&R.nova&&pt>0)r=await Records.fiPartida(taulaDia,pt);
    else r.html=Records.taulaHTML(await Records.llista(taulaDia));
    if(mode==='dia'&&R.nova&&stats.encerts>0&&Records.nom())await Records.envia(JOC,stats.encerts);
    if(delDia())R.nova=false;
    const sempre=Records.taulaHTML(await Records.llista(JOC));
    const titol=t2=>'<div style="color:#f0b429;font-size:13px;margin-top:8px">'+t2+'</div>';
    const el=document.getElementById('taula');
    if(el&&dif)el.innerHTML=titol('◆ LA DIFÍCIL D\'AVUI')+r.html+
      (r.posicio===1?'<div style="color:#ff0;font-size:13px">ARA MATEIX GUANYES LA DIFÍCIL D\'AVUI!<br><span style="color:#aaa">demà al matí el bot ho dirà al grup</span></div>':
       r.posicio?'<div style="color:#ff0;font-size:13px">Ets el número '+r.posicio+' de la difícil d\'avui!</div>':'');
    else if(el)el.innerHTML=titol('☀ LA RODA D\'AVUI')+r.html+
      (r.posicio===1?'<div style="color:#ff0;font-size:13px">ARA MATEIX GUANYES LA D\'AVUI!<br><span style="color:#aaa">demà al matí el bot ho dirà al grup</span></div>':
       r.posicio?'<div style="color:#ff0;font-size:13px">Ets el número '+r.posicio+' d\'avui!</div>':'')+
      titol('★ ENCERTS DE SEMPRE')+sempre;
    Records.pintaMillor(JOC,document.getElementById('best'),stats.encerts);
    refrescaLiders();
  }finally{enFinal=false}
}
function lligaCopia(text){
  const cp=document.getElementById('copia');
  if(cp)cp.addEventListener('click',async e=>{
    e.preventDefault();e.stopPropagation();
    try{await navigator.clipboard.writeText(text);cp.textContent='COPIAT!'}
    catch(err){prompt('Copia això:',text)}
  });
}
function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}
function updateHUD(){
  document.getElementById('score').textContent=stats.encerts;
  Records.desaLocal(JOC,stats.encerts);
  Records.marcador(JOC,document.getElementById('best'),stats.encerts);

// ===== DIBUIX =====
const $=id=>document.getElementById(id);
const RODA=$('roda'),CERCLES=ORDRE.map(L=>{const d=document.createElement('div');d.className='ll';d.textContent=L;RODA.appendChild(d);return d});
let mida=300;
// La roda fa el que hi capi: l'amplada o l'alçada que quedi lliure
function mesura(){
  const s=$('screen');
  mida=Math.max(150,Math.floor(Math.min(s.clientWidth*.96,s.clientHeight-4)));
  RODA.style.width=RODA.style.height=mida+'px';
  const c=mida*.105,r=mida/2-c*.62-mida*.012;      // la lletra que toca es fa un 22% mes grossa: ha de cabre
  CERCLES.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/25;
    d.style.width=d.style.height=c+'px';d.style.fontSize=(c*.55)+'px';
    d.style.left=(mida/2+r*Math.cos(a)-c/2)+'px';d.style.top=(mida/2+r*Math.sin(a)-c/2)+'px'});
  const ce=$('centre');ce.style.width=(mida*.62)+'px';
  $('rellotge').style.fontSize=(mida*.07)+'px';$('mode').style.fontSize=(mida*.045)+'px';
  $('lletra').style.fontSize=(mida*.2)+'px';$('escrit').style.fontSize=(mida*.075)+'px';$('compte').style.fontSize=(mida*.045)+'px';
}
addEventListener('resize',mesura);
function pintaEscrit(){
  pintaCompte();
  const e=$('escrit');
  e.textContent=state==='revela'?R.respostes[R.cur].toUpperCase():(R.escrit.toUpperCase()||' ');
  e.style.color=state==='revela'?'#ff8a7a':'#fff';
  e.style.textDecoration=state==='revela'?'line-through':'none';
}
function pinta(){
  if(!R)return;
  const p=R.lletres[R.cur];
  CERCLES.forEach((d,i)=>{d.className='ll'+(R.estat[i]===1?' be':R.estat[i]===2?' mal':'')+(i===R.cur&&(state==='joc'||state==='revela')?' ara':'')});
  $('lletra').textContent=p.L;
  $('mode').textContent=comencaPer(p.L,p)?'COMENÇA PER':'CONTÉ LA';
  pintaEscrit();
  const df=$('def');
  if(paused){df.className='';df.textContent=mode==='dificil'?'PAUSA · es desa sola: pots tancar i tornar-hi més tard':'PAUSA';}
  else if(state==='revela'){df.className='era';df.innerHTML='No! Era <b>'+p.resp.toUpperCase()+'</b>'}
  else if(state==='inici'){df.className='';df.textContent=mode==='dia'?'Roda del dia #'+numero:mode==='dificil'?'La difícil d\'avui #'+numero:'Pràctica'}
  else if(state==='fi'){df.className='';df.textContent=R.estat.filter(e=>e===1).length+' de 25 · '+xifra(punts())+' punts'}
  else{
    // tot dins d'un sol span: el quadre es flex i, si no, el text i el
    // compte de lletres sortirien com dues columnes
    df.className='';const sp=document.createElement('span');sp.textContent=p.def;
    if(mode==='dificil'){const n=document.createElement('span');n.className='nl';n.textContent=' · '+lletresDe(p)+' lletres';sp.appendChild(n)}
    df.replaceChildren(sp);
  }
  pintaRellotge();
}
// A sota del que escrius: els encerts i les fallades, i a la dificil, les
// lletres que portes de les que té
function pintaCompte(){
  const be=R.estat.filter(e=>e===1).length,mal=R.estat.filter(e=>e===2).length;
  const n=mode==='dificil'&&state==='joc'?' &nbsp; <span style="color:#c9a0ff">'+pla(R.escrit).length+'/'+lletresDe(R.lletres[R.cur])+'</span>':'';
  $('compte').innerHTML='<span style="color:#7dd99a">✓ '+be+'</span> &nbsp; <span style="color:#ff8a7a">✗ '+mal+'</span>'+n;
}
function pintaRellotge(){const r=$('rellotge');r.textContent=mmss(R.temps);r.className=R.temps<30&&!R.fi?'poc':''}
let avisT=0;
function avisa(t){const l=$('lider');l.textContent=t;l.style.color='#ffb3a8';avisT=1.6}
let liderDia=null,liderSempre=null,liderDif=null;
function pintaLider(){
  if(avisT>0)return;
  const l=$('lider');l.style.color=mode==='dificil'?'#c9a0ff':'#c9b28a';
  l.textContent=mode==='dificil'?'◆ LA DIFÍCIL D\'AVUI: '+(liderDif?liderDif.n+' '+xifra(liderDif.p):'ningú')
    :'☀ AVUI: '+(liderDia?liderDia.n+' '+xifra(liderDia.p):'ningú')+'  ·  DE SEMPRE: '+(liderSempre?liderSempre.n+' '+liderSempre.p:'ningú');
}
async function refrescaLiders(){
  try{liderDia=await Records.lider(JOC+'_dia/'+diaAvui());liderSempre=await Records.lider(JOC);liderDif=await Records.lider(JOC+'_dificil_dia/'+diaAvui())}catch(e){}
  pintaLider();
}

// ===== EL RELLOTGE =====
let last=performance.now();
function loop(t){
  const dt=Math.min(.1,(t-last)/1000);last=t;
  if(!paused&&R){
    if(state==='joc'){
      const abans=Math.ceil(R.temps);R.temps-=dt;
      if(Math.ceil(R.temps)!==abans&&R.temps<10&&R.temps>0)sndTic();
      if(Math.ceil(R.temps)!==abans)pintaRellotge();
      desatT+=dt;if(desatT>1){desatT=0;desaDia()}
      if(R.temps<=0){R.temps=0;acaba()}
    }else if(state==='revela'){
      revelaT-=dt;if(revelaT<=0){state='joc';seguent()}
    }
  }
  if(avisT>0){avisT-=dt;if(avisT<=0)pintaLider()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function posaPausa(v){
  paused=v;if(paused)desaDia();pinta();
}
// si surts de l'app (una trucada, un missatge), el rellotge s'atura
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='joc'||state==='revela')posaPausa(true);desaDia()}});
addEventListener('pagehide',desaDia);

// ===== EL TECLAT =====
// Un teclat propi a la pantalla: el del mobil taparia mitja roda.
const FILES=['QWERTYUIOP','ASDFGHJKLÇ','ZXCVBNM⌫'];
for(const f of FILES){
  const d=document.createElement('div');d.className='fila';
  for(const t of f){const b=document.createElement('button');b.className='k'+(t==='⌫'?' esb':'');b.textContent=t;b.dataset.t=t;d.appendChild(b)}
  $('teclat').appendChild(d);
}
function boto(el,fn){el.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();if(paused){posaPausa(false);return}fn(ev)})}
boto($('teclat'),ev=>{const b=ev.target.closest('.k');if(b)tecla(b.dataset.t)});
boto($('passa'),passa);
boto($('respon'),respon);
boto($('roda'),()=>{if(state==='fi')finalPartida()});
boto($('def'),()=>{if(state==='fi')finalPartida()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  aInit();
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  // el boto de pausa del marcador envia una P de mentida; la P de debo s'escriu
  if((e.code==='KeyP'&&!e.isTrusted)||e.key==='Escape'){posaPausa(!paused);return}
  if(paused){if(e.key==='Enter'||e.key===' ')posaPausa(false);return}
  if(e.key==='Enter'){e.preventDefault();if(pla(R?R.escrit:''))respon();else passa();return}
  if(e.key==='Backspace'){e.preventDefault();tecla('⌫');return}
  const k=(e.key||'').toUpperCase();
  if(/^[A-ZÇ]$/.test(k)&&!e.ctrlKey&&!e.metaKey&&!e.altKey)tecla(k);
});
document.getElementById('msg').addEventListener('click',e=>{if(!e.target.closest('a')&&state==='fi')hideMsg()});

mesura();
updateHUD();
Records.pintaMillor(JOC,document.getElementById('best'),stats.encerts);
refrescaLiders();
// En entrar, s'obre la que feies: si l'ultima vegada eres a la dificil i la
// tens a mig fer, la dificil; si no, la roda normal.
if(llegeix('abecedari-ultim','')==='dificil'&&comVaDif()==='mig')obreDificil();else obreDia();

// En entrar al joc, els records uns segons, com les maquines de debo.
Records.pantallaInicial(JOC,()=>paused=true,()=>{paused=false;pinta()},
  [['☀ LA RODA D\'AVUI',JOC+'_dia/'+diaAvui()],['◆ LA DIFÍCIL D\'AVUI',JOC+'_dificil_dia/'+diaAvui()],['★ ENCERTS DE SEMPRE',JOC]]);
</script>
