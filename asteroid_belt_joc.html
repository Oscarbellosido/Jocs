<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroid Belt</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font:18px monospace}canvas{width:100%;height:100%;display:block}#h{position:fixed;top:38px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:14px}#h span{white-space:nowrap}#s{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000}button{background:#111;color:#fff;border:2px solid #aaa;padding:14px 25px;font:20px monospace;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}#t{display:none;position:fixed;bottom:12px;left:12px;right:12px;justify-content:space-between}#hy{border-color:#a060d0;color:#c890f0}@media(max-width:700px){#t{display:flex;align-items:flex-end;gap:6px}#t>div:first-child{white-space:nowrap}#t button{padding:10px 9px;font:15px monospace;min-width:46px}
/* El HIPER anava enganxat sobre el FIRE, a sis pixels: el piques sense voler
   i et teletransportes (i una de cada vuit vegades et mata). Ara va al mig i
   ben amunt, lluny d'on tens els dos polzes. */
#t #mig{margin-bottom:126px}#t #hy{padding:7px 8px;font:12px monospace;min-width:0}#t #f{padding:14px 12px;font:17px monospace;min-width:60px}}</style>
<canvas id=c></canvas><div id=h><span id=sc>SCORE 00000</span><span id=hi style="color:#ff0">BEST 00000</span><span id=li>LIVES 3</span></div>
<a href="index.html" style="position:fixed;top:10px;left:10px;color:#aaa;font-size:13px;text-decoration:none;background:#111;padding:4px 12px;border:1px solid #444;border-radius:6px">← Tornar</a>
<div id=s style="display:none"></div>
<div id=t><div><button data-k=ArrowLeft>◀</button><button data-k=ArrowUp>▲</button><button data-k=ArrowRight>▶</button></div><div id=mig><button id=hy>HIPER</button></div><div><button id=f>FIRE</button></div></div>
<script src="records.js"></script>
<script>
// === SOUND ENGINE ===
let AC=null,MG=null;
function aInit(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.15;MG.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}
function tone(f,d,type='square',vol=.3,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(MG);o.start(n);o.stop(n+d+.02)}
function noise(d=.15,vol=.3){if(!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),dt=b.getChannelData(0);for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),g=AC.createGain(),now=AC.currentTime;s.buffer=b;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);s.connect(g);g.connect(MG);s.start();s.stop(now+d)}
function sndShoot(){aInit();tone(800,.07,'sawtooth',.25,-650)}
function sndBoom(big){aInit();noise(big?.25:.14,big?.35:.22);tone(big?80:120,big?.2:.1,'square',.2,-60)}
function sndThrust(){aInit();tone(60,.06,'sawtooth',.08)}
function sndDie(){aInit();noise(.3,.4);tone(220,.1,'square',.25,-160);setTimeout(()=>tone(100,.3,'square',.25,-80),110)}
function sndWave(){aInit();[440,550,660].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.2),i*100))}
function sndHyper(){aInit();tone(900,.18,'sine',.2,-800)}
function sndExtra(){aInit();[880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.22),i*70))}
function sndUfo(){aInit();tone(880,.06,'square',.15,-220);setTimeout(()=>tone(660,.06,'square',.15,-180),65)}
function sndUfoHit(){aInit();noise(.22,.35);tone(300,.18,'square',.28,-250)}
// ===================
let c=document.getElementById('c'),x=c.getContext('2d'),W,H,ship,A=[],B=[],P=[],UB=[],U=null,uTimer=8,keys={},score,lives,on=false,last=0,wave=1,nextExtra=10000;
// tres mides com l'original: gran 20 punts, mitja 50, petita 100
const BIG=30,MED=17,SMALL=10;
function rockPoints(r){return r>25?20:r>13?50:100}
function die(){boom(ship.x,ship.y);sndDie();lives--;ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;ship.inv=2;if(lives<=0){on=false;s.innerHTML='<div>GAME OVER<br><br><button onclick="start()">RESTART</button></div>';s.style.display='flex';finalPartida()}}
// hiperespai: et treu d'un embolic, amb el risc de l'original
function hyper(){if(!on||ship.hyp>0)return;ship.hyp=.8;ship.x=Math.random()*W;ship.y=Math.random()*H;ship.vx=ship.vy=0;sndHyper();if(Math.random()<.12)die();else ship.inv=1}
function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',size);size();
function wrap(o){if(o.x<0)o.x=W;if(o.x>W)o.x=0;if(o.y<0)o.y=H;if(o.y>H)o.y=0}
function rock(X,Y,r){let q=[];for(let i=0;i<9;i++){let a=i*6.283/9,R=r*(.7+Math.random()*.3);q.push([Math.cos(a)*R,Math.sin(a)*R])}let a=Math.random()*6.283,v=25+Math.random()*35;return{x:X,y:Y,r, q,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:Math.random()*6.283}}
function start(){score=0;lives=3;wave=1;nextExtra=10000;A=[];B=[];P=[];UB=[];U=null;uTimer=6+Math.random()*6;ship={x:W/2,y:H/2,a:-1.57,vx:0,vy:0,c:0,inv:2,hyp:0};spawnWave();on=true;s.style.display='none';hud()}
// 4 asteroides a la primera onada i dos mes a cada onada, fins a 11
function spawnWave(){const n=Math.min(4+(wave-1)*2,11);for(let i=0;i<n;i++){let a=i*6.283/n+.3,d=Math.min(W,H)*.34;A.push(rock(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,BIG))}}
const JOC='asteroids';
let best=Records.local(JOC);
Records.pintaMillor(JOC,hi);   // les inicials de qui mana
function saveBest(){
  if(score>best){best=score;Records.desaLocal(JOC,score)}
  Records.marcador(JOC,hi,score);
}
async function finalPartida(){
  const r=await Records.fiPartida(JOC,score);
  Records.panell('<b style="font-size:22px">GAME OVER</b>'+
    (r.posicio?'<br><small style="color:#ff0">Ets el número '+r.posicio+'!</small>':''), r.html);
  Records.pintaMillor(JOC,hi,score);
}
function hud(){if(score>=nextExtra){nextExtra+=10000;lives++;sndExtra()}sc.textContent='SCORE '+String(score).padStart(5,'0');li.textContent='LIVES '+lives;saveBest()}
function fire(){if(!on||ship.c>0||B.length>=4)return;ship.c=.18;sndShoot();let v=330;B.push({x:ship.x+Math.cos(ship.a)*18,y:ship.y+Math.sin(ship.a)*18,vx:ship.vx+Math.cos(ship.a)*v,vy:ship.vy+Math.sin(ship.a)*v,t:1})}
function boom(X,Y,big=false){sndBoom(big);for(let i=0;i<15;i++){let a=Math.random()*6.283,v=40+Math.random()*100;P.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.6+Math.random()*.5})}}
function update(dt){if(!on)return;if(keys.ArrowLeft)ship.a-=3.5*dt;if(keys.ArrowRight)ship.a+=3.5*dt;if(keys.ArrowUp){ship.vx+=Math.cos(ship.a)*150*dt;ship.vy+=Math.sin(ship.a)*150*dt}ship.vx*=.985;ship.vy*=.985;ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship);ship.c-=dt;ship.inv-=dt;if(ship.hyp>0)ship.hyp-=dt;if(keys[' '])fire();
for(let i=B.length-1;i>=0;i--){let b=B[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b);if(b.t<=0)B.splice(i,1)}
A.forEach(r=>{r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=(Math.random()-.5)*.03;wrap(r)});
for(let i=P.length-1;i>=0;i--){let p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;if(p.t<=0)P.splice(i,1)}
for(let i=A.length-1;i>=0;i--){let r=A[i],hit=false;for(let j=B.length-1;j>=0;j--){let b=B[j],dx=b.x-r.x,dy=b.y-r.y;if(dx*dx+dy*dy<(r.r+5)**2){B.splice(j,1);A.splice(i,1);score+=rockPoints(r.r);boom(r.x,r.y,r.r>25);if(r.r>25){A.push(rock(r.x,r.y,MED),rock(r.x,r.y,MED))}else if(r.r>13){A.push(rock(r.x,r.y,SMALL),rock(r.x,r.y,SMALL))}hit=true;break}}if(hit)continue;if(ship.inv<=0){let dx=ship.x-r.x,dy=ship.y-r.y;if(dx*dx+dy*dy<(r.r+14)**2){A.splice(i,1);die()}}}if(A.length===0){sndWave();wave++;spawnWave()}
// UFO
uTimer-=dt;
if(uTimer<=0&&!U){let fl=Math.random()<.5,big=Math.random()<.6;U={x:fl?-30:W+30,y:H*(.2+Math.random()*.6),vx:fl?70:-70,r:big?18:10,big,sT:0,shT:big?2.5:1.8};uTimer=15+Math.random()*15}
if(U){U.x+=U.vx*dt;U.sT-=dt;if(U.sT<=0){sndUfo();U.sT=U.big?.8:.5}U.shT-=dt;if(U.shT<=0&&ship){let ang=Math.atan2(ship.y-U.y,ship.x-U.x)+(Math.random()-.5)*(U.big?1.1:.45),sv=180;UB.push({x:U.x,y:U.y,vx:Math.cos(ang)*sv,vy:Math.sin(ang)*sv,t:3});U.shT=U.big?2.5:1.8}if(U.x<-60||U.x>W+60)U=null}
if(U){for(let j=B.length-1;j>=0;j--){let b=B[j],dx=b.x-U.x,dy=b.y-U.y;if(dx*dx+dy*dy<(U.r+5)**2){B.splice(j,1);score+=U.big?200:1000;boom(U.x,U.y,true);sndUfoHit();U=null;break}}}
for(let i=UB.length-1;i>=0;i--){let b=UB[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b);if(b.t<=0)UB.splice(i,1)}
if(ship.inv<=0){for(let i=UB.length-1;i>=0;i--){let b=UB[i],dx=b.x-ship.x,dy=b.y-ship.y;if(dx*dx+dy*dy<361){UB.splice(i,1);die();break}}}
hud()}
function draw(){x.fillStyle='#000';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=2;A.forEach(r=>{x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();r.q.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();x.restore()});B.forEach(b=>x.fillRect(b.x-2,b.y-2,4,4));
// UFO bullets
x.fillStyle='#f80';UB.forEach(b=>x.fillRect(b.x-2,b.y-2,4,4));
// UFO saucer
if(U){x.save();x.translate(U.x,U.y);x.strokeStyle='#0f0';x.lineWidth=2;x.fillStyle='#001a00';x.beginPath();x.ellipse(0,0,U.r,U.r*.45,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#001a00';x.beginPath();x.ellipse(0,-U.r*.2,U.r*.55,U.r*.4,0,Math.PI,0);x.fill();x.stroke();x.restore()}
P.forEach(p=>{x.globalAlpha=p.t;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;if(ship&&on&&!(ship.inv>0&&Math.floor(ship.inv*10)%2)){x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);x.beginPath();x.moveTo(19,0);x.lineTo(-13,-11);x.lineTo(-8,0);x.lineTo(-13,11);x.closePath();x.stroke();if(keys.ArrowUp){x.beginPath();x.moveTo(-10,-4);x.lineTo(-22,0);x.lineTo(-10,4);x.stroke()}x.restore()}}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}document.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('keydown',e=>{aInit();keys[e.key]=1;if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();if(e.key==='Enter'&&!on)start();if(e.key==='h'||e.key==='H')hyper()});addEventListener('keyup',e=>keys[e.key]=0);document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>{aInit();keys[b.dataset.k]=1};b.onpointerup=()=>keys[b.dataset.k]=0;b.onpointercancel=()=>keys[b.dataset.k]=0});f.onpointerdown=()=>{aInit();keys[' ']=1;fire()};f.onpointerup=()=>keys[' ']=0;hy.onpointerdown=e=>{e.preventDefault();aInit();hyper()};requestAnimationFrame(loop);
start();
Records.pantallaInicial(JOC,()=>on=false,()=>on=true);
</script>
