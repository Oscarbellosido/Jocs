<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroid Belt</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font:18px monospace}canvas{width:100%;height:100%;display:block}#h{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between}#s{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000}button{background:#111;color:#fff;border:2px solid #aaa;padding:14px 25px;font:20px monospace}#t{display:none;position:fixed;bottom:12px;left:12px;right:12px;justify-content:space-between}@media(max-width:700px){#t{display:flex}}</style>
<canvas id=c></canvas><div id=h><span id=sc>SCORE 00000</span><span id=li>LIVES 3</span></div>
<a href="index.html" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#aaa;font-size:13px;text-decoration:none;background:#111;padding:4px 12px;border:1px solid #444;border-radius:6px">← Tornar</a>
<div id=s><div><b>ASTEROID BELT</b><br><br><button id=go>START</button><br><br><small>← → girar · ↑ acelerar · SPACE disparar</small></div></div>
<div id=t><div><button data-k=ArrowLeft>◀</button><button data-k=ArrowUp>▲</button><button data-k=ArrowRight>▶</button></div><button id=f>FIRE</button></div>
<script>
let c=document.getElementById('c'),x=c.getContext('2d'),W,H,ship,A=[],B=[],P=[],keys={},score,lives,on=false,last=0;
function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',size);size();
function wrap(o){if(o.x<0)o.x=W;if(o.x>W)o.x=0;if(o.y<0)o.y=H;if(o.y>H)o.y=0}
function rock(X,Y,r){let q=[];for(let i=0;i<9;i++){let a=i*6.283/9,R=r*(.7+Math.random()*.3);q.push([Math.cos(a)*R,Math.sin(a)*R])}let a=Math.random()*6.283,v=25+Math.random()*35;return{x:X,y:Y,r, q,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:Math.random()*6.283}}
function start(){score=0;lives=3;A=[];B=[];P=[];ship={x:W/2,y:H/2,a:-1.57,vx:0,vy:0,c:0,inv:2};for(let i=0;i<4;i++){let a=i*1.57+.3,d=Math.min(W,H)*.28;A.push(rock(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,30))}on=true;s.style.display='none';hud()}
function hud(){sc.textContent='SCORE '+String(score).padStart(5,'0');li.textContent='LIVES '+lives}
function fire(){if(!on||ship.c>0)return;ship.c=.18;let v=330;B.push({x:ship.x+Math.cos(ship.a)*18,y:ship.y+Math.sin(ship.a)*18,vx:ship.vx+Math.cos(ship.a)*v,vy:ship.vy+Math.sin(ship.a)*v,t:1})}
function boom(X,Y){for(let i=0;i<15;i++){let a=Math.random()*6.283,v=40+Math.random()*100;P.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.6+Math.random()*.5})}}
function update(dt){if(!on)return;if(keys.ArrowLeft)ship.a-=3.5*dt;if(keys.ArrowRight)ship.a+=3.5*dt;if(keys.ArrowUp){ship.vx+=Math.cos(ship.a)*150*dt;ship.vy+=Math.sin(ship.a)*150*dt}ship.vx*=.985;ship.vy*=.985;ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship);ship.c-=dt;ship.inv-=dt;if(keys[' '])fire();
for(let i=B.length-1;i>=0;i--){let b=B[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b);if(b.t<=0)B.splice(i,1)}
A.forEach(r=>{r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=(Math.random()-.5)*.03;wrap(r)});
for(let i=P.length-1;i>=0;i--){let p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;if(p.t<=0)P.splice(i,1)}
for(let i=A.length-1;i>=0;i--){let r=A[i],hit=false;for(let j=B.length-1;j>=0;j--){let b=B[j],dx=b.x-r.x,dy=b.y-r.y;if(dx*dx+dy*dy<(r.r+5)**2){B.splice(j,1);A.splice(i,1);score+=100;boom(r.x,r.y);if(r.r>19){A.push(rock(r.x,r.y,r.r*.58),rock(r.x,r.y,r.r*.58))}hit=true;break}}if(hit)continue;if(ship.inv<=0){let dx=ship.x-r.x,dy=ship.y-r.y;if(dx*dx+dy*dy<(r.r+14)**2){A.splice(i,1);boom(ship.x,ship.y);lives--;ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;ship.inv=2;if(lives<=0){on=false;s.innerHTML='<div>GAME OVER<br><br><button onclick="start()">RESTART</button></div>';s.style.display='flex'}}}}if(A.length===0){for(let i=0;i<4;i++)A.push(rock(Math.random()*W,Math.random()*H,30));score+=500}hud()}
function draw(){x.fillStyle='#000';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=2;A.forEach(r=>{x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();r.q.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();x.restore()});B.forEach(b=>x.fillRect(b.x-2,b.y-2,4,4));P.forEach(p=>{x.globalAlpha=p.t;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;if(ship&&on&&!(ship.inv>0&&Math.floor(ship.inv*10)%2)){x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);x.beginPath();x.moveTo(19,0);x.lineTo(-13,-11);x.lineTo(-8,0);x.lineTo(-13,11);x.closePath();x.stroke();if(keys.ArrowUp){x.beginPath();x.moveTo(-10,-4);x.lineTo(-22,0);x.lineTo(-10,4);x.stroke()}x.restore()}}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}go.onclick=start;addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();if(e.key==='Enter'&&!on)start()});addEventListener('keyup',e=>keys[e.key]=0);document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.k]=1;b.onpointerup=()=>keys[b.dataset.k]=0;b.onpointercancel=()=>keys[b.dataset.k]=0});f.onpointerdown=()=>{keys[' ']=1;fire()};f.onpointerup=()=>keys[' ']=0;requestAnimationFrame(loop);
</script>
