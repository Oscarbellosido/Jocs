<script>

// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type="square",vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+dur);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.005);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(MG);o.start(now);o.stop(now+dur+.02);
}
function noise(dur=.12,vol=.25){
  if(!AC)return;
  const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate);
  const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(),g=AC.createGain(),now=AC.currentTime;
  s.buffer=b;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  s.connect(g);g.connect(MG);s.start();s.stop(now+dur);
}
// el mos alterna de to, com el "wakka wakka" de les maquines
let mos=0;
function sndMos(){aInit();mos=1-mos;tone(mos?440:330,.05,"square",.18)}
function sndMor(){aInit();noise(.3,.3);[400,300,200,120].forEach((f,i)=>setTimeout(()=>tone(f,.18,"square",.25,-80),i*130))}
function sndNivell(){aInit();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.13,"square",.26),i*110))}
function sndFi(){aInit();[300,240,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.3,"square",.26,-60),i*240))}

const c=document.getElementById('game'),x=c.getContext('2d');
const W=380,H=420;
const CELA=20, COLS=19, FILES=17;
const DALT=40;                       // franja de dalt: laberint i temps

// Els laberints: passadissos amples amb pilars d'UNA casella, i les columnes
// senars sempre obertes. Aixi, des d'on siguis i anant on vagis, tens una
// sortida a una casella de distancia.
//
// Els primers els vaig fer amb blocs de tres i les files de pilars nomes
// s'obrien cada quatre columnes: llliscaves amunt i dues caselles despres
// t'estampaves sense haver pogut fer res. Ho comprova el scripts/prova-cuc.mjs.
const LABERINTS=[
`###################
#.................#

#..#..#..#..#..#..#

`###################

#.#.#.#.#.#.#.#.#.#
#.................#
#.#.#.#.#.#.#.#.#.#
#.................#
#.#.#.#.#.#.#.#.#.#
#.................#
#.#.#.#.#.#.#.#.#.#
#.................#
#.#.#.#.#.#.#.#.#.#
#.................#
#.#.#.#.#.#.#.#.#.#
#.................#
#.#.#.#.#.#.#.#.#.#
#.................#
###################`,
`###################
#.................#
#.##...##.##...##.#
#.................#
#.##...##.##...##.#
#.................#
#.##...##.##...##.#
#.................#
#.##...##.##...##.#
#.................#
#.##...##.##...##.#
#.................#
#.##...##.##...##.#
#.................#
#.##...##.##...##.#
#.................#
###################`,
`###################
#.................#
#.#..##..##..#..#.#

#.#..##..##..#..#.#
#.................#
#.#..##..##..#..#.#
#.................#
###################`
];

// Un punt de cada tres et fa mes llarg. Amb un per punt, en mig laberint la
// serp ja no cabia enlloc: hi ha mes de 190 caselles buides i el laberint
// s'ha de poder acabar.
const CREIX_CADA=3;
const LLARG_INICI=5;
const VIDES=3;

let mapa=[],serp=[],dir={x:1,y:0},seguentDir=null,seguentVida=0;
let punts=0,nivell=1,vides=VIDES,queden=0,menjats=0,creixPend=0;
let state='play',paused=false,acum=0,bonus=0,espera=0,titolT=0;

const JOC='nibbler';
Records.migra(JOC,null);
let bestScore=Records.local(JOC);
Records.pintaMillor(JOC,document.getElementById('best'));
function saveBest(){
  if(punts>bestScore){bestScore=punts;Records.desaLocal(JOC,punts)}
  Records.marcador(JOC,document.getElementById('best'),punts);
}
function updateHUD(){
  document.getElementById('score').textContent=punts;
  document.getElementById('lives').textContent=vides;
  saveBest();
}
function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}

// cada laberint va una mica mes de pressa
function msPerPas(){return Math.max(85,175-(nivell-1)*10)}

function carregaLaberint(){
  const txt=LABERINTS[(nivell-1)%LABERINTS.length];
  mapa=txt.trim().split('\n').map(f=>f.split(''));
  queden=0;
  for(const f of mapa)for(const ce of f)if(ce==='.')queden++;
  bonus=2000+queden*10;
  posaSerp();
  menjats=0;creixPend=0;
  espera=800;                        // un moment per veure on ets abans d'arrencar
}
// On comenca: el tram recte mes llarg del mig del laberint, que aixi sempre
// hi ha on arrencar i no surts mirant una paret.
function trobaInici(){
  let millor=null;
  for(let f=1;f<FILES-1;f++){
    let ini=-1;
    for(let co=1;co<=COLS-1;co++){
      const lliure=co<COLS-1&&mapa[f][co]!=='#';
      if(lliure&&ini<0)ini=co;
      if(!lliure&&ini>=0){
        const llarg=co-ini;
        const dist=Math.abs(f-(FILES-1)/2);
        if(llarg>=LLARG_INICI+7&&(!millor||llarg>millor.llarg||
           (llarg===millor.llarg&&dist<millor.dist))){
          millor={f,ini,llarg,dist};
        }
        ini=-1;
      }
    }
  }
  return millor;
}
function posaSerp(){
  const t=trobaInici();
  // El cap va al PRINCIPI del tram, no al final: sortint al final tenia la
  // paret a la casella del costat i, a 175 mil·lèsimes per casella, o giraves
  // a l'acte o t'estampaves. Així hi ha mitja filera per davant.
  const f=t?t.f:1, cap=t?t.ini+LLARG_INICI-1:LLARG_INICI;
  serp=[];
  for(let i=0;i<LLARG_INICI;i++)serp.push({x:cap-i,y:f});
  dir={x:1,y:0};seguentDir=null;
}

function start(){
  punts=0;nivell=1;vides=VIDES;state='play';paused=false;
  acum=0;espera=0;
  carregaLaberint();
  titolT=1400;
  hideMsg();updateHUD();
}

function mou(nd){
  if(state!=='play'||paused)return;
  // no et pots girar del tot cap enrere: et menjaries a tu mateix
  const ref=seguentDir||dir;
  if(nd.x===-ref.x&&nd.y===-ref.y)return;
  seguentDir=nd;seguentVida=3;
}

function esParet(px,py){
  return !mapa[py]||!mapa[py][px]||mapa[py][px]==='#';
}
function passa(){
  const cap=serp[0];
  // Un gir contra una paret no et mata: el cuc segueix recte i el gir es
  // guarda per a la primera obertura que trobi, com a la maquina i com al
  // Comecocos. Abans, llliscar amunt entre dos pilars era mort segura, i
  // aixo passava a la primera corba de totes.
  // El gir guardat dura tres caselles i prou: si no, un gir que has demanat
  // i has deixat córrer et sortiria d'improvís mig laberint més enllà.
  if(seguentDir){
    if(!esParet(cap.x+seguentDir.x,cap.y+seguentDir.y)){dir=seguentDir;seguentDir=null}
    else if(--seguentVida<=0)seguentDir=null;
  }
  const nx=cap.x+dir.x, ny=cap.y+dir.y;

  if(esParet(nx,ny)){mor();return}
  // la cua s'aparta al mateix moment que hi arribes, o sigui que trepitjar
  // l'ultima casella val (excepte si encara has de creixer)
  const fins=creixPend>0?serp.length:serp.length-1;
  for(let i=0;i<fins;i++)if(serp[i].x===nx&&serp[i].y===ny){mor();return}

  serp.unshift({x:nx,y:ny});
  if(creixPend>0)creixPend--; else serp.pop();

  if(mapa[ny][nx]==='.'){
    mapa[ny][nx]=' ';
    queden--;punts+=10;menjats++;
    if(menjats%CREIX_CADA===0)creixPend++;
    sndMos();updateHUD();
    if(queden===0)acabaNivell();
  }
}

function acabaNivell(){
  state='nivell';
  const extra=Math.max(0,Math.round(bonus));
  punts+=extra;updateHUD();
  sndNivell();
  msg('LABERINT NET!<br><small>bonus de temps: '+extra+' punts</small>');
  setTimeout(()=>{
    if(state!=='nivell')return;
    nivell++;carregaLaberint();
    hideMsg();state='play';titolT=1200;updateHUD();
  },1900);
}

function mor(){
  if(state!=='play')return;
  vides--;updateHUD();
  sndMor();
  if(vides<=0){
    state='over';
    setTimeout(finalPartida,900);
  } else {
    state='mort';
    setTimeout(()=>{
      if(state!=='mort')return;
      posaSerp();state='play';espera=900;titolT=900;
    },1100);
  }
}

async function finalPartida(){
  msg('GAME OVER');
  const r=await Records.fiPartida(JOC,punts);
  msg('GAME OVER'+(r.posicio?'<br><small style="color:#ff0">Ets el número '+r.posicio+'!</small>':'')+
      '<div style="margin:10px 0">'+r.html+'</div>'+
      Records.peuFinal('o prem ENTER per tornar a jugar'));
  Records.pintaMillor(JOC,document.getElementById('best'),punts);
}

function update(dt){
  if(paused||state==='over'||state==='nivell')return;
  if(titolT>0)titolT-=dt;
  if(state==='mort')return;
  if(espera>0){espera-=dt;return}      // un respir en tornar a sortir
  bonus=Math.max(0,bonus-dt*0.042);   // dt va en mil·lèsimes: uns 42 punts per segon
  acum+=dt;
  const pas=msPerPas();
  while(acum>=pas){acum-=pas;passa();if(state!=='play')return}
}

// ===== DIBUIX =====
// Les parets són tubs que s'uneixen amb les del costat, d'un color diferent a
// cada laberint; el menjar fa llum; i la serp és un cos seguit que s'aprima
// cap a la cua, amb ulls que miren cap on va i una llengua que surt i entra.
// Abans eren quadrats separats.
const COLORS_LAB=[['#1b3a8a','#3a6ae0'],['#6a1a7a','#c04ae0'],['#0a6a5a','#2ad0a8'],['#8a3a10','#f08a30'],['#7a1a2a','#f04a6a']];
function draw(){
  const ara=performance.now(),[fosc,clar]=COLORS_LAB[(nivell-1)%COLORS_LAB.length];
  x.fillStyle='#04050c';x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.025)';
  for(let f=0;f<FILES;f++)for(let co=(f%2);co<COLS;co+=2)x.fillRect(co*CELA,DALT+f*CELA,CELA,CELA);

  // la franja de dalt
  x.fillStyle='#ffd000';x.font='bold 12px monospace';x.textAlign='left';
  x.fillText('LABERINT '+nivell,8,16);
  x.textAlign='right';
  x.fillStyle=bonus<400?'#ff5050':'#8fd0ff';
  x.fillText('BONUS '+Math.round(bonus),W-8,16);
  x.textAlign='left';
  // les vides que et queden, dibuixades com caps de serp
  for(let i=0;i<vides;i++){
    x.fillStyle='#6fe36f';x.beginPath();x.arc(13+i*14,29,5,0,7);x.fill();
    x.fillStyle='#000';x.fillRect(14+i*14,26,2,2);
  }

  // el laberint: cada paret s'enganxa amb les del costat
  const es=(f,co)=>mapa[f]&&mapa[f][co]==='#';
  const M=4;
  for(let f=0;f<FILES;f++){
    for(let co=0;co<COLS;co++){
      const ce=mapa[f]&&mapa[f][co];
      const px=co*CELA, py=DALT+f*CELA;
      if(ce==='#'){
        for(const[col,m]of[[fosc,M],[clar,M+3]]){
          x.fillStyle=col;
          x.fillRect(px+m,py+m,CELA-2*m,CELA-2*m);
          if(es(f,co-1))x.fillRect(px,py+m,m+1,CELA-2*m);
          if(es(f,co+1))x.fillRect(px+CELA-m-1,py+m,m+1,CELA-2*m);
          if(es(f-1,co))x.fillRect(px+m,py,CELA-2*m,m+1);
          if(es(f+1,co))x.fillRect(px+m,py+CELA-m-1,CELA-2*m,m+1);
        }
      } else if(ce==='.'){
        // el menjar: una perla que batega
        const b=1+Math.sin(ara/250+co+f)*.25,cx=px+CELA/2,cy=py+CELA/2;
        x.fillStyle='rgba(255,210,0,.18)';x.beginPath();x.arc(cx,cy,6*b,0,7);x.fill();
        x.fillStyle='#ffd000';x.beginPath();x.arc(cx,cy,2.6*b,0,7);x.fill();
        x.fillStyle='#fff8c0';x.fillRect(cx-1.5,cy-1.5,1.5,1.5);
      }
    }
  }

  // la serp: un cos seguit que s'aprima cap a la cua
  const mort=state==='mort',n=serp.length;
  const centre=s=>[s.x*CELA+CELA/2,DALT+s.y*CELA+CELA/2];
  x.lineCap='round';x.lineJoin='round';
  for(let i=n-1;i>0;i--){
    const[a,b]=[centre(serp[i]),centre(serp[i-1])];
    if(Math.abs(a[0]-b[0])>CELA*1.5||Math.abs(a[1]-b[1])>CELA*1.5)continue;      // per si dona la volta
    const w=8+8*(1-i/Math.max(1,n));
    x.strokeStyle=mort?'#8a3030':'#2a8a2a';x.lineWidth=w+3;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();
    x.strokeStyle=mort?'#c05050':(i%3===0?'#7ae04a':'#57c957');x.lineWidth=w;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();
  }
  // les taques del llom
  for(let i=1;i<n;i+=2){const[cx,cy]=centre(serp[i]);x.fillStyle=mort?'#a04040':'#3a9a2a';x.beginPath();x.arc(cx,cy,2,0,7);x.fill()}
  // el cap
  if(n){
    const[hx,hy]=centre(serp[0]);
    // la llengua, que surt i entra
    if(!mort&&Math.floor(ara/180)%3===0){x.strokeStyle='#ff3050';x.lineWidth=1.5;x.beginPath();x.moveTo(hx+dir.x*8,hy+dir.y*8);x.lineTo(hx+dir.x*14,hy+dir.y*14);
      x.lineTo(hx+dir.x*16+dir.y*3,hy+dir.y*16+dir.x*3);x.moveTo(hx+dir.x*14,hy+dir.y*14);x.lineTo(hx+dir.x*16-dir.y*3,hy+dir.y*16-dir.x*3);x.stroke()}
    x.fillStyle=mort?'#ff5050':'#9dff6a';x.beginPath();x.arc(hx,hy,CELA/2-.5,0,7);x.fill();
    x.fillStyle='rgba(255,255,255,.3)';x.beginPath();x.arc(hx-3,hy-3,3,0,7);x.fill();
    // els ulls, mirant cap on va
    const px=-dir.y,py=dir.x;
    for(const s of[-1,1]){const ex=hx+dir.x*3+px*s*4,ey=hy+dir.y*3+py*s*4;
      x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,3,0,7);x.fill();
      x.fillStyle='#000';x.beginPath();x.arc(ex+dir.x*1.2,ey+dir.y*1.2,1.6,0,7);x.fill()}
    if(mort){x.strokeStyle='#000';x.lineWidth=1.5;for(const s of[-1,1]){const ex=hx+px*s*4,ey=hy+py*s*4;x.beginPath();x.moveTo(ex-2,ey-2);x.lineTo(ex+2,ey+2);x.moveTo(ex+2,ey-2);x.lineTo(ex-2,ey+2);x.stroke()}}
  }

  if(titolT>0&&state==='play'){
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,DALT+FILES*CELA/2-22,W,44);
    x.fillStyle='#fff';x.font='bold 17px monospace';x.textAlign='center';
    x.fillText('LABERINT '+nivell,W/2,DALT+FILES*CELA/2+6);
    x.textAlign='left';
  }
  if(paused){
    x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.font='bold 24px monospace';x.textAlign='center';
    x.fillText('PAUSA',W/2,H/2);x.textAlign='left';
  }
}

let last=performance.now();
function loop(t){const dt=Math.min(60,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ===== CONTROLS =====
const AMUNT={x:0,y:-1},AVALL={x:0,y:1},ESQ={x:-1,y:0},DRETA={x:1,y:0};
function bind(id,d){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();
    if(state==='over'){start();return}
    mou(d)});
}
bind('u',AMUNT);bind('d',AVALL);bind('l',ESQ);bind('r',DRETA);

// llisca el dit cap on vulguis anar
let toc=null;
c.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();
  if(state==='over'){start();return}
  toc={x:ev.clientX,y:ev.clientY}});
c.addEventListener('pointermove',ev=>{
  if(!toc)return;
  const dx=ev.clientX-toc.x, dy=ev.clientY-toc.y;
  if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
  mou(Math.abs(dx)>Math.abs(dy)?(dx>0?DRETA:ESQ):(dy>0?AVALL:AMUNT));
  toc={x:ev.clientX,y:ev.clientY};    // torna a comptar, per poder encadenar girs
});
const soltaToc=()=>toc=null;
c.addEventListener('pointerup',soltaToc);
c.addEventListener('pointercancel',soltaToc);
c.addEventListener('pointerleave',soltaToc);
document.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('keydown',e=>{
  aInit();
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();mou(AMUNT)}
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();mou(AVALL)}
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();mou(ESQ)}
  if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();mou(DRETA)}
  if(e.code==='KeyP'&&state!=='over'){paused=!paused}
  if(e.code==='Enter'&&state==='over')start();
});
document.getElementById('msg').addEventListener('click',()=>{if(state==='over'){aInit();start()}});

start();

// En entrar al joc, els rècords uns segons, com les màquines de debò.
Records.pantallaInicial(JOC,()=>paused=true,()=>paused=false);
</script>
