// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type="sine",vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+dur);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.008);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(MG);o.start(now);o.stop(now+dur+.02);
}
function sndTecla(){aInit();tone(700,.03,"triangle",.07)}
function sndNo(){aInit();tone(170,.12,"square",.1,-40)}
function sndIntent(pc){aInit();tone(260+pc*5,.18,"triangle",.18,pc>80?120:-60)}
function sndBe(){aInit();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,"triangle",.24),i*110))}
function sndMal(){aInit();[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,"sine",.2,-40),i*200))}

const DE_COMARCA=c=>{const n=COMARQUES[c];
  if(/^(Osona|Aran)$/.test(n))return "d'"+n;
  if(/^(Garrotxa|Noguera|Segarra|Selva|Terra Alta|Conca de Barberà|Cerdanya|Ribera d'Ebre)$/.test(n))return 'de la '+n;
  if(/^(Garrigues)$/.test(n))return 'de les '+n;
  if(/^[AEIOUÀÈÉÍÒÓÚ]/.test(n))return "de l'"+n;
  return 'del '+n};
const ALF='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_-',VAL={};
for(let i=0;i<64;i++)VAL[ALF[i]]=i;
function decod(s){const out=[];let z=0,m=1;for(const ch of s){const v=VAL[ch];if(v>=32){z+=(v-32)*m;m*=32}else{z+=v*m;out.push(z%2?-(z+1)/2:z/2);z=0;m=1}}return out}
const N=NOMS.length;

const comarca=i=>VAL[COMARCA[i]];
const TROSSOS=SILUETES.split('|'),anellsCache=[];
function anells(i){
  if(anellsCache[i])return anellsCache[i];
  return anellsCache[i]=TROSSOS[i].split('!').map(s=>{const v=decod(s),r=[];let x=0,y=0;for(let k=0;k<v.length;k+=2){x+=v[k];y+=v[k+1];r.push([x/10,y/10])}return r});
}
const km=(a,b)=>Math.hypot(CENTRE[a][0]-CENTRE[b][0],CENTRE[a][1]-CENTRE[b][1])*KM;

  const ang=Math.atan2(dx,-dy)*180/Math.PI;return ((Math.round(ang/45)%8)+8)%8}
// que a prop: 100% al poble bo, 0% a 300 km (de punta a punta de Catalunya)
const MAXKM=300;
const proximitat=(a,b)=>a===b?100:Math.max(0,Math.min(99,Math.round(100*(1-km(a,b)/MAXKM))));

// ===== BUSCAR PER NOM =====
// Sense accents, ni apostrofs, ni espais: «lhospitalet», «hospitalet» i
// «llobregat» troben l'Hospitalet de Llobregat. Primer els que comencen aixi
// (sense comptar l'article), despres els que tenen una paraula que hi comenca.
const pla=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
const ARTICLES=new Set(['l','la','el','les','els','es','sa','s']);
const CONEGUT=new Set(CONEGUTS);
const CLAUS=NOMS.map(nom=>{const t=nom.split(/[\s'’\-·.,]+/).filter(Boolean),k=[];let art=true;
  for(let j=0;j<t.length;j++){k.push([pla(t.slice(j).join('')),art?0:1]);if(!ARTICLES.has(t[j].toLowerCase()))art=false}
  return k});
function busca(q,quants){
  q=pla(q);if(!q)return [];
  const res=[];
  for(let i=0;i<N;i++){let millor=9;for(const [k,r] of CLAUS[i])if(k.startsWith(q)&&r<millor)millor=r;if(millor<9)res.push([i,millor])}
  res.sort((a,b)=>a[1]-b[1]||(CONEGUT.has(b[0])-CONEGUT.has(a[0]))||NOMS[a[0]].localeCompare(NOMS[b[0]],'ca'));
  return res.slice(0,quants).map(r=>r[0]);
}
// com es veu el nom, amb la primera lletra de cada paraula (l'última pista):
// «Sant Cugat del Vallès» → «S___ C____ d__ V_____»
const esquelet=i=>NOMS[i].replace(/[^\s'’\-·.,]+/g,w=>{const l=[...w];return l[0]+'_'.repeat(l.length-1)});

const inicial=i=>{const t=NOMS[i].split(/[\s'’]+/);const p=t.find(x=>!ARTICLES.has(x.toLowerCase()))||t[0];return pla(p)[0].toUpperCase()};

  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
  return (h^h>>>16)>>>0;
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function barreja(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Surt dels pobles coneguts (les capitals de comarca, les viles grosses i els
// llocs que surten a les postals), barrejats sempre igual: cap no es repeteix
// fins que no han sortit tots. Els intents poden ser qualsevol dels 947.
function pobleDe(n){
  const L=CONEGUTS.length,cicle=Math.floor((n-1)/L),k=(n-1)%L;
  const ordre=c=>barreja(mulberry(hashText('POBLE-'+c)),CONEGUTS);
  const o=ordre(cicle);
  // que no surti el mateix dos dies seguits quan es torna a començar
  if(cicle>0&&k===0&&o[0]===ordre(cicle-1)[L-1])return o[1];
  if(cicle>0&&k===1&&o[0]===ordre(cicle-1)[L-1])return o[0];
  return o[k];
}

let sugs=[],aprop=null;   // aprop: on has tocat el mapa, en coordenades del mapa
// Els municipis d'on has tocat: primer el que hi és a sota, després els que
// tenen el centre més a prop. Al mòbil el mapa és petit i el dit, gros.
function dins(rs,x,y){let d=false;for(const r of rs)for(let a=0,b=r.length-1;a<r.length;b=a++){const [xa,ya]=r[a],[xb,yb]=r[b];
  if((ya>y)!==(yb>y)&&x<(xb-xa)*(y-ya)/(yb-ya)+xa)d=!d}return d}
function aPropDe(x,y,quants){
  const res=[];for(let i=0;i<N;i++)if(!R.intents.includes(i))res.push([i,dins(anells(i),x,y)?-1:Math.hypot(CENTRE[i][0]-x,CENTRE[i][1]-y)]);
  return res.sort((a,b)=>a[1]-b[1]).slice(0,quants).map(r=>r[0]);
}

// La silueta: el municipi tan gran com hi capiga, amb el nord a dalt i una
// regla per saber-ne la mida (no fa igual un poble que Barcelona).
function prepara(cv){
  const r=cv.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  return [cv.getContext('2d'),w,h,dpr];
}
function caixa(rs){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const r of rs)for(const [x,y] of r){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return [x0,y0,x1,y1]}
function cami(g,rs,f){g.beginPath();for(const r of rs){r.forEach(([x,y],k)=>{const [a,b]=f(x,y);k?g.lineTo(a,b):g.moveTo(a,b)});g.closePath()}}
function dibuixaSilueta(){
  const [g,w,h,dpr]=prepara($('silueta'));g.clearRect(0,0,w,h);
  if(!R)return;
  const rs=anells(R.obj),[x0,y0,x1,y1]=caixa(rs),marge=16*dpr,dalt=18*dpr,baix=20*dpr;
  const e=Math.min((w-2*marge)/(x1-x0||1),(h-dalt-baix)/(y1-y0||1));
  const ox=(w-(x1-x0)*e)/2-x0*e,oy=dalt+(h-dalt-baix-(y1-y0)*e)/2-y0*e;
  cami(g,rs,(x,y)=>[ox+x*e,oy+y*e]);
  g.fillStyle=R.fi?(R.encert?'#7dff9b':'#e8c56a'):'#e8c56a';g.fill('evenodd');
  g.lineWidth=1.2*dpr;g.strokeStyle='#fff6';g.stroke();
  // la regla: 1, 2, 5, 10, 20 o 50 km, la mes llarga que no passi d'un terç
  const pxKm=e/KM;let L=1;for(const v of [1,2,5,10,20,50])if(v*pxKm<=w/3)L=v;
  const lx=8*dpr,ly=h-8*dpr;g.strokeStyle='#cfd8cc';g.lineWidth=2*dpr;g.beginPath();
  g.moveTo(lx,ly-4*dpr);g.lineTo(lx,ly);g.lineTo(lx+L*pxKm,ly);g.lineTo(lx+L*pxKm,ly-4*dpr);g.stroke();
  g.fillStyle='#cfd8cc';g.font=(10*dpr)+'px monospace';g.textBaseline='bottom';g.fillText(L+' km',lx+L*pxKm+4*dpr,ly+2*dpr);
}
// El mapa: Catalunya feta dels 947 municipis (es pinta un sol cop, a part),
// amb els intents a sobre. Amb la pista, la comarca s'il·lumina.
let fons=null,fonsMida='';
function geometria(w,h,dpr){const m=6*dpr,e=Math.min((w-2*m)/AMPLE,(h-2*m-12*dpr)/ALT);return {e,ox:(w-AMPLE*e)/2,oy:12*dpr+(h-12*dpr-ALT*e)/2}}
function pintaFons(w,h,dpr){
  const k=w+'x'+h;if(fons&&fonsMida===k)return;
  fons=document.createElement('canvas');fons.width=w;fons.height=h;fonsMida=k;
  const g=fons.getContext('2d'),{e,ox,oy}=geometria(w,h,dpr);
  g.fillStyle='#26352b';g.strokeStyle='#33473a';g.lineWidth=Math.max(.5,.4*dpr);
  for(let i=0;i<N;i++){cami(g,anells(i),(x,y)=>[ox+x*e,oy+y*e]);g.fill('evenodd');g.stroke()}
}
function dibuixaMapa(){
  const [g,w,h,dpr]=prepara($('mapa'));g.clearRect(0,0,w,h);
  pintaFons(w,h,dpr);g.drawImage(fons,0,0);
  if(!R)return;
  const {e,ox,oy}=geometria(w,h,dpr),P=(x,y)=>[ox+x*e,oy+y*e];
  if(R.intents.length>=pistes()[0]||R.fi){
    const c=comarca(R.obj);g.fillStyle=R.fi?'#3a5a3088':'#6a6a2a88';
    for(let i=0;i<N;i++)if(comarca(i)===c){cami(g,anells(i),P);g.fill('evenodd')}
  }
  if(R.fi){cami(g,anells(R.obj),P);g.fillStyle=R.encert?'#7dff9b':'#e8c56a';g.fill('evenodd');
    const [x,y]=P(...CENTRE[R.obj]);g.strokeStyle=R.encert?'#7dff9b':'#e8c56a';g.lineWidth=2*dpr;g.beginPath();g.arc(x,y,7*dpr,0,7);g.stroke()}
  if(aprop&&!R.fi){const [x,y]=P(...aprop);g.strokeStyle='#fff';g.lineWidth=1.5*dpr;g.beginPath();
    g.moveTo(x-6*dpr,y);g.lineTo(x+6*dpr,y);g.moveTo(x,y-6*dpr);g.lineTo(x,y+6*dpr);g.stroke()}
  g.font='bold '+(9*dpr)+'px monospace';g.textAlign='center';g.textBaseline='middle';
  R.intents.forEach((i,k)=>{if(i===R.obj)return;const [x,y]=P(...CENTRE[i]),pc=proximitat(i,R.obj);
    g.fillStyle=color(pc);g.beginPath();g.arc(x,y,5.5*dpr,0,7);g.fill();g.fillStyle='#0b100d';g.fillText(k+1,x,y+.5*dpr)});
}
function dibuixa(){dibuixaSilueta();dibuixaMapa()}
function mesura(){dibuixa()}
addEventListener('resize',()=>{if(R)dibuixa()});

let liderDia=null,liderSempre=null;

  $('lider').textContent=mode==='practica'?'PRÀCTICA · no compta per a cap taula':

}
async function refrescaLiders(){

}

// ===== CONTROLS =====
// Un teclat propi: el del mobil taparia la silueta i el mapa.
const FILES=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM⌫'];
for(const f of FILES){const d=document.createElement('div');
  for(const t of f){const b=document.createElement('button');b.textContent=t;b.dataset.t=t;if(t==='⌫')b.className='ample';d.appendChild(b)}
  $('teclat').appendChild(d)}
function posaPausa(v){paused=v;pinta()}
$('teclat').addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('button');if(!b)return;ev.preventDefault();aInit();
  if(paused){posaPausa(false);return}
  escriu(b.dataset.t==='⌫'?'⌫':b.dataset.t.toLowerCase());
});
$('suggeriments').addEventListener('click',ev=>{
  const a=ev.target.closest('a');if(!a)return;ev.preventDefault();aInit();
  if(paused){posaPausa(false);return}
  intenta(+a.dataset.i);
});
$('screen').addEventListener('pointerdown',()=>{aInit();if(paused)posaPausa(false)});
$('mapa').addEventListener('pointerdown',ev=>{
  if(!enJoc())return;
  const cv=$('mapa'),r=cv.getBoundingClientRect(),dpr=cv.width/r.width,{e,ox,oy}=geometria(cv.width,cv.height,dpr);
  const x=((ev.clientX-r.left)*dpr-ox)/e,y=((ev.clientY-r.top)*dpr-oy)/e;
  if(x<-20||y<-20||x>AMPLE+20||y>ALT+20)return;
  escrit='';aprop=[x,y];sndTecla();pintaEntrada();dibuixaMapa();
});
document.addEventListener('contextmenu',e=>e.preventDefault());
// La P del teclat de l'ordinador s'escriu (Pals, Puigcerda): nomes fa pausa
// la P de mentida que envia el boto de pausa del marcador.
document.addEventListener('keydown',e=>{
  aInit();
  if((e.code==='KeyP'&&!e.isTrusted)||e.key==='Escape'){posaPausa(!paused);return}
  if(paused||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){e.preventDefault();escriu('⌫')}
  else if(e.key==='Enter'){e.preventDefault();if(sugs.length)intenta(sugs[0]);else sndNo()}
  else if(e.key.length===1&&/[a-zà-úç·' -]/i.test(e.key)){e.preventDefault();escriu(e.key.toLowerCase())}
});
document.getElementById('msg').addEventListener('click',e=>{if(!e.target.closest('a')&&R&&R.fi)hideMsg()});

Records.pantallaInicial(JOC,()=>paused=true,()=>{paused=false;pinta()},
