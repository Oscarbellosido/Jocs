<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Granota</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:monospace;overflow:hidden}
body{display:flex;align-items:flex-start;justify-content:center}
#wrap{width:min(100vw,700px);height:100%;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud{flex:none;width:96%;display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px;font-size:12px;gap:4px}
#screen{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:96%;height:100%;object-fit:contain;background:#000;touch-action:none}
#controls{flex:none;margin:6px auto 0;display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:46px 46px;gap:4px}
#controls button{font-size:22px;padding:0;background:#111;color:#fff;border:1px solid #777;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
#controls button:active{background:#333}
#up{grid-column:2}.c-left{grid-column:1;grid-row:2}.c-down{grid-column:2;grid-row:2}.c-right{grid-column:3;grid-row:2}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:20px;line-height:1.7;display:none;background:rgba(0,0,0,.88);border:1px solid #555;border-radius:10px;padding:16px 24px;max-width:80%}
#msg small{display:block;margin-top:8px;font-size:13px}
small{flex:none;max-width:94%;font-size:11px;color:#888;text-align:center;padding:4px 0 6px}
#back{background:transparent;border:1px solid #555;color:#aaa;font-size:12px;padding:4px 8px;border-radius:6px;font-family:monospace;cursor:pointer;white-space:nowrap;flex-shrink:0}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><button id="back" onclick="location.href='index.html'">← Tornar</button><span>PUNTS <b id="score">0</b></span><span>NIV <b id="level">1</b></span><span>GRANOTES <b id="lives">3</b></span><span style="color:#ff0"><b id="best">—</b></span></div>
  <div id="screen"><canvas id="game" width="416" height="448"></canvas></div>
  <div id="controls">
    <button id="up">▲</button><button class="c-left">◀</button><button class="c-down">▼</button><button class="c-right">▶</button>
  </div>
  <div id="msg"></div>
  <small><b style="color:#ddd">Porta cinc granotes a casa travessant la carretera i el riu.</b> fletxes o WASD · llisca el dit · pausa: P</small>
</div>
<script src="records.js"></script>
<script>

// ===== CLASSIC ARCADE SOUND ENGINE =====
let audioCtx=null,master=null;
function audioInit(){
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    master=audioCtx.createGain();master.gain.value=.12;master.connect(audioCtx.destination)}
  if(audioCtx.state==="suspended")audioCtx.resume();
}
function tone(f,d,type="square",vol=.3,slide=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.005);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.02);
}
function noise(d=.2,vol=.3){
  if(!audioCtx)return;
  const n=audioCtx.sampleRate*d,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const dd=b.getChannelData(0);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=audioCtx.createBufferSource(),g=audioCtx.createGain(),now=audioCtx.currentTime;
  s.buffer=b;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  s.connect(g);g.connect(master);s.start();s.stop(now+d);
}
function sndHop(){audioInit();tone(420,.06,"square",.22,260)}
function sndHome(){audioInit();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.1,"square",.24),i*80))}
function sndSquash(){audioInit();noise(.22,.3);tone(160,.2,"sawtooth",.24,-110)}
function sndDrown(){audioInit();tone(500,.22,"sine",.22,-420);setTimeout(()=>noise(.18,.2),120)}
function sndFly(){audioInit();[880,1180].forEach((f,i)=>setTimeout(()=>tone(f,.08,"square",.24),i*70))}
function sndLevel(){audioInit();[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,"square",.24),i*90))}
function sndOver(){audioInit();[330,262,196,131].forEach((f,i)=>setTimeout(()=>tone(f,.3,"square",.26,-50),i*250))}

const c=document.getElementById('game'),x=c.getContext('2d');
const CELL=32,COLS=13,ROWS=13,W=COLS*CELL,H=ROWS*CELL,BAR=32;
// files: 0 caselles d'arribada · 1-5 riu · 6 mitjana · 7-11 carretera · 12 sortida
const HOME_COLS=[0,3,6,9,12];
const rowY=r=>r*CELL;

// carrils: al riu s'hi puja a sobre, a la carretera t'atropellen
const LANES=[
  {row:1, kind:'log',    len:3, dir: 1, sp:0.035, n:4},
  {row:2, kind:'turtle', len:3, dir:-1, sp:0.042, n:4, dive:true},
  {row:3, kind:'log',    len:6, dir: 1, sp:0.028, n:3},
  {row:4, kind:'log',    len:2, dir: 1, sp:0.055, n:4},
  {row:5, kind:'turtle', len:2, dir:-1, sp:0.048, n:5, dive:true},
  {row:7, kind:'truck',  len:2, dir:-1, sp:0.050, n:3},
  {row:8, kind:'car',    len:1, dir: 1, sp:0.070, n:3},
  {row:9, kind:'car',    len:1, dir:-1, sp:0.060, n:4},
  {row:10,kind:'dozer',  len:1, dir: 1, sp:0.030, n:3},
  {row:11,kind:'car',    len:1, dir:-1, sp:0.045, n:3}
];
const CARCOL={car:['#ffd020','#20b8e8','#ff6a20','#e83a8a'],truck:['#dddddd'],dozer:['#ffc000']};

let score=0,level=1,lives=3,state='play',paused=false,extraGiven=false;
let homes,frog,timeLeft,maxRow,fly,lanes,startTime;

const JOC='frogger';
Records.migra(JOC,null);
let bestScore=Records.local(JOC);
Records.pintaMillor(JOC,document.getElementById('best'));   // les inicials de qui mana
function saveBest(){
  if(score>bestScore){bestScore=score;Records.desaLocal(JOC,score)}
  Records.marcador(JOC,document.getElementById('best'),score);
}
// en acabar: envia la puntuacio i ensenya la taula dels 10 millors
async function finalPartida(titol){
  msg(titol);
  const r=await Records.fiPartida(JOC,score);
  msg(titol+(r.posicio?'<br><small style="color:#ff0">Ets el número '+r.posicio+'!</small>':'')+
      '<div style="margin:10px 0">'+r.html+'</div>'+
      Records.peuFinal('o prem ENTER per tornar a jugar'));
  Records.pintaMillor(JOC,document.getElementById('best'),score);
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('lives').textContent=lives;
  saveBest();
}
function addScore(n){
  score+=n;
  if(!extraGiven&&score>=20000){extraGiven=true;lives++}   // granota extra als 20.000
  updateHUD();
}
function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}

function laneSpeed(l){return l.sp*(1+(level-1)*0.12)*l.dir}
function trackLen(){return W+CELL*4}
function laneObjs(l){
  const L=trackLen(),sp=L/l.n,out=[];
  for(let i=0;i<l.n;i++){
    let px=(l.phase+i*sp)%L; if(px<0)px+=L;
    out.push({x:px-CELL*2,w:l.len*CELL,i:i});
  }
  return out;
}
function turtleDown(l,i){
  if(!l.dive||i%2)return 0;                 // nomes es submergeix una tortuga de cada dues
  const p=((performance.now()/1000)+i*1.9)%7;
  return p>5.6?2:p>4.8?1:0;                 // 2 sota l'aigua, 1 a punt de submergir-se
}

function resetFrog(){
  frog={x:W/2,row:12,hop:null,dead:0};
  maxRow=12;timeLeft=Math.max(18,32-level*1.5);
}
function newLevel(){
  homes=[false,false,false,false,false];
  lanes=LANES.map(l=>({...l,phase:Math.random()*trackLen()}));
  fly=null;resetFrog();state='play';updateHUD();
}
function start(){
  score=0;level=1;lives=3;extraGiven=false;paused=false;
  newLevel();hideMsg();
}

function die(reason){
  if(state!=='play')return;
  state='dying';frog.dead=0;
  reason==='water'?sndDrown():sndSquash();
  setTimeout(()=>{
    lives--;updateHUD();
    if(lives<=0){state='over';sndOver();finalPartida("GAME OVER")}
    else{resetFrog();state='play'}
  },900);
}
function reachHome(idx){
  homes[idx]=true;
  addScore(50+Math.floor(timeLeft)*10);       // 50 punts i 10 per segon que sobra
  if(fly&&fly.idx===idx){addScore(200);fly=null;sndFly()}
  sndHome();
  if(homes.every(h=>h)){
    addScore(1000);                            // totes cinc plenes
    level++;sndLevel();
    msg("NIVELL "+level);
    setTimeout(()=>{hideMsg();newLevel()},1400);
    state='wait';
  }else resetFrog();
}

function hop(dx,dy){
  if(state!=='play'||paused||frog.hop)return;
  const nrow=frog.row+dy, nx=frog.x+dx*CELL;
  if(nrow>12||nrow<0||nx<CELL/2-1||nx>W-CELL/2+1)return;
  frog.hop={fx:frog.x,fy:rowY(frog.row),tx:nx,ty:rowY(nrow),t:0,row:nrow};
  frog.ang=dy<0?0:dy>0?Math.PI:dx>0?Math.PI/2:-Math.PI/2;   // mira cap on salta
  sndHop();
}
function landing(){
  frog.row=frog.hop.row;frog.x=frog.hop.tx;frog.hop=null;
  if(frog.row<maxRow){maxRow=frog.row;addScore(10)}   // 10 punts per fila guanyada
  if(frog.row===0){
    // nomes val si cau dins d'una caseta lliure
    const idx=HOME_COLS.findIndex(cc=>Math.abs(frog.x-(cc*CELL+CELL/2))<CELL*0.6);
    if(idx<0||homes[idx])die('squash'); else reachHome(idx);
  }
}
function update(dt){
  if(state==='over'||paused)return;
  for(const l of lanes)l.phase+=laneSpeed(l)*dt*(1000/1000);
  if(state==='dying'){frog.dead+=dt;return}
  if(state!=='play')return;

  if(frog.hop){
    frog.hop.t+=dt;
    const k=Math.min(1,frog.hop.t/130);
    if(k>=1)landing();
  }else{
    timeLeft-=dt/1000;
    if(timeLeft<=0){die('time');return}
  }
  const row=frog.hop?frog.hop.row:frog.row;
  const lane=lanes.find(l=>l.row===row);

  // al riu: o vas a sobre d'alguna cosa o t'ofegues
  if(row>=1&&row<=5){
    let on=null;
    if(lane)for(const o of laneObjs(lane)){
      if(lane.kind==='turtle'&&turtleDown(lane,o.i)===2)continue;
      if(frog.x>o.x&&frog.x<o.x+o.w){on=o;break}
    }
    if(!frog.hop){
      if(!on){die('water');return}
      frog.x+=laneSpeed(lane)*dt;
      if(frog.x<CELL/2-2||frog.x>W-CELL/2+2){die('water');return}   // t'ha tret de la pantalla
    }
  }
  // a la carretera: qualsevol vehicle et xafa
  if(row>=7&&row<=11&&lane&&!frog.hop){
    for(const o of laneObjs(lane)){
      if(frog.x+9>o.x&&frog.x-9<o.x+o.w){die('squash');return}
    }
  }
  // la mosca apareix en una caseta lliure
  if(!fly&&Math.random()<dt/9000){
    const free=homes.map((h,i)=>h?-1:i).filter(i=>i>=0);
    if(free.length)fly={idx:free[Math.floor(Math.random()*free.length)],t:5000};
  }
  if(fly){fly.t-=dt;if(fly.t<=0)fly=null}
}

// ===== DIBUIX =====
// Vist des de dalt: el riu amb ones que corren, troncs amb escorça i anells
// a les puntes, tortugues amb closca que neden, una carretera d'asfalt amb
// cotxes, camions i tractors de debò (amb vidres, rodes i llums), i la
// granota mira cap on salta. Abans eren rectangles i rodones.
function drawFrog(px,py,squash,ang=0,salta=0){
  const cy=py+CELL/2;
  if(squash){
    // aixafada o ofegada: una taca i uns cercles
    x.fillStyle='rgba(60,200,60,.85)';
    for(const[dx,dy,r]of[[0,0,9],[-8,-5,4],[8,-6,4],[-7,7,4],[8,6,4]]){x.beginPath();x.arc(px+dx,cy+dy,r,0,7);x.fill()}
    x.fillStyle='#fff';x.beginPath();x.arc(px-3,cy-2,2.5,0,7);x.arc(px+3,cy-2,2.5,0,7);x.fill();
    return;
  }
  x.save();x.translate(px,cy);x.rotate(ang);
  const e=salta?6:0;
  // potes: les del darrere s'estiren quan salta
  x.fillStyle='#2a9a20';
  x.beginPath();x.ellipse(-9,7+e,4,6+e,.5,0,7);x.fill();x.beginPath();x.ellipse(9,7+e,4,6+e,-.5,0,7);x.fill();
  x.beginPath();x.ellipse(-9,-5,3,5,-.6,0,7);x.fill();x.beginPath();x.ellipse(9,-5,3,5,.6,0,7);x.fill();
  x.fillStyle='#1a7a14';for(const s of[-1,1]){x.fillRect(s*12-2,11+e*1.6,4,3);x.fillRect(s*11-2,-10,3,3)}
  // el cos, amb taques
  x.fillStyle='#4ad830';x.beginPath();x.ellipse(0,1,9,11,0,0,7);x.fill();
  x.fillStyle='#8aff60';x.beginPath();x.ellipse(0,3,5,6,0,0,7);x.fill();
  x.fillStyle='#2a9a20';x.beginPath();x.arc(-4,5,1.5,0,7);x.arc(4,7,1.5,0,7);x.arc(0,-2,1.3,0,7);x.fill();
  // els ulls, a dalt de tot
  for(const s of[-1,1]){x.fillStyle='#4ad830';x.beginPath();x.arc(s*5,-8,4,0,7);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(s*5,-8.5,2.8,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(s*5,-9,1.5,0,7);x.fill()}
  x.restore();
}
// un vehicle vist des de dalt, mirant cap a on va (dir 1: a la dreta)
function drawVehicle(kind,o,y,col,dir){
  const x0=o.x,w=o.w,y0=y+6,h=CELL-12;
  x.save();x.translate(x0+w/2,y+CELL/2);x.scale(dir,1);x.translate(-(x0+w/2),-(y+CELL/2));
  // l'ombra
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(x0+2,y0+3,w-2,h);
  if(kind==='truck'){
    // remolc i cabina
    x.fillStyle='#2a2a2a';x.fillRect(x0+4,y0-2,6,3);x.fillRect(x0+4,y0+h-1,6,3);x.fillRect(x0+w-14,y0-2,6,3);x.fillRect(x0+w-14,y0+h-1,6,3);
    x.fillStyle='#e8e8e8';x.fillRect(x0+1,y0,w-18,h);
    x.fillStyle='#c0c0c0';for(let i=x0+5;i<x0+w-18;i+=6)x.fillRect(i,y0+1,1,h-2);
    x.fillStyle='#d83030';x.fillRect(x0+w-16,y0+1,14,h-2);
    x.fillStyle='#8ad0ff';x.fillRect(x0+w-6,y0+3,3,h-6);
    x.fillStyle='#ffe080';x.fillRect(x0+w-2,y0+1,2,3);x.fillRect(x0+w-2,y0+h-4,2,3);
  }else if(kind==='dozer'){
    // un tractor amb la pala al davant
    x.fillStyle='#2a2a2a';x.fillRect(x0+3,y0-2,10,4);x.fillRect(x0+3,y0+h-2,10,4);x.fillRect(x0+16,y0,6,3);x.fillRect(x0+16,y0+h-3,6,3);
    x.fillStyle=col;x.fillRect(x0+2,y0+2,w-10,h-4);
    x.fillStyle='#3a3a3a';x.fillRect(x0+5,y0+5,8,h-10);
    x.fillStyle='#bdbdbd';x.fillRect(x0+w-6,y0-3,4,h+6);x.fillStyle='#8a8a8a';x.fillRect(x0+w-8,y0+2,2,h-4);
  }else{
    // un cotxe: carrosseria, vidres, rodes i fars
    x.fillStyle='#1a1a1a';x.fillRect(x0+4,y0-2,6,3);x.fillRect(x0+4,y0+h-1,6,3);x.fillRect(x0+w-10,y0-2,6,3);x.fillRect(x0+w-10,y0+h-1,6,3);
    x.fillStyle=col;x.beginPath();x.roundRect(x0+1,y0,w-2,h,4);x.fill();
    x.fillStyle='rgba(255,255,255,.35)';x.fillRect(x0+3,y0+1,w-8,2);
    x.fillStyle='#24344a';x.fillRect(x0+w-12,y0+3,4,h-6);x.fillRect(x0+6,y0+3,3,h-6);
    x.fillStyle='rgba(0,0,0,.2)';x.fillRect(x0+10,y0+3,w-22,h-6);
    x.fillStyle='#fff6b0';x.fillRect(x0+w-3,y0+1,2,3);x.fillRect(x0+w-3,y0+h-4,2,3);
    x.fillStyle='#ff4040';x.fillRect(x0+1,y0+1,1.5,3);x.fillRect(x0+1,y0+h-4,1.5,3);
  }
  x.restore();
}
function draw(){
  const ara=performance.now();
  x.fillStyle='#000';x.fillRect(0,0,W,H+BAR);
  // el riu, amb ones que corren
  const gr=x.createLinearGradient(0,rowY(1),0,rowY(6));gr.addColorStop(0,'#0a2a7a');gr.addColorStop(1,'#123c9a');
  x.fillStyle=gr;x.fillRect(0,rowY(1),W,CELL*5);
  x.fillStyle='rgba(140,190,255,.22)';
  for(let r=1;r<=5;r++)for(let i=0;i<8;i++){const wx=((i*61+r*37+ara*.02*(r%2?1:-1))%(W+30)+W+30)%(W+30)-15;x.fillRect(wx,rowY(r)+6+(i*11)%20,12,1.5)}
  // la mitjana i la sortida: voravia de rajoles amb herba
  for(const r of[6,12]){
    x.fillStyle='#6a5a7a';x.fillRect(0,rowY(r),W,CELL);
    x.fillStyle='#7a6a8a';for(let i=0;i<COLS*2;i++)x.fillRect(i*16+1,rowY(r)+1,14,CELL/2-2),x.fillRect(i*16+9,rowY(r)+CELL/2+1,14,CELL/2-2);
    x.fillStyle='#3a8a3a';x.fillRect(0,rowY(r)+(r===6?0:CELL-4),W,4);
  }
  // la carretera: asfalt, vorals i ratlles discontínues
  x.fillStyle='#2e2e34';x.fillRect(0,rowY(7),W,CELL*5);
  x.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<70;i++)x.fillRect((i*53)%W,rowY(7)+(i*29)%(CELL*5),2,2);
  x.fillStyle='#d8d8d8';x.fillRect(0,rowY(7),W,2);x.fillRect(0,rowY(12)-2,W,2);
  x.fillStyle='#e8d040';
  for(let r=8;r<=11;r++)for(let i=0;i<COLS*2;i++)x.fillRect(i*20+4,rowY(r)-1,10,2);
  // les casetes d'arribada: una bardissa amb cinc badies d'aigua i un nenúfar
  x.fillStyle='#1d6a24';x.fillRect(0,0,W,CELL);
  x.fillStyle='#2a8a30';for(let i=0;i<W;i+=8)x.beginPath(),x.arc(i+4,4+(i%16?2:0),6,0,7),x.fill();
  for(let i=0;i<5;i++){
    const cx=HOME_COLS[i]*CELL;
    x.fillStyle='#0d2b7a';x.fillRect(cx+3,6,CELL-6,CELL-6);
    x.fillStyle='#3aa04a';x.beginPath();x.arc(cx+CELL/2,CELL/2+4,9,.4,Math.PI*2-.1);x.lineTo(cx+CELL/2,CELL/2+4);x.fill();
    if(homes[i])drawFrog(cx+CELL/2,2,false);
    else if(fly&&fly.idx===i){
      // la mosca, amb ales que bateguen
      const fx=cx+CELL/2,fy=17,b=Math.floor(ara/60)%2;
      x.fillStyle='rgba(220,240,255,.8)';x.beginPath();x.ellipse(fx-4,fy-2-b,4,2.5,-.4,0,7);x.ellipse(fx+4,fy-2-b,4,2.5,.4,0,7);x.fill();
      x.fillStyle='#2a2a2a';x.beginPath();x.ellipse(fx,fy,3,5,0,0,7);x.fill();
      x.fillStyle='#ff3030';x.fillRect(fx-2,fy-5,1.5,1.5);x.fillRect(fx+.5,fy-5,1.5,1.5);
    }
  }
  // objectes de cada carril
  for(const l of lanes){
    for(const o of laneObjs(l)){
      const y=rowY(l.row);
      if(l.kind==='log'){
        // un tronc: escorça, anells a les puntes i una mica d'aigua que esquitxa
        x.fillStyle='rgba(255,255,255,.18)';x.fillRect(o.x-3,y+8,3,CELL-16);x.fillRect(o.x+o.w,y+8,3,CELL-16);
        x.fillStyle='#7a4a1e';x.beginPath();x.roundRect(o.x,y+5,o.w,CELL-10,8);x.fill();
        x.fillStyle='#9a6430';x.fillRect(o.x+4,y+7,o.w-8,3);
        x.fillStyle='#5c3616';for(let i=8;i<o.w-8;i+=11)x.fillRect(o.x+i,y+12+(i%3),7,1.5);
        x.fillStyle='#c8a070';x.beginPath();x.ellipse(o.x+o.w-5,y+CELL/2,4,CELL/2-6,0,0,7);x.fill();
        x.strokeStyle='#8a6030';x.lineWidth=1;x.beginPath();x.ellipse(o.x+o.w-5,y+CELL/2,2,5,0,0,7);x.stroke();
      }else if(l.kind==='turtle'){
        const d=turtleDown(l,o.i);
        if(d===2){
          // sota l'aigua: només es veuen les bombolles
          x.fillStyle='rgba(180,220,255,.5)';for(let i=0;i<l.len;i++){const tx=o.x+i*CELL+CELL/2;x.beginPath();x.arc(tx-3,y+CELL/2,2,0,7);x.arc(tx+4,y+CELL/2+3,1.5,0,7);x.fill()}
          continue;
        }
        x.globalAlpha=d===1?.55:1;
        for(let i=0;i<l.len;i++){
          const tx=o.x+i*CELL+CELL/2,ty=y+CELL/2,nada=Math.sin(ara/180+i)*2;
          // aletes, cap i closca (miren cap on neden: a l'esquerra)
          x.fillStyle='#2a8a50';
          x.beginPath();x.ellipse(tx-6,ty-9-nada,3,5,.6,0,7);x.ellipse(tx-6,ty+9+nada,3,5,-.6,0,7);x.ellipse(tx+7,ty-8+nada,2.5,4,-.6,0,7);x.ellipse(tx+7,ty+8-nada,2.5,4,.6,0,7);x.fill();
          x.beginPath();x.arc(tx-12,ty,4,0,7);x.fill();
          x.fillStyle='#000';x.fillRect(tx-14,ty-2,1.5,1.5);x.fillRect(tx-14,ty+1,1.5,1.5);
          x.fillStyle=d===1?'#2a6a4a':'#1d7a40';x.beginPath();x.ellipse(tx,ty,10,9,0,0,7);x.fill();
          x.strokeStyle=d===1?'#4a8a6a':'#5ac078';x.lineWidth=1.2;
          x.beginPath();x.moveTo(tx-6,ty-4);x.lineTo(tx,ty-7);x.lineTo(tx+6,ty-4);x.lineTo(tx+6,ty+4);x.lineTo(tx,ty+7);x.lineTo(tx-6,ty+4);x.closePath();x.stroke();
          x.beginPath();x.moveTo(tx-3,ty-2);x.lineTo(tx+3,ty-2);x.lineTo(tx+3,ty+2);x.lineTo(tx-3,ty+2);x.closePath();x.stroke();
        }
        x.globalAlpha=1;
      }else{
        const col=CARCOL[l.kind][o.i%CARCOL[l.kind].length];
        drawVehicle(l.kind,o,y,col,l.dir);
      }
    }
  }
  // granota
  if(state!=='over'){
    const k=frog.hop?Math.min(1,frog.hop.t/130):0;
    const px=frog.hop?frog.hop.fx+(frog.hop.tx-frog.hop.fx)*k:frog.x;
    const py=frog.hop?frog.hop.fy+(frog.hop.ty-frog.hop.fy)*k:rowY(frog.row);
    drawFrog(px,py,state==='dying',frog.ang||0,frog.hop?Math.sin(k*Math.PI):0);
  }
  // barra de temps
  x.fillStyle='#111';x.fillRect(0,H,W,BAR);
  const total=Math.max(18,32-level*1.5), frac=Math.max(0,timeLeft/total);
  x.fillStyle='#2a2a2a';x.fillRect(82,H+10,W-90,12);
  x.fillStyle=frac<0.3?'#ff3030':'#30ff30';
  x.fillRect(W-8-(W-90)*frac,H+10,(W-90)*frac,12);
  x.fillStyle='#fff';x.font='12px monospace';x.textAlign='left';x.fillText('TEMPS',6,H+21);
}
let last=performance.now();
function loop(t){const dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ===== CONTROLS =====
function dir(dx,dy){audioInit();if(state==='over'){start();return}hop(dx,dy)}
document.querySelector('#up').addEventListener('pointerdown',e=>{e.preventDefault();dir(0,-1)});
document.querySelector('.c-down').addEventListener('pointerdown',e=>{e.preventDefault();dir(0,1)});
document.querySelector('.c-left').addEventListener('pointerdown',e=>{e.preventDefault();dir(-1,0)});
document.querySelector('.c-right').addEventListener('pointerdown',e=>{e.preventDefault();dir(1,0)});
document.addEventListener('contextmenu',e=>e.preventDefault());
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
            w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
document.addEventListener('keydown',e=>{
  audioInit();
  if(KEYS[e.key]){e.preventDefault();dir(...KEYS[e.key])}
  if(e.key==='p'||e.key==='P'){if(state!=='over'){paused=!paused;paused?msg("PAUSA"):hideMsg()}}
  if(e.key==='Enter'&&state==='over')start();
});
let sw=null;
c.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();
  if(state==='over'){start();return}
  sw={x:e.clientX,y:e.clientY}});
c.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)<24)return;
  Math.abs(dx)>Math.abs(dy)?hop(dx>0?1:-1,0):hop(0,dy>0?1:-1);
  sw=null;
});
c.addEventListener('pointerup',()=>sw=null);
c.addEventListener('pointercancel',()=>sw=null);
document.getElementById('msg').addEventListener('click',()=>{if(state==='over'){audioInit();start()}});

start();

// En entrar al joc, els records uns segons, com les maquines de debo.
// El joc queda en pausa mentre es veuen.
Records.pantallaInicial(JOC,()=>paused=true,()=>paused=false);
</script>
