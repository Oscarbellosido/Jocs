// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type="sine",vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+dur);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.008);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(MG);o.start(now);o.stop(now+dur+.02);
}
// cada lletra que afegeixes sona una mica mes aguda: la paraula "puja"
const ESCALA=[523,587,659,698,784,880,988,1047];
function sndLletra(i){aInit();tone(ESCALA[Math.min(i,7)],.08,"triangle",.16)}
function sndNo(){aInit();tone(170,.14,"square",.08,-40)}
function sndParaula(){aInit();[659,784,988,1319].forEach((f,i)=>setTimeout(()=>tone(f,.16,"triangle",.2),i*65))}
function sndMoneda(){aInit();tone(988,.07,"square",.07);setTimeout(()=>tone(1319,.14,"square",.07),70)}
function sndJaHi(){aInit();tone(440,.08,"sine",.15);setTimeout(()=>tone(440,.08,"sine",.12),110)}
function sndNivell(){aInit();[523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.2,"triangle",.22),i*95))}

const PARAULES=[],ESCRITA={},RANG=new Map();

const mascara=w=>{let m=0;for(const ch of w)m|=1<<LLETRES.indexOf(ch);return m};

// ===== L'ATZAR AMB LLAVOR =====
// El nivell 37 ha de ser el mateix per a tothom: tot surt d'una llavor.
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rngDe=s=>mulberry(hashText(s));

// ===== ELS NIVELLS =====
// Les que es poden fer amb les lletres de la base, entre les R mes dites.
function subparaules(base,R){
  const bc=comptaLletres(base),bm=mascara(base),out=[];
  const fins=Math.min(R,PARAULES.length);
  for(let i=0;i<fins;i++){
    if(MASC[i]&~bm||PARAULES[i].length>base.length)continue;
    const v=CNT[i];let ok=true;
    for(let k=0;k<27;k++)if(v[k]>bc[k]){ok=false;break}
    if(ok)out.push(PARAULES[i]);
  }
  return out;
}
// La dificultat puja a trams: quantes lletres te la rotllana (L), fins a quina
// paraula de la llista es fan servir (R: com mes amunt, mes corrents) i
// quantes paraules hi ha als encreuats. El primer nivell es de quatre lletres
// i tres o quatre paraules, per entendre-ho jugant.
const TRAMS=[
  {des:1,   fins:4,   L:4, R:1500, min:3, max:4},
  {des:5,   fins:15,  L:5, R:2500, min:4, max:5},
  {des:16,  fins:40,  L:5, R:3500, min:5, max:7},
  {des:41,  fins:80,  L:6, R:4500, min:6, max:8},
  {des:81,  fins:150, L:6, R:6000, min:7, max:10},
  {des:151, fins:1e9, L:7, R:7500, min:8, max:12},
];
const tramDe=n=>{let t=TRAMS[0];for(const x of TRAMS)if(n>=x.des)t=x;return t};
// Cada llargada te la seva llista de bases, barrejada sempre igual. El nivell
// j-essim d'un tram fa servir la j-essima que dona prou paraules, i un tram
// segueix on el va deixar l'anterior de la mateixa llargada: aixi cap base no
// es repeteix fins que no s'acaben.
const BASES={};
function basesDe(L){
  if(!BASES[L]){
    const ll=[];for(let i=0;i<PARAULES.length;i++)if(PARAULES[i].length===L)ll.push(PARAULES[i]);
    const r=rngDe('ROTLLANA-BASES-'+L);
    for(let i=ll.length-1;i>0;i--){const k=Math.floor(r()*(i+1));[ll[i],ll[k]]=[ll[k],ll[i]]}
    BASES[L]={ll};
  }
  return BASES[L].ll;
}
const BONES={};
function baseDe(t,j){
  if(!BONES[t.des]){
    // on comenca: on va acabar el tram anterior de la mateixa llargada
    let des=0;
    for(const a of TRAMS){if(a===t)break;if(a.L===t.L){baseDe(a,a.fins-a.des);des=BONES[a.des].mirades}}
    BONES[t.des]={mirades:des,bones:[]};
  }
  const b=BONES[t.des],ll=basesDe(t.L);
  while(b.bones.length<=j&&b.mirades<ll.length){
    const w=ll[b.mirades++];
    if(RANG.get(w)<t.R&&subparaules(w,t.R).length>=t.min+1)b.bones.push(w);
  }
  if(!b.bones.length)return ll[j%ll.length];
  return b.bones[j%b.bones.length];
}

// Els mots encreuats: la base va primer, i les altres s'hi enganxen creuant
// alguna lletra que ja hi sigui. Cap lletra no pot tocar de costat una altra
// paraula (si no, sortirien paraules que no existeixen), i el conjunt ha de
// cabre a la pantalla. Es prova trenta vegades i es queda la que en posa mes
// i ocupa menys.
const MAXC=10,MAXF=9;
function disposa(ps,maxim,rng){
  let millor=null;
  for(let intent=0;intent<30;intent++){
    const cel=new Map(),k=(f,c)=>f*1000+c;
    const col=[];
    const posa=(w,f,c,d)=>{
      for(let i=0;i<w.length;i++){
        const kk=k(f+(d?i:0),c+(d?0:i));const o=cel.get(kk)||{l:w[i],h:0,v:0};
        o[d?'v':'h']=1;cel.set(kk,o);
      }
      col.push({w,f,c,d});
    };
    const creua=(w,f,c,d)=>{
      if(cel.has(k(f-(d?1:0),c-(d?0:1)))||cel.has(k(f+(d?w.length:0),c+(d?0:w.length))))return -1;
      let n=0;
      for(let i=0;i<w.length;i++){
        const ff=f+(d?i:0),cc=c+(d?0:i),o=cel.get(k(ff,cc));
        if(o){if(o.l!==w[i]||o[d?'v':'h'])return -1;n++}
        else if(d?(cel.has(k(ff,cc-1))||cel.has(k(ff,cc+1))):(cel.has(k(ff-1,cc))||cel.has(k(ff+1,cc))))return -1;
      }
      return n>0&&n<w.length?n:-1;
    };
    const ordre=[ps[0],...ps.slice(1).map(w=>[w,rng()]).sort((a,b)=>b[0].length-a[0].length||a[1]-b[1]).map(a=>a[0])];
    const d0=intent%2;
    posa(ordre[0],0,0,d0);
    let f0=0,f1=d0?ordre[0].length-1:0,c0=0,c1=d0?0:ordre[0].length-1;
    for(const w of ordre.slice(1)){
      if(col.length>=maxim)break;
      let bo=null;
      for(const [kk,o] of cel){
        const ff=Math.round(kk/1000),cc=kk-ff*1000;
        for(let i=0;i<w.length;i++){
          if(w[i]!==o.l)continue;
          for(const d of [0,1]){
            if(o[d?'v':'h'])continue;
            const f=d?ff-i:ff,cg=d?cc:cc-i,n=creua(w,f,cg,d);
            if(n<0)continue;
            const nf0=Math.min(f0,f),nf1=Math.max(f1,f+(d?w.length-1:0)),nc0=Math.min(c0,cg),nc1=Math.max(c1,cg+(d?0:w.length-1));
            const hh=nf1-nf0+1,ww=nc1-nc0+1;
            if(hh>MAXF||ww>MAXC)continue;
            const s=n*3-hh*ww/10-Math.abs(hh-ww*0.8)*0.5+rng();
            if(!bo||s>bo.s)bo={f,c:cg,d,s,nf0,nf1,nc0,nc1};
          }
        }
      }
      if(!bo)continue;
      posa(w,bo.f,bo.c,bo.d);f0=bo.nf0;f1=bo.nf1;c0=bo.nc0;c1=bo.nc1;
    }
    const sc=col.length*100-(f1-f0+1)*(c1-c0+1);
    if(!millor||sc>millor.sc)millor={sc,col:col.map(p=>({...p,f:p.f-f0,c:p.c-c0})),files:f1-f0+1,cols:c1-c0+1};

}
function nivell(n){
  const t=tramDe(n),rng=rngDe('ROTLLANA-'+n);
  const base=baseDe(t,n-t.des);

  const d=disposa([base,...sub.slice(0,t.max*2)],t.max,rng);
  // la rotllana: les lletres de la base barrejades, que no es llegeixi d'entrada
  let roda=base.split('');
  for(let k=0;k<20;k++){
    for(let i=roda.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[roda[i],roda[j]]=[roda[j],roda[i]]}
    if(roda.join('')!==base)break;
  }
  return {n,base,roda,col:d.col,files:d.files,cols:d.cols};
}

  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,cel1);gr.addColorStop(.55,cel2);gr.addColorStop(1,cel2);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const r=rngDe('PAIS-'+i);
  const muntanya=(y0,amp,col,ones)=>{
    const fa=[0,1,2].map(()=>r()*6.28);
    g.fillStyle=col;g.beginPath();g.moveTo(0,H);
    for(let px=0;px<=W;px+=6){
      let y=y0;ones.forEach((o,k)=>{y-=Math.sin(px/o+fa[k])*amp/(k+1)});
      g.lineTo(px,y);
    }
    g.lineTo(W,H);g.closePath();g.fill();
  };
  muntanya(H*0.56,46,lluny,[60,23,9]);
  if(mar){const m=g.createLinearGradient(0,H*0.66,0,H);m.addColorStop(0,'#4a9cc8');m.addColorStop(1,'#2d6f9a');g.fillStyle=m;g.fillRect(0,H*0.66,W,H)}
  muntanya(H*(mar?0.74:0.68),34,aprop,[80,31,13]);
  fonsDe[i]=o;return o;
}

// ===== LA PARTIDA =====
const JOC='rotllana';
let N=1,monedes=30,L=null,obertes=new Set(),extres=new Set(),state='play',paused=false;
let roda=[],tria=[],dit=null,avis='',avisT=0,avisCol='#fff',tremola=0,temps=0,girT=0;
let saltaCel=new Map(),volen=[],festaT=0;
const PREU_PISTA=10;
const clauCel=(f,c)=>f+','+c;
const cellesDe=p=>Array.from({length:p.w.length},(_,i)=>clauCel(p.f+(p.d?i:0),p.c+(p.d?0:i)));
const trobada=p=>cellesDe(p).every(k=>obertes.has(k));

const llegeix=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}};
const desa=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
// Es desa a cada pas: tancant i tornant, el nivell queda com el vas deixar.
function desaTot(){desa('rotllana',{n:N,monedes,obertes:[...obertes],extres:[...extres],roda:roda.join('')})}

function comenca(n,res){
  N=n;L=nivell(n);
  obertes=new Set(res&&res.obertes||[]);extres=new Set(res&&res.extres||[]);
  roda=res&&res.roda&&res.roda.split('').sort().join('')===L.base.split('').sort().join('')?res.roda.split(''):L.roda.slice();
  tria=[];dit=null;state='play';festaT=0;girT=0;saltaCel.clear();volen=[];
  hideMsg();desaTot();updateHUD();
}

// --- trobar paraules ---
function diu(t,col='#fff',dur=1.3){avis=t;avisCol=col;avisT=dur}
function prova(){
  const w=tria.map(i=>roda[i]).join('');
  const posicions=tria.map(i=>posLletra(i));
  tria=[];
  if(state!=='play'||!w)return;
  if(w.length<3){if(w.length>1){diu('com a mínim tres lletres','#ffd27a');sndNo()}return}
  const p=L.col.find(q=>q.w===w);
  if(p){
    if(trobada(p)){
      diu('aquesta ja hi és','#ffd27a');sndJaHi();
      cellesDe(p).forEach((k,i)=>saltaCel.set(k,-i*0.05));
      return;
    }
    // les lletres volen de la rotllana a la seva casella
    cellesDe(p).forEach((k,i)=>{
      if(obertes.has(k))return;
      const [f,cc]=k.split(',').map(Number),[tx,ty]=centreCel(f,cc);
      volen.push({l:w[i],x0:posicions[i][0],y0:posicions[i][1],x1:tx,y1:ty,t:-i*0.05,k});
    });
    cellesDe(p).forEach(k=>obertes.add(k));
    diu(escrita(w),'#fff',1.1);sndParaula();
    desaTot();
    if(L.col.every(trobada))acabaNivell();
    return;
  }
  if(existeix(w)){
    if(extres.has(w)){diu('extra repetida: '+escrita(w),'#ccc');sndJaHi();return}
    extres.add(w);monedes+=1;desaTot();updateHUD();
    diu('EXTRA: '+escrita(w)+'  +1 🪙','#ffe08a',1.4);sndMoneda();
    return;
  }
  diu(w.toUpperCase()+'? no hi és','#ffb0a0');sndNo();tremola=0.35;
}

function pista(){
  if(state!=='play'||paused)return;
  if(monedes<PREU_PISTA){diu('et falten monedes: busca paraules extres','#ffb0a0',1.8);sndNo();return}
  // la paraula on menys en falten, i d'aquesta la primera lletra que no tens
  const falten=L.col.filter(p=>!trobada(p)).map(p=>({p,q:cellesDe(p).filter(k=>!obertes.has(k))}));
  if(!falten.length)return;
  falten.sort((a,b)=>a.q.length-b.q.length);
  const k=falten[0].q[0];
  obertes.add(k);monedes-=PREU_PISTA;saltaCel.set(k,0);sndMoneda();
  desaTot();updateHUD();
  if(L.col.every(trobada))acabaNivell();
}
function barreja(){
  if(state!=='play'||paused)return;
  const vell=roda.join('');
  for(let k=0;k<10;k++){
    for(let i=roda.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[roda[i],roda[j]]=[roda[j],roda[i]]}
    if(roda.join('')!==vell)break;
  }
  tria=[];girT=0.35;desaTot();
}

async function acabaNivell(){
  state='fet';festaT=1.6;
  const guany=3;monedes+=guany;
  setTimeout(sndNivell,250);
  desaTot();updateHUD();
  setTimeout(()=>finalNivell(guany),1300);
}
async function finalNivell(guany){
  const fet=N;
  const ps=L.col.map(p=>escrita(p.w)).join(' · ');
  const ext=[...extres].map(escrita);
  let t='<div style="color:#8fd16a">NIVELL '+fet+' FET!</div>'+
    '<small style="color:#ddd">'+ps+'</small>'+
    (ext.length?'<small style="color:#ffe08a">extres: '+ext.join(' · ')+'</small>':'')+
    '<small style="color:#ffe08a">+'+guany+' 🪙 per acabar-lo · en tens '+monedes+'</small>'+
    '<div id="taula" style="margin:8px 0;color:#888;font-size:12px"></div>'+
    '<div style="margin-top:10px"><a href="#" id="seguent" style="display:inline-block;font:16px monospace;color:#fff;text-decoration:none;background:#2d6a3e;border:1px solid #8fd16a;border-radius:8px;padding:10px 18px">SEGÜENT ▶</a></div>'+
    Records.peuFinal('o toca per seguir');
  msg(t);
  document.getElementById('seguent').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();seguent()});
  // Els nivells passats son la puntuacio. Amb les inicials ja desades
  // s'envia sense dir res; la primera vegada, si entres a la taula, te les
  // demana.
  try{
    if(Records.nom()){Records.desaLocal(JOC,fet);await Records.envia(JOC,fet)}
    else{
      const r=await Records.fiPartida(JOC,fet);
      const el=document.getElementById('taula');
      if(el&&r.posicio)el.innerHTML='<div style="color:#ff0;font-size:13px">Ets el número '+r.posicio+' de la Rotllana!</div>';
    }
  }catch(e){}
  Records.pintaMillor(JOC,document.getElementById('best'),fet);
}
function seguent(){if(state!=='fet')return;hideMsg();comenca(N+1)}

function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}
function updateHUD(){
  document.getElementById('score').textContent=N;
  const bp=document.getElementById('pista');
  bp.textContent='PISTA · '+PREU_PISTA+' 🪙';bp.classList.toggle('pobre',monedes<PREU_PISTA);
  Records.marcador(JOC,document.getElementById('best'),N-1);
}

// ===== DIBUIX =====
const ROC={x:W/2,y:510},RR=84,RL=30;   // la rotllana: centre, radi, i radi de cada lletra
const AREA={x:12,y:52,w:W-24,h:284};      // on van els encreuats
function posLletra(i){
  const a=-Math.PI/2+i*2*Math.PI/roda.length+(girT>0?girT*4:0);
  return [ROC.x+Math.cos(a)*RR,ROC.y+Math.sin(a)*RR];
}
function mides(){
  const m=Math.min(AREA.w/L.cols,AREA.h/L.files,46);
  return {m,x0:AREA.x+(AREA.w-m*L.cols)/2,y0:AREA.y+(AREA.h-m*L.files)/2};
}
function centreCel(f,cc){const {m,x0,y0}=mides();return [x0+cc*m+m/2,y0+f*m+m/2]}
function rrect(x0,y0,w,h,r){x.beginPath();x.moveTo(x0+r,y0);x.arcTo(x0+w,y0,x0+w,y0+h,r);x.arcTo(x0+w,y0+h,x0,y0+h,r);
  x.arcTo(x0,y0+h,x0,y0,r);x.arcTo(x0,y0,x0+w,y0,r);x.closePath()}
function text(t,px,py,col='#fff',font='14px monospace',al='center'){x.fillStyle=col;x.font=font;x.textAlign=al;x.fillText(t,px,py)}
function textOmbra(t,px,py,col,font,al='center'){x.save();x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=4;x.shadowOffsetY=1;text(t,px,py,col,font,al);x.restore()}

function draw(){
  if(!L)return;
  x.drawImage(fons(N),0,0);
  const pais=paisDe(N);
  // a dalt: el lloc, el nivell i les monedes
  textOmbra(pais[0],14,30,'#fff','bold 15px Georgia,serif','left');
  textOmbra('nivell '+N,14,46,'rgba(255,255,255,.9)','12px monospace','left');
  x.fillStyle='#f5c542';x.beginPath();x.arc(W-70,24,10,0,7);x.fill();x.strokeStyle='#b8860b';x.lineWidth=2;x.stroke();
  textOmbra(String(monedes),W-54,30,'#fff','bold 17px monospace','left');
  if(extres.size)textOmbra('extres: '+extres.size,W-14,46,'rgba(255,255,255,.9)','12px monospace','right');

  // els encreuats
  const {m,x0,y0}=mides();
  const tots=new Map();
  for(const p of L.col)cellesDe(p).forEach((k,i)=>tots.set(k,p.w[i]));
  const volant=new Set(volen.filter(v=>v.t<1).map(v=>v.k));
  for(const [k,l] of tots){
    const [f,cc]=k.split(',').map(Number);
    let px=x0+cc*m,py=y0+f*m,mm=m-4;
    const s=saltaCel.get(k);
    let esc=1;if(s!==undefined&&s>0&&s<1)esc=1+Math.sin(s*Math.PI)*0.25;
    const cx=px+m/2,cy=py+m/2;mm*=esc;
    const ob=obertes.has(k)&&!volant.has(k);
    // buides, blanques i mig transparents; les que ja tens, del color del fil
    x.fillStyle=ob?'#e86e3c':'rgba(255,255,255,.62)';
    rrect(cx-mm/2,cy-mm/2,mm,mm,Math.max(3,mm*0.16));x.fill();
    x.strokeStyle=ob?'#b84a20':'rgba(70,50,30,.28)';x.lineWidth=1.5;x.stroke();
    if(ob)text(l.toUpperCase(),cx,cy+mm*0.25,'#fff','bold '+Math.round(mm*0.62)+'px Georgia,serif');
  }
  if(festaT>0){
    for(const [k] of tots){const [f,cc]=k.split(',').map(Number);
      const a=Math.max(0,Math.sin((1.6-festaT)*8-(f+cc)*0.5));
      if(a>0){const [cx,cy]=centreCel(f,cc);x.fillStyle='rgba(255,230,120,'+(a*0.5)+')';rrect(cx-m/2+2,cy-m/2+2,m-4,m-4,5);x.fill()}}
  }

  // la paraula que estas fent, o l'avis
  const yp=360;
  if(tria.length){
    const ll=tria.map(i=>roda[i].toUpperCase()),mw=30,tw=ll.length*mw;
    let sx=W/2-tw/2;
    x.fillStyle='rgba(30,40,60,.82)';rrect(sx-8,yp-22,tw+16,36,10);x.fill();
    ll.forEach((l,i)=>text(l,sx+i*mw+mw/2,yp+5,'#fff','bold 24px Georgia,serif'));
  }else if(N<=2&&!obertes.size&&!(avisT>0&&avis)&&state==='play'){
    // els dos primers nivells, fins que trobes la primera: com es juga
    x.globalAlpha=0.6+0.4*Math.sin(temps*4);
    textOmbra('llisca el dit d\'una lletra a l\'altra',W/2,yp+4,'#fff','bold 15px monospace');
    x.globalAlpha=1;
  }else if(avisT>0&&avis){
    const sh=tremola>0?Math.sin(temps*60)*tremola*14:0;
    x.globalAlpha=Math.min(1,avisT*2);
    x.font='bold 16px monospace';const tw=x.measureText(avis).width;
    x.fillStyle='rgba(20,28,44,.85)';rrect(W/2-tw/2-12+sh,yp-20,tw+24,32,10);x.fill();
    text(avis,W/2+sh,yp+2,avisCol,'bold 16px monospace');
    x.globalAlpha=1;
  }

  // la rotllana
  x.fillStyle='rgba(255,255,255,.88)';x.beginPath();x.arc(ROC.x,ROC.y,RR+RL+10,0,7);x.fill();
  x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=2;x.stroke();
  // el fil que uneix les lletres triades, i fins al dit
  if(tria.length){
    x.strokeStyle='rgba(232,110,60,.85)';x.lineWidth=10;x.lineCap='round';x.lineJoin='round';
    x.beginPath();tria.forEach((i,k)=>{const [px,py]=posLletra(i);k?x.lineTo(px,py):x.moveTo(px,py)});
    if(dit)x.lineTo(dit.x,dit.y);
    x.stroke();
  }
  roda.forEach((l,i)=>{
    const [px,py]=posLletra(i),t=tria.includes(i);
    x.fillStyle=t?'#e86e3c':'#fff';x.beginPath();x.arc(px,py,RL,0,7);x.fill();
    x.strokeStyle=t?'#b84a20':'rgba(0,0,0,.18)';x.lineWidth=2;x.stroke();
    text(l.toUpperCase(),px,py+11,t?'#fff':'#2b2b38','bold 32px Georgia,serif');
  });

  // les lletres que volen cap a la seva casella
  for(const v of volen){
    if(v.t<=0||v.t>=1)continue;
    const e=1-Math.pow(1-v.t,3);
    const px=v.x0+(v.x1-v.x0)*e,py=v.y0+(v.y1-v.y0)*e,r=RL*(1-e)+m*0.45*e;
    x.fillStyle='#e86e3c';x.beginPath();x.arc(px,py,r,0,7);x.fill();
    text(v.l.toUpperCase(),px,py+r*0.36,'#fff','bold '+Math.round(r*1.05)+'px Georgia,serif');
  }
  if(paused){x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,W,H);text('PAUSA',W/2,H/2,'#fff','bold 26px monospace')}
}

let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last)/1000;last=t;temps+=dt;
  if(!paused){
    if(avisT>0)avisT-=dt;
    if(tremola>0)tremola=Math.max(0,tremola-dt);
    if(girT>0)girT=Math.max(0,girT-dt);
    if(festaT>0)festaT=Math.max(0,festaT-dt);
    for(const v of volen){const abans=v.t;v.t+=dt/0.35;if(abans<1&&v.t>=1)saltaCel.set(v.k,0.001)}
    volen=volen.filter(v=>v.t<1);
    for(const [k,s] of saltaCel){const n=s+dt/0.3;if(n>=1)saltaCel.delete(k);else saltaCel.set(k,n)}
  }
  draw();requestAnimationFrame(loop);
}

// ===== EL DIT =====
// Es posa el dit en una lletra i es llisca per les altres; en aixecar-lo,
// la paraula s'envia sola. Tornant a la lletra d'abans es desfa l'ultima.
function punt(ev){
  const r=c.getBoundingClientRect();
  return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};
}
function lletraA(q,radi){
  for(let i=0;i<roda.length;i++){const [px,py]=posLletra(i);if(Math.hypot(q.x-px,q.y-py)<radi)return i}
  return -1;
}
c.addEventListener('pointerdown',ev=>{
  aInit();
  // mentre la rotllana gira (BARREJA), les lletres no son on el dit les buscaria
  if(paused||state!=='play'||girT>0)return;
  const q=punt(ev),i=lletraA(q,RL+8);
  if(i<0)return;
  try{c.setPointerCapture(ev.pointerId)}catch(e){}
  tria=[i];dit=q;avisT=0;sndLletra(0);
});
c.addEventListener('pointermove',ev=>{
  if(!dit)return;
  const q=punt(ev);dit=q;
  // un radi una mica mes petit en lliscar: passant entre dues lletres no s'agafa cap
  const i=lletraA(q,RL-4);
  if(i<0)return;
  if(tria.length>1&&i===tria[tria.length-2]){tria.pop();sndLletra(tria.length-1);return}
  if(!tria.includes(i)){tria.push(i);sndLletra(tria.length-1)}
});
function aixeca(){if(!dit)return;dit=null;prova()}
c.addEventListener('pointerup',aixeca);
c.addEventListener('pointercancel',()=>{dit=null;tria=[]});
document.addEventListener('contextmenu',e=>e.preventDefault());

// Amb teclat (a l'ordinador): s'escriu la paraula i Enter
document.addEventListener('keydown',e=>{
  aInit();
  if(e.code==='KeyP'){paused=!paused;return}
  if(paused)return;
  if(state==='fet'){if(e.key==='Enter'||e.key===' ')seguent();return}
  if(e.key==='Enter'){prova();return}
  if(e.key==='Backspace'){tria.pop();return}
  if(e.key===' '){barreja();return}
  const k=e.key.toLowerCase();
  if(k.length===1){
    const i=roda.findIndex((l,j)=>l===k&&!tria.includes(j));
    if(i>=0){tria.push(i);sndLletra(tria.length-1)}
  }
});
document.getElementById('msg').addEventListener('click',e=>{if(!e.target.closest('a'))seguent()});

function boto(b,fn){b.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();if(paused)return;fn()})}
boto(document.getElementById('barreja'),barreja);
boto(document.getElementById('pista'),pista);

// ===== RECUPERAR EL NIVELL D'UN ALTRE LLOC =====
// El nivell es desa dins de cada navegador: l'ordinador, el mobil, l'app
// instal·lada i Telegram per dins son llocs diferents. En Carles anava molt
// endavant i, obrint-la des d'un altre lloc, va tornar a comencar pel 1. Pero
// la taula de records ja sap fins on ha arribat cadascu: d'alla es recupera.
const estilBoto='display:inline-block;font:15px monospace;text-decoration:none;border-radius:8px;padding:10px 14px;margin:6px;white-space:nowrap';
async function recupera(){
  let llista=null;try{llista=await Records.llista(JOC)}catch(e){}
  if(!llista||!llista.length||state!=='play')return;
  const de=n=>llista.find(e=>e.n===n);
  const nom=Records.nom();
  if(nom){const e=de(nom);if(e&&e.p>=N)ofereix(e.p,nom);return}
  if(N<=3)demanaInicials(de);
}
function salta(p){
  comenca(p+1);
  if(monedes<30)monedes=30;
  desaTot();updateHUD();Records.pintaMillor(JOC,document.getElementById('best'),N-1);
  diu('continues pel nivell '+N,'#7dff9b',2);
}
function ofereix(p,nom){
  msg('<div style="color:#8fd16a">JA HI HAVIES JUGAT</div>'+
    '<small>A la taula, '+nom+' té '+p+' nivells fets, i aquí vas pel '+N+'.</small>'+
    '<div style="margin-top:10px"><a href="#" id="rec-si" style="'+estilBoto+';color:#fff;background:#2d6a3e;border:1px solid #8fd16a">CONTINUA PEL '+(p+1)+'</a>'+
    '<a href="#" id="rec-no" style="'+estilBoto+';color:#aaa;background:#111;border:1px solid #555">ARA NO</a></div>');

  document.getElementById('rec-no').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();hideMsg()});
}
function demanaInicials(de){
  msg('<div style="color:#8fd16a">JA HI HAVIES JUGAT?</div>'+
    '<small>Si hi jugaves en un altre mòbil o navegador, escriu les teves inicials i continues on ho vas deixar.</small>'+
    '<div style="margin-top:10px"><input id="rec-ini" maxlength="3" autocomplete="off" style="width:90px;height:auto;font:bold 24px monospace;text-align:center;text-transform:uppercase;background:#111;color:#ff0;border:1px solid #666;border-radius:6px;padding:6px"></div>'+
    '<div id="rec-avis" style="font-size:12px;color:#ffb0a0;min-height:16px;margin-top:6px"></div>'+
    '<div><a href="#" id="rec-si" style="'+estilBoto+';color:#fff;background:#2d6a3e;border:1px solid #8fd16a">CONTINUA</a>'+
    '<a href="#" id="rec-no" style="'+estilBoto+';color:#aaa;background:#111;border:1px solid #555">SÓC NOU</a></div>');
  const camp=document.getElementById('rec-ini');
  // les lletres que s'escriuen aqui no han d'anar a la rotllana
  camp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')prova()});
  camp.addEventListener('click',e=>e.stopPropagation());
  const prova=()=>{
    const n=(camp.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);
    const e=n&&de(n);
    if(!e){document.getElementById('rec-avis').textContent=n?n+' no és a la taula de la Rotllana':'escriu les teves inicials';return}
    try{localStorage.setItem('jugador',n)}catch(er){}
    hideMsg();salta(e.p);
  };
  document.getElementById('rec-si').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();prova()});
  document.getElementById('rec-no').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();hideMsg()});
}
</script>
