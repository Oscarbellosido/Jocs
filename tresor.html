<script>
// EL TRESOR DELS TEMPLERS: deu llocs de Catalunya, de Montserrat al castell
// de Miravet. Cap no es passa corrent ni saltant: a cada un hi ha alguna
// cosa per descobrir o un enigma per resoldre. Tot es fa tocant: les coses de l'escena, i els objectes de la
// motxilla (un toc l'agafa, un altre toc on el vols fer servir).

const W=360,H=270,JOC='tresor',CLAU='tresor-partida';
const $=id=>document.getElementById(id);
const CV=$('c'),IV=$('inv'),gc=CV.getContext('2d'),gi=IV.getContext('2d');
let g=gc,K=1,DPR=1,IS=44;

// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){}
}
function tone(f,d,type='sine',vol=.2,slide=0,del=0){
  if(!AC)return;const t=AC.currentTime+del,o=AC.createOscillator(),gg=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  gg.gain.setValueAtTime(vol,t);gg.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gg);gg.connect(MG);o.start(t);o.stop(t+d+.02);
}
function soroll(d,vol,fc){
  if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
  const gg=AC.createGain();gg.gain.value=vol;s.connect(f);f.connect(gg);gg.connect(MG);s.start();
}
const NOTES=[262,330,392,523];
const so={
  toc(){aInit();tone(520,.05,'triangle',.08)},
  agafa(){aInit();tone(660,.08,'triangle',.15);tone(990,.14,'triangle',.15,0,.08)},
  no(){aInit();tone(160,.2,'square',.08,-50)},
  roda(){aInit();tone(140,.08,'square',.05,40);soroll(.12,.15,700)},
  obre(){aInit();soroll(1.3,.4,320);tone(70,1.1,'sawtooth',.08,-20)},
  campana(k){aInit();const f=NOTES[k];tone(f,1.5,'sine',.22);tone(f*2.76,.6,'sine',.05);tone(f*5.4,.3,'sine',.03)},
  xiula(k){aInit();const f=NOTES[k]*2;tone(f,.3,'sine',.14,f*.06)},
  pista(){aInit();tone(523,.2,'sine',.15,260)},
  crac(){aInit();soroll(.45,.45,900);tone(90,.4,'sawtooth',.1,-40)},
  fi(){aInit();[523,659,784,1047,1319].forEach((f,i)=>tone(f,.32,'triangle',.2,0,i*.12))},
};

// ===== EINES DE DIBUIX =====
const PI=Math.PI;
const rr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(0,r),0,PI*2);g.fill()}
function E(x,y,rx,ry,c,a=0){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),a,0,PI*2);g.fill()}
function P(c,...p){g.fillStyle=c;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function Ln(c,w,...p){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke()}
function RR(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()}
function lg(x0,y0,x1,y1,...st){const gr=g.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<st.length;i+=2)gr.addColorStop(st[i],st[i+1]);return gr}
function cel(a,b,h=H){g.fillStyle=lg(0,0,0,h,0,a,1,b);g.fillRect(0,0,W,h)}
function txt(t,x,y,size,c,al='center'){g.fillStyle=c;g.font='bold '+size+'px monospace';g.textAlign=al;g.textBaseline='middle';g.fillText(t,x,y)}
// una paret de carreus
function pedres(x,y,w,h,base,linia,bh=16,bw=30){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();R(x,y,w,h,base);
  let i=0;
  for(let yy=y,row=0;yy<y+h;yy+=bh,row++){
    const off=(row%2)*bw/2;
    for(let xx=x-off;xx<x+w;xx+=bw,i++){
      g.fillStyle='rgba(0,0,0,'+(rr(i+row*7)*.14)+')';g.fillRect(xx+1,yy+1,bw-2,bh-2);
      g.fillStyle='rgba(255,255,255,.07)';g.fillRect(xx+1,yy+1,bw-2,2);
      g.fillStyle=linia;g.fillRect(xx,yy,1.5,bh);
    }
    g.fillStyle=linia;g.fillRect(x,yy,w,1.5);
  }
  g.restore();
}
function fulla(x,y,l,a,c){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=c;g.beginPath();g.ellipse(l/2,0,l/2,l/5,0,0,PI*2);g.fill();
  g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=.8;g.beginPath();g.moveTo(0,0);g.lineTo(l,0);g.stroke();g.restore()}
function mata(x,y,r,s,cols=['#2f6b34','#3f8a42','#245a2a','#4d9a4a']){
  for(let k=0;k<16;k++){const a=rr(s*31+k)*PI*2,d=rr(s*17+k*3)*r*.55;fulla(x+Math.cos(a)*d,y+Math.sin(a)*d*.8,r*.7,a,cols[k%cols.length])}
}
function lianes(x,y,w,h,t){
  for(let i=0;i<11;i++){
    const lx=x+i*w/10,ll=h*(.7+.3*rr(i+50)),sw=Math.sin(t*.8+i)*2;
    g.strokeStyle=i%2?'#2e5a26':'#3d7030';g.lineWidth=2.4;g.beginPath();g.moveTo(lx,y);
    for(let k=1;k<=10;k++)g.lineTo(lx+Math.sin(k*.9+i)*5+sw*k/10,y+ll*k/10);g.stroke();
    for(let k=1;k<9;k++)fulla(lx+Math.sin(k*.9+i)*5+sw*k/10,y+ll*k/9,11,k%2?.6:PI-.6,k%3?'#3f8a42':'#2f6b34');
  }
}
function herba(y,c='#4f7a30'){for(let i=0;i<46;i++){const x=i*8+rr(i)*6;Ln(c,1.4,x,y+4,x-2+rr(i+5)*4,y-4-rr(i+9)*6)}}
// els dibuixos gravats: 0 sol, 1 lluna, 2 estrella, 3 ones, 4 calavera
function simbol(k,x,y,s,c,lw=2,forat='rgba(0,0,0,.55)'){
  const r=s/2;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=lw;g.lineCap='round';
  if(k===0){g.beginPath();g.arc(x,y,r*.42,0,PI*2);g.fill();
    for(let i=0;i<8;i++){const a=i*PI/4;g.beginPath();g.moveTo(x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke()}}
  else if(k===1){const rr2=r*.85,d=r*.5,R2=Math.hypot(rr2,d);g.beginPath();g.arc(x,y,rr2,-PI/2,PI/2,true);
    g.arc(x+d,y,R2,Math.atan2(rr2,-d),Math.atan2(-rr2,-d),false);g.fill()}
  else if(k===2){g.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,rad=i%2?r*.42:r;g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}g.closePath();g.fill()}
  else if(k===3){for(const dy of[-r*.32,r*.28]){g.beginPath();for(let i=0;i<=16;i++)g.lineTo(x-r+i*r/8,y+dy+Math.sin(i/16*PI*3)*r*.2);g.stroke()}}
  else if(k===4){g.beginPath();g.arc(x,y-r*.12,r*.6,0,PI*2);g.fill();g.fillRect(x-r*.34,y+r*.25,r*.68,r*.4);
    C(x-r*.24,y-r*.12,r*.17,forat);C(x+r*.24,y-r*.12,r*.17,forat);
    for(let i=-1;i<=1;i++)R(x+i*r*.18-.5,y+r*.38,1,r*.25,forat)}
  else if(k===5){Ln('#3a7a3a',1.6,x,y+r*.2,x,y+r);fulla(x,y+r*.65,r*.55,-.5,'#3a7a3a');fulla(x,y+r*.75,r*.5,PI+.5,'#3a7a3a');
    for(let i=0;i<6;i++){const a=i*PI/3;C(x+Math.cos(a)*r*.28,y-r*.1+Math.sin(a)*r*.28,r*.26,'#c03030')}C(x,y-r*.1,r*.2,'#8a1a1a')}
}
// un pes de ferro de cansaladeria, amb els punts que pesa
function pes(x,y,r,p){E(x,y+r*.65,r,r*.3,'rgba(0,0,0,.3)');P('#3a3a40',x-r,y+r*.6,x+r,y+r*.6,x+r*.72,y-r*.5,x-r*.72,y-r*.5);
  C(x,y-r*.62,r*.26,'#3a3a40');R(x-r*.6,y-r*.45,r*1.2,r*.15,'rgba(255,255,255,.15)');
  const D={1:[[0,0]],2:[[-1,0],[1,0]],3:[[-1,0],[0,0],[1,0]],4:[[-1,-1],[1,-1],[-1,1],[1,1]],5:[[-1,-1],[1,-1],[0,0],[-1,1],[1,1]]};
  for(const[a,b]of D[p])C(x+a*r*.42,y+.1*r+b*r*.27,Math.max(1.5,r*.12),'#e8dcc0')}
function armadura(x,y){
  RR(x-16,y-6,32,8,2,'#5a5048');
  for(const d of[-1,1]){RR(x+d*6-4,y-42,8,36,3,'#9aa0a8');R(x+d*6-5,y-10,10,5,'#7a8088')}
  RR(x-14,y-82,28,42,6,'#a8b0b8');Ln('#7a8088',1.5,x,y-80,x,y-44);E(x,y-70,10,6,'rgba(255,255,255,.18)');
  for(const d of[-1,1]){C(x+d*16,y-76,6,'#9aa0a8');RR(x+d*17-4,y-74,8,30,3,'#9aa0a8')}
  RR(x-10,y-104,20,24,8,'#a8b0b8');R(x-8,y-94,16,3,'#2a2a2a');P('#c03030',x-2,y-104,x+2,y-104,x+6,y-116,x-6,y-116);
  RR(x+14,y-46,10,8,3,'#8a9098');
}
// el tresor: un cofre ple de monedes i el calze d'or
function tresor(x,y,t){
  E(x,y,70,40,'rgba(255,210,90,.15)');
  RR(x-34,y-24,68,30,3,'#6b4422');R(x-34,y-14,68,3,'#3a2a18');P('#7a5028',x-34,y-24,x-30,y-46,x+30,y-46,x+34,y-24);
  for(let i=0;i<14;i++)C(x-26+rr(i)*52,y-26-rr(i+7)*6,4,i%2?'#f0c040':'#d8a020');
  g.fillStyle=lg(x-10,0,x+10,0,0,'#c89020',.5,'#ffe890',1,'#b07a10');
  g.beginPath();g.moveTo(x-12,y-66);g.quadraticCurveTo(x-12,y-48,x-2,y-46);g.lineTo(x-2,y-34);g.lineTo(x-9,y-30);g.lineTo(x+9,y-30);g.lineTo(x+2,y-34);g.lineTo(x+2,y-46);g.quadraticCurveTo(x+12,y-48,x+12,y-66);g.closePath();g.fill();
  C(x,y-56,2.5,'#c03030');const s=2+Math.sin(t*4)*1.5;Ln('rgba(255,255,255,.9)',1.2,x+8-s,y-62,x+8+s,y-62);Ln('rgba(255,255,255,.9)',1.2,x+8,y-62-s,x+8,y-62+s);
}
// els numeros romans
function valRoma(s){const V={I:1,V:5,X:10};let n=0;for(let i=0;i<s.length;i++){const a=V[s[i]],b=V[s[i+1]]||0;n+=a<b?-a:a}return n}
function romana(n){let t='';for(const[v,l]of[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=v){t+=l;n-=v}return t}
// els animals pintats: 0 serp, 1 ocell, 2 peix
function animal(k,x,y,s,c){
  g.strokeStyle=c;g.fillStyle=c;g.lineWidth=Math.max(2,s/9);g.lineCap='round';g.lineJoin='round';
  if(k===0){g.beginPath();for(let i=0;i<=20;i++){const u=i/20;g.lineTo(x-s/2+u*s,y+Math.sin(u*PI*2.4)*s*.18)}g.stroke();C(x+s/2+2,y+Math.sin(PI*2.4)*s*.18,s*.1,c)}
  else if(k===1){E(x,y,s*.28,s*.16,c);C(x+s*.28,y-s*.12,s*.12,c);P(c,x+s*.38,y-s*.14,x+s*.52,y-s*.08,x+s*.38,y-s*.06);
    Ln(c,g.lineWidth,x-s*.05,y-s*.05,x-s*.25,y-s*.42,x+s*.12,y-s*.12);P(c,x-s*.25,y,x-s*.5,y-s*.12,x-s*.48,y+s*.1)}
  else{E(x,y,s*.34,s*.17,c);P(c,x-s*.3,y,x-s*.52,y-s*.17,x-s*.52,y+s*.17);C(x+s*.18,y-s*.04,s*.04,'rgba(0,0,0,.5)')}
}
function puntets(n,x,y,c,r=2.6,sp=8){for(let i=0;i<n;i++)C(x-(n-1)*sp/2+i*sp,y,r,c)}
// un numero a la manera antiga: punts a sobre, ratlles a sota
function nombre(n,x,y,u,c){
  const b=Math.floor(n/5),d=n%5;let yy=y-(b*u*.9+(d?u:0))/2;
  if(d){puntets(d,x,yy+u*.35,c,u*.32,u*.9);yy+=u}
  for(let i=0;i<b;i++){RR(x-u*1.8,yy,u*3.6,u*.6,u*.2,c);yy+=u*.9}
}
function flama(x,y,s,t){const f=Math.sin(t*12+x)*.15+Math.sin(t*7.3+y)*.1;
  E(x,y-s*.3,s*1.6,s*1.6,'rgba(255,170,60,.12)');
  P('#ff8a20',x-s*.45,y,x+f*s,y-s*1.5,x+s*.45,y);P('#ffd060',x-s*.22,y,x+f*s*.6,y-s*.9,x+s*.22,y)}
function torxa(x,y,t){R(x-2,y,4,22,'#4a3420');R(x-4,y-3,8,5,'#2a1e14');flama(x,y-3,8,t)}

// ===== ELS OBJECTES DE LA MOTXILLA =====
function icona(id,cx,cy,s){
  g.save();g.translate(cx,cy);g.scale(s/40,s/40);
  if(id==='corda'||id==='cordagarfi'){for(let i=0;i<3;i++){g.strokeStyle=i%2?'#9a7440':'#b88a4c';g.lineWidth=3.2;g.beginPath();g.ellipse(-2,3,14-i*3.5,9-i*2.2,0,0,PI*2);g.stroke()}
    Ln('#b88a4c',3,10,4,16,-8);if(id==='cordagarfi'){Ln('#9aa0a8',3,16,-8,16,-16);for(const a of[-1,0,1])Ln('#9aa0a8',2.4,16,-14,16+a*7,-18+Math.abs(a)*2,16+a*9,-12)}}
  else if(id==='garfi'){Ln('#9aa0a8',3.5,0,14,0,-10);for(const a of[-1,0,1]){g.strokeStyle='#b8bec6';g.lineWidth=3;g.beginPath();g.moveTo(0,-8);g.quadraticCurveTo(a*14,-4,a*12+(a?0:0),-16+(a?0:-4));g.stroke()}C(0,15,3,'#7a8088')}
  else if(id==='diari'){RR(-13,-16,26,32,3,'#6b3e1e');R(-13,-16,5,32,'#4e2c14');R(-6,-16,2,32,'#c9b48a');R(-8,-2,21,4,'#a8742c');RR(-4,-12,14,8,1,'rgba(255,230,180,.2)')}
  else if(id==='llantia'){E(0,6,15,8,'#c8a040');E(0,3,11,4,'#e8c860');P('#c8a040',12,4,22,-2,22,2,13,9);Ln('#a07a28',2.5,-14,5,-20,0,-17,-6);flama(21,-2,5,performance.now()/1000)}
  else if(id==='fruita'){E(0,4,12,14,'#f0c030',.3);E(-4,-1,4,6,'rgba(255,255,220,.45)',.3);Ln('#5a3a18',2,1,-10,3,-15);fulla(3,-14,12,-.5,'#3f8a42')}

function objs(s){const z=zoom&&s.zooms?s.zooms[zoom]:null,o=z?z.obj:s.obj;return typeof o==='function'?o.call(s):o}
function diu(t){if(t===null||t===undefined)return;$('text').innerHTML=t;$('text').scrollTop=0}
function tocaEscena(x,y){
  const s=SALES[Z.sala],z=zoom&&s.zooms?s.zooms[zoom]:null;
  const o=[...objs(s)].reverse().find(o=>(!o.vis||o.vis())&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);
  if(!o){if(sel){sel=null;pintaInv()}return}
  const it=sel;
  let r=(z||s).toca.call(s,o.id,it);
  if(r===undefined)r=it?'Fer servir '+ITEMS[it].nom+' aquí? No, no serveix de res.':null;
  if(it){sel=null;pintaInv()}
  diu(r);desa();pintaHud();
}
function tocaInv(i){
  const id=Z.inv[i];
  if(!id){if(sel){sel=null;pintaInv()}return}
  if(sel===id){sel=null;mira(id)}
  else if(sel){const k=[sel,id].sort().join('+');if(COMBINA[k]){const[nou,t]=COMBINA[k];treu(sel);treu(id);afegeix(nou);diu(t)}else{so.no();diu("Això no s'hi pot ajuntar.")}sel=null}
  else{sel=id;so.toc();diu('Tens '+ITEMS[id].nom+' a la mà. Toca on el vols fer servir, o torna-hi a tocar per mirar-ho.')}
  pintaInv();desa();
}
function mira(id){
  const it=ITEMS[id];
  if(it.llegir){msg('<div class="paper">'+LLEGIR[id]+'</div><small style="color:#9fb890">toca per tancar</small>');potTancar=true;return}
  diu(typeof it.desc==='function'?it.desc():it.desc);
}

function acaba(){
  Z.f.mascara=1;Z.pt[Z.sala]=Math.max(10,100-30*Z.pis[Z.sala]);
  const sales=Z.pt.reduce((a,b)=>a+b,0);Z.bonus=Math.max(0,Math.round(600-Z.temps/6));Z.total=sales+Z.bonus;

  setTimeout(finalPartida,800);
  return "El calze d'or dels templers i un cofre ple de monedes! L'avi tenia raó.";
}
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+ss:m+':'+ss};
let enFinal=false;
async function finalPartida(){
  if(enFinal)return;enFinal=true;
  try{
    if(!Z||!Z.fi){msg('<div style="color:#f0c860">EL TRESOR DELS TEMPLERS</div><small>encara és a mig fer</small>'+Records.peuFinal('o toca per tancar'));potTancar=!!(Z&&Z.comencada);return}
    const pis=Z.pis.reduce((a,b)=>a+b,0),sales=Z.total-Z.bonus;
    msg('<div style="color:#7dff9b">HAS TROBAT EL TRESOR DELS TEMPLERS!</div>'+
      '<div style="font-size:34px;font-weight:bold;color:#f0c860">'+Z.total+'</div>'+
      '<small style="color:#b8d0a8">'+sales+' de les deu proves'+(pis?' ('+pis+(pis===1?' pista':' pistes')+')':', sense cap pista')+'<br>i '+Z.bonus+' pel temps ('+mmss(Z.temps)+')</small>'+
      '<div id="taula" style="margin:8px 0;color:#888;font-size:12px">…</div>'+
      '<a href="#" class="bt" id="f-nova" style="color:#1a1200;background:#f0c860">TORNA A COMENÇAR</a>'+Records.peuFinal('o toca per tancar'));
    potTancar=true;enllac('f-nova',comenca);
    let r;
    if(Z.nou){r=await Records.fiPartida(JOC,Z.total);Z.nou=false;desa()}
    else r={html:Records.taulaHTML(await Records.llista(JOC),null,JOC),posicio:0};
    const el=$('taula');if(el)el.innerHTML=r.html+(r.posicio===1?'<div style="color:#ff0;font-size:13px">ETS EL NÚMERO 1!</div>':r.posicio?'<div style="color:#ff0;font-size:13px">Ets el número '+r.posicio+'!</div>':'');
    Records.pintaMillor(JOC,$('best'));
  }finally{enFinal=false}
}

// ===== MENÚ =====
let potTancar=false;
function msg(t){potTancar=false;const m=$('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){$('msg').style.display='none'}
function enllac(id,fn){const a=document.getElementById(id);if(a)a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();aInit();fn()})}
function menu(){
  desa();
  const mig=Z&&Z.comencada&&!Z.fi;
  msg('<div style="color:#f0c860;letter-spacing:.12em">EL TRESOR DELS TEMPLERS</div>'+
    '<small style="color:#d8d0b0">L\'any 1308, quan el rei els va fer fora del castell de Miravet, els templers hi van amagar el seu tresor. L\'avi Ramon, excursionista, el va buscar tota la vida, i el seu diari diu que el camí comença a Montserrat.</small>'+
    '<small style="color:#9fb890">Són deu proves per Catalunya, i a cada una hi ha alguna cosa per descobrir. Toca-ho tot per mirar-ho i agafar-ho, i fes servir el que portes a la motxilla.</small>'+
    (mig?'<a href="#" class="bt" id="m-cont" style="color:#1a1200;background:#f0c860">CONTINUA ▸</a><small style="color:#b8d0a8;margin-top:2px">prova '+(Z.sala+1)+' de 10 · '+SALES[Z.sala].nom.toLowerCase()+'</small>'+
         '<a href="#" id="m-nova" style="display:block;margin-top:14px;font:12px monospace;color:#7a9070">començar de nou des de Montserrat</a>'
       :'<a href="#" class="bt" id="m-nova" style="color:#1a1200;background:#f0c860">'+(Z&&Z.fi?'TORNA A COMENÇAR':'COMENÇA A MONTSERRAT')+' ▸</a>')+
    '<small style="color:#6a8060;margin-top:12px">Cada pista treu 30 punts de la prova on ets.</small>');
  enllac('m-cont',continua);
  enllac('m-nova',()=>{if(mig)segur();else comenca()});
}
function segur(){
  msg('<div style="color:#ffb070">SEGUR?</div><small style="color:#d8d0b0">Perdries la partida que portes, a la prova '+(Z.sala+1)+'.</small>'+
    '<a href="#" class="bt" id="s-no" style="color:#1a1200;background:#f0c860">NO, TORNA ENRERE</a>'+
    '<a href="#" id="s-si" style="display:block;margin-top:14px;font:12px monospace;color:#c08060">sí, comença de nou</a>');
  enllac('s-no',menu);enllac('s-si',comenca);
}
function comenca(){Z=nova();Z.comencada=true;anim={};desa();hideMsg();entra()}
function continua(){hideMsg();entra()}
function nova(){const f={};SALES.forEach(s=>Object.assign(f,JSON.parse(JSON.stringify(s.ini||{}))));
  return {v:1,sala:0,inv:[],peces:0,f,pis:Array(SALES.length).fill(0),pt:Array(SALES.length).fill(0),temps:0,fi:false,total:0,bonus:0,comencada:false}}
function entra(){
  sel=null;zoom=null;focus={x:150,y:140};camp=[];cancoT=-1;crac=null;ang=0;fadeT=performance.now();
  diu(SALES[Z.sala].entra);pintaHud();pintaInv();
}
function desa(){if(Z&&Z.comencada)try{localStorage.setItem(CLAU,JSON.stringify(Z))}catch(e){}}
function carrega(){try{const d=JSON.parse(localStorage.getItem(CLAU)||'null');if(d&&d.v===1&&d.f&&d.sala>=0&&d.sala<SALES.length)return d}catch(e){}return null}
const jugant=()=>Z&&Z.comencada&&!Z.fi&&!paused&&$('msg').style.display!=='block';

// ===== PANTALLA =====
function pintaHud(){
  if(!Z)return;
  $('nsala').textContent=(Z.sala+1)+'/'+SALES.length;$('sala').textContent=SALES[Z.sala].nom;
  const p=Z.fi?Z.total:Z.pt.reduce((a,b)=>a+b,0);$('score').textContent=p;Records.marcador(JOC,$('best'),p);
}
function pintaInv(){
  const n=6,gp=6,s=IS,w=n*s+(n-1)*gp;
  IV.style.width=w+'px';IV.style.height=s+'px';IV.width=Math.round(w*DPR);IV.height=Math.round(s*DPR);
  g=gi;g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,w,s);
  for(let i=0;i<n;i++){const x=i*(s+gp),id=Z&&Z.inv[i];
    RR(x,0,s,s,7,sel&&sel===id?'#5a4810':'#1f2a1c');g.strokeStyle=sel&&sel===id?'#f0c860':'#3a4a32';g.lineWidth=sel&&sel===id?2.5:1;
    g.beginPath();if(g.roundRect)g.roundRect(x+1,1,s-2,s-2,6);else g.rect(x+1,1,s-2,s-2);g.stroke();
    if(id)icona(id,x+s/2,s/2,s*.82)}
  g=gc;
}
function mesura(){
  const sc=$('screen').getBoundingClientRect();
  K=Math.max(.4,Math.min(sc.width/W,sc.height/H));DPR=Math.min(3,window.devicePixelRatio||1);
  CV.style.width=Math.floor(W*K)+'px';CV.style.height=Math.floor(H*K)+'px';
  CV.width=Math.round(W*K*DPR);CV.height=Math.round(H*K*DPR);
  IS=Math.max(34,Math.min(50,Math.floor((Math.min($('wrap').clientWidth*.94,Math.max(W*K,280))-30)/6)));
  pintaInv();
}
addEventListener('resize',mesura);
try{new ResizeObserver(()=>mesura()).observe($('screen'))}catch(e){}
function dibuixa(now){
  g=gc;g.setTransform(K*DPR,0,0,K*DPR,0,0);
  const s=SALES[Z.sala];
  g.save();s.dibuixa(T);g.restore();
  if(zoom&&s.zooms){g.save();s.zooms[zoom].dibuixa(T);g.restore()}
  if(fadeT){const a=1-(now-fadeT)/700;if(a>0){g.fillStyle='rgba(0,0,0,'+a+')';g.fillRect(0,0,W,H)}else fadeT=0}
  if(paused){g.fillStyle='rgba(16,22,15,.97)';g.fillRect(0,0,W,H)}
}

// ===== TOCS =====
let dit=false;
function lloc(ev){const r=CV.getBoundingClientRect();return {x:(ev.clientX-r.left)/K,y:(ev.clientY-r.top)/K}}
CV.addEventListener('pointerdown',ev=>{
  ev.preventDefault();aInit();
  if(paused){posaPausa(false);return}
  if(!jugant())return;
  const p=lloc(ev);dit=true;try{CV.setPointerCapture(ev.pointerId)}catch(e){}
  if(SALES[Z.sala].fosc&&!zoom)focus=p;
  tocaEscena(p.x,p.y);
});
CV.addEventListener('pointermove',ev=>{if(!dit||!Z||!SALES[Z.sala].fosc)return;ev.preventDefault();focus=lloc(ev)});
CV.addEventListener('pointerup',()=>dit=false);CV.addEventListener('pointercancel',()=>dit=false);
IV.addEventListener('pointerdown',ev=>{
  ev.preventDefault();aInit();
  if(paused){posaPausa(false);return}
  if(!jugant())return;
  const r=IV.getBoundingClientRect(),i=Math.floor((ev.clientX-r.left)/(IS+6));if(i>=0&&i<6)tocaInv(i);
});
$('pista').addEventListener('pointerdown',ev=>{
  ev.preventDefault();aInit();
  if(paused){posaPausa(false);return}
  if(!jugant())return;
  const s=SALES[Z.sala];if(Z.pis[Z.sala]<3){Z.pis[Z.sala]++;so.pista()}
  const n=Z.pis[Z.sala];diu('💡 <b>Pista '+n+' de 3</b>: '+s.pistes[n-1]);desa();pintaHud();
});
$('menu').addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();menu()});
$('msg').addEventListener('click',e=>{if(!e.target.closest('a')&&potTancar)hideMsg()});
$('pausa').addEventListener('pointerdown',ev=>{ev.preventDefault();posaPausa(false)});

// ===== RELLOTGE =====
let last=performance.now(),desT=0;
function loop(now){
  dt=Math.min(.1,(now-last)/1000);last=now;T=now/1000;
  if(jugant()&&!document.hidden){Z.temps+=dt;desT+=dt;if(desT>3){desT=0;desa()}}
  if(Z)dibuixa(now);
  requestAnimationFrame(loop);
}
function posaPausa(v){paused=v;$('pausa').style.display=v?'flex':'none';if(paused)desa()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){desa();if(jugant())posaPausa(true)}});
addEventListener('pagehide',desa);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;aInit();if(e.code==='KeyP'||e.key==='Escape')posaPausa(!paused)});

Z=carrega()||nova();
mesura();pintaHud();Records.pintaMillor(JOC,$('best'));
if(Z.comencada&&!Z.fi)diu(SALES[Z.sala].entra);
menu();
requestAnimationFrame(loop);

// En entrar, la taula de rècords uns segons, com les màquines de debò.
Records.pantallaInicial(JOC,()=>paused=true,()=>paused=false);
</script>
