<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jocs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1a1f2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jocs">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  /* alineat a dalt: si la llista no hi cap, sobreix cap avall i es pot
     fer scroll. Amb justify-content:center la meitat quedava per sobre
     de la pantalla i no s'hi podia arribar. */
  body {
    background: #000;
    color: #fff;
    font-family: monospace;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0.6rem;
    padding: calc(1rem + env(safe-area-inset-top)) 0 calc(1.2rem + env(safe-area-inset-bottom));
  }
  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.2em;
    text-shadow: 0 0 12px #fff;
    margin-bottom: 0;
    white-space: nowrap;
  }
  /* la signatura, discreta i al costat del titol */
  h1 .by {
    font-size: 0.5em;
    letter-spacing: 0.14em;
    color: #8a8a8a;
    text-shadow: none;
    vertical-align: 0.22em;
  }
  .games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.6rem;
    width: 100%;
    max-width: 430px;
    padding: 0 0.8rem;
  }
  /* com més ample, més columnes */
  @media (min-width: 560px) { .games { grid-template-columns: repeat(3, 1fr); max-width: 760px; } }
  @media (min-width: 900px) { .games { grid-template-columns: repeat(4, 1fr); max-width: 1020px; } }
  a.btn {
    display: block;
    text-decoration: none;
    text-align: center;
    padding: 0.3rem;
    border: 2px solid #3a3a3a;
    border-radius: 10px;
    background: #0a0a0a;
    color: #fff;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  a.btn:hover, a.btn:active {
    border-color: #fff;
    box-shadow: 0 0 14px #ffffff55;
    transform: translateY(-2px);
  }
  /* la captura del joc: pixels nets, sense suavitzat */
  a.btn img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  a.btn span {
    display: block;
    margin-top: 0.32rem;
    font: bold 0.78rem monospace;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* qui mana ara mateix a cada joc */
  a.btn em {
    display: block;
    height: 0.95rem;
    font: normal 0.68rem monospace;
    font-style: normal;
    letter-spacing: 0.06em;
    color: #ffd000;
    white-space: nowrap;
    overflow: hidden;
  }
</style>
</head>
<body>
  <h1>★ JOCS ★ <span class="by">by CRE</span></h1>
  <div class="games">
    <a class="btn" href="tetris.html"><img src="thumbs/tetris.png" alt="TETRIS" width="240" height="240"><span>TETRIS</span><em data-joc="tetris"></em></a>
    <a class="btn" href="comecocos.html"><img src="thumbs/comecocos.png" alt="COMECOCOS" width="240" height="240"><span>COMECOCOS</span><em data-joc="comecocos"></em></a>
    <a class="btn" href="space_invaders.html"><img src="thumbs/space_invaders.png" alt="SPACE INVADERS" width="240" height="240"><span>SPACE INVADERS</span><em data-joc="space_invaders"></em></a>
    <a class="btn" href="asteroid_belt_joc.html"><img src="thumbs/asteroids.png" alt="ASTEROID BELT" width="240" height="240"><span>ASTEROID BELT</span><em data-joc="asteroids"></em></a>
    <a class="btn" href="breakout.html"><img src="thumbs/breakout.png" alt="BREAKOUT" width="240" height="240"><span>BREAKOUT</span><em data-joc="breakout"></em></a>
    <a class="btn" href="missile_command.html"><img src="thumbs/missile_command.png" alt="MISSILE COMMAND" width="240" height="240"><span>MISSILE COMMAND</span><em data-joc="missile_command"></em></a>
    <a class="btn" href="galaxian.html"><img src="thumbs/galaxian.png" alt="GALAXIAN" width="240" height="240"><span>GALAXIAN</span><em data-joc="galaxian"></em></a>
    <a class="btn" href="frogger.html"><img src="thumbs/frogger.png" alt="FROGGER" width="240" height="240"><span>FROGGER</span><em data-joc="frogger"></em></a>
    <a class="btn" href="battlezone.html"><img src="thumbs/battlezone.png" alt="BATTLEZONE" width="240" height="240"><span>BATTLEZONE</span><em data-joc="battlezone"></em></a>
    <a class="btn" href="centipede.html"><img src="thumbs/centipede.png" alt="CENTIPEDE" width="240" height="240"><span>CENTIPEDE</span><em data-joc="centipede"></em></a>
    <a class="btn" href="pong.html"><img src="thumbs/pong.png" alt="PONG" width="240" height="240"><span>PONG</span><em data-joc="pong"></em></a>
    <a class="btn" href="donkey_kong.html"><img src="thumbs/donkey_kong.png" alt="DONKEY KONG" width="240" height="240"><span>DONKEY KONG</span><em data-joc="donkey_kong"></em></a>
    <a class="btn" href="crazy_climber.html"><img src="thumbs/crazy_climber.png" alt="CRAZY CLIMBER" width="240" height="240"><span>CRAZY CLIMBER</span><em data-joc="crazy_climber"></em></a>
    <a class="btn" href="dig_dug.html"><img src="thumbs/dig_dug.png" alt="DIG DUG" width="240" height="240"><span>DIG DUG</span><em data-joc="dig_dug"></em></a>
  </div>
<script src="records.js"></script>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
// qui mana a cada joc, en una sola consulta
Records.tots().then(taules => {
  if (!taules) return;                       // sense connexio: les fitxes es queden netes
  document.querySelectorAll('a.btn em[data-joc]').forEach(el => {
    const lider = (taules[el.dataset.joc] || [])[0];
    if (lider) el.textContent = lider.n + '  ' + lider.p;
  });
});
</script>
</body>
</html>
