<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Donkey Kong Classic</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:monospace;overflow:hidden}
body{display:flex;align-items:flex-start;justify-content:center}
#wrap{width:min(100vw,700px);height:100%;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud{flex:none;width:96%;display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px;font-size:12px;gap:4px}
#screen{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:96%;max-height:100%;width:auto;height:auto;border:1px solid #333;background:#000;touch-action:none}
#controls{flex:none;display:flex;gap:6px;margin-top:8px}
button{font:17px monospace;background:#111;color:#fff;border:1px solid #777;border-radius:8px;width:54px;height:44px;touch-action:none;user-select:none;-webkit-user-select:none}
#salta{width:70px;color:#ff0}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:20px;line-height:1.7;display:none;background:rgba(0,0,0,.88);border:1px solid #555;border-radius:10px;padding:16px 24px;max-width:80%}
#msg small{display:block;margin-top:8px;font-size:13px}
small{flex:none;max-width:94%;font-size:11px;color:#aaa;text-align:center;padding:4px 0 6px}
#back{background:transparent;border:1px solid #555;color:#aaa;font-size:12px;padding:4px 8px;border-radius:6px;font-family:monospace;cursor:pointer;white-space:nowrap;flex-shrink:0;width:auto;height:auto}
</style>

<body>
<div id="wrap">
  <div id="hud"><button id="back" onclick="location.href='index.html'">← Tornar</button><span>PUNTS <b id="score">0</b></span><span>BONUS <b id="bonus">5000</b></span><span>VIDES <b id="lives">3</b></span><span style="color:#ff0"><b id="best">—</b></span></div>
  <div id="screen"><canvas id="game" width="448" height="512"></canvas></div>
  <div id="controls">
    <button id="left">◀</button><button id="up">▲</button><button id="down">▼</button><button id="right">▶</button><button id="salta">SALT</button>
  </div>
  <div id="msg"></div>
  <small>fletxes · ESPAI per saltar · pausa: P</small>
</div>
<script src="records.js"></script>
<script>

// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(f,d,type='square',vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.005);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(MG);o.start(n);o.stop(n+d+.02);
}
function noise(d=.15,vol=.25){
  if(!AC)return;
  const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),dd=b.getChannelData(0);
  for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(),g=AC.createGain(),now=AC.currentTime;
  s.buffer=b;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  s.connect(g);g.connect(MG);s.start();s.stop(now+d);
}
function sndSalt(){aInit();tone(320,.13,'square',.2,420)}
function sndBota(){aInit();noise(.05,.12)}
function sndPunts(){aInit();[880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.06,'square',.22),i*55))}
function sndMartell(){aInit();tone(180,.06,'square',.2,-60)}
function sndTrenca(){aInit();noise(.12,.3);tone(500,.1,'square',.2,-380)}
function sndMor(){aInit();[500,420,340,260,180].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.24,-40),i*110))}
function sndNivell(){aInit();[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.11,'square',.24),i*95))}
function sndFi(){aInit();[300,240,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.3,'square',.26,-50),i*260))}

const c=document.getElementById('game'),x=c.getContext('2d');
const W=448,H=512;

// ===== EL DECORAT =====
// bigues: cada una va d'un extrem a l'altre amb una mica de pendent,
// i les botes rodolen sempre cap avall
const BIGUES=[
  {x1:0,   y1:478, x2:448, y2:478},
  {x1:448, y1:432, x2:40,  y2:416},
  {x1:8,   y1:368, x2:416, y2:352},
  {x1:440, y1:304, x2:32,  y2:288},
  {x1:8,   y1:240, x2:416, y2:224},
  {x1:440, y1:176, x2:60,  y2:160},
  {x1:56,  y1:118, x2:300, y2:118},
];
// escales: de la biga g a la g+1. Les trencades no es poden pujar del tot.
const ESCALES=[
  {x:400, g:0}, {x:96, g:0},
  {x:80,  g:1}, {x:330, g:1, trencada:true},
  {x:376, g:2}, {x:150, g:2},
  {x:64,  g:3}, {x:290, g:3, trencada:true},
  {x:384, g:4}, {x:120, g:4},
  {x:96,  g:5}, {x:250, g:5},
];
const bigaY=(g,px)=>{
  const b=BIGUES[g], t=(px-b.x1)/(b.x2-b.x1);
  return b.y1+(b.y2-b.y1)*Math.max(0,Math.min(1,t));
};
const bigaMin=g=>Math.min(BIGUES[g].x1,BIGUES[g].x2);
const bigaMax=g=>Math.max(BIGUES[g].x1,BIGUES[g].x2);
const dinsBiga=(g,px)=>px>=bigaMin(g)-2&&px<=bigaMax(g)+2;
// cap on cau la biga: les botes hi rodolen
const pendent=g=>BIGUES[g].y2>BIGUES[g].y1?1:-1;

let score=0,lives=3,nivell=1,bonus=5000,state='play',paused=false,fase=1;
let mario,botes,focs,martells,dk,pauline,reblons,bonusT,dkT,animT;
const keys={left:false,right:false,up:false,down:false,salt:false};

const JOC='donkey_kong';
Records.pintaMillor(JOC,document.getElementById('best'));
let bestScore=Records.local(JOC);
function saveBest(){
  if(score>bestScore){bestScore=score;Records.desaLocal(JOC,score)}
  Records.marcador(JOC,document.getElementById('best'),score);
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('bonus').textContent=Math.max(0,Math.floor(bonus/100)*100);
  document.getElementById('lives').textContent=lives;
  saveBest();
}
function addScore(n){score+=n;updateHUD()}
function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}

function novaFase(){
  botes=[];focs=[];martells=[];
  bonus=5000;bonusT=0;dkT=1400;animT=0;
  if(fase===1){
    mario={x:40,y:478,g:0,vy:0,dir:1,estat:'terra',martell:0,anim:0};
    martells=[{x:180,y:bigaY(2,180)-24,agafat:false},{x:340,y:bigaY(4,340)-24,agafat:false}];
    focs=[{x:70,y:478,g:0,dir:1,esc:null}];
    dk={x:90,y:78};pauline={x:230,y:74};
    reblons=null;
  }else{
    // la fase dels reblons: treu-los tots i el Donkey Kong cau
    mario={x:224,y:478,g:0,vy:0,dir:1,estat:'terra',martell:0,anim:0};
    reblons=[];
    for(let g=0;g<4;g++)for(let k=0;k<2;k++)
      reblons.push({g:g*2,x:70+k*300,tret:false});
    focs=[{x:120,y:478,g:0,dir:1,esc:null},{x:330,y:478,g:0,dir:-1,esc:null}];
    dk={x:150,y:78};pauline={x:250,y:74};
  }
  state='play';updateHUD();
}
function start(){
  score=0;lives=3;nivell=1;fase=1;paused=false;
  novaFase();hideMsg();
}

// ===== MARIO =====
function bigaSota(px,py){
  for(let g=BIGUES.length-1;g>=0;g--){
    if(!dinsBiga(g,px))continue;
    const y=bigaY(g,px);
    if(py<=y+4&&py>=y-14)return g;
  }
  return -1;
}
function escalaA(px,py,g){
  return ESCALES.find(e=>e.g===g&&Math.abs(e.x-px)<10);
}
function mou(dt){
  const m=mario;
  if(m.estat==='escala'){
    const e=m.esc, dalt=bigaY(e.g+1,e.x), baix=bigaY(e.g,e.x);
    if(keys.up)m.y-=0.10*dt;
    if(keys.down)m.y+=0.10*dt;
    m.x=e.x;
    if(e.trencada&&m.y<baix-38){m.y=baix-38}     // les trencades no arriben a dalt
    if(m.y<=dalt){m.y=dalt;m.g=e.g+1;m.estat='terra';m.esc=null}
    if(m.y>=baix){m.y=baix;m.g=e.g;m.estat='terra';m.esc=null}
    if(keys.up||keys.down)m.anim+=dt;
    return;
  }
  if(m.estat==='terra'){
    if(keys.left){m.x-=0.115*dt;m.dir=-1;m.anim+=dt}
    if(keys.right){m.x+=0.115*dt;m.dir=1;m.anim+=dt}
    m.x=Math.max(8,Math.min(W-8,m.x));
    // pujar o baixar per una escala
    const e=escalaA(m.x,m.y,m.g);
    if(e&&keys.up&&!(e.trencada&&false)){m.estat='escala';m.esc=e;m.x=e.x;return}
    const eb=ESCALES.find(s=>s.g===m.g-1&&Math.abs(s.x-m.x)<10);
    if(eb&&keys.down){m.estat='escala';m.esc=eb;m.x=eb.x;m.y=bigaY(eb.g+1,eb.x)+1;return}
    if(dinsBiga(m.g,m.x))m.y=bigaY(m.g,m.x); else {m.estat='salt';m.vy=0}
    if(keys.salt){m.estat='salt';m.vy=-0.30;sndSalt();m.saltat=[]}
  }
  if(m.estat==='salt'){
    if(keys.left){m.x-=0.10*dt;m.dir=-1}
    if(keys.right){m.x+=0.10*dt;m.dir=1}
    m.x=Math.max(8,Math.min(W-8,m.x));
    m.vy+=0.0011*dt;
    m.y+=m.vy*dt;
    const g=bigaSota(m.x,m.y);
    if(m.vy>0&&g>=0){m.y=bigaY(g,m.x);m.g=g;m.estat='terra';m.vy=0}
    if(m.y>H+30){morir();return}
  }
  if(m.martell>0){m.martell-=dt;if(m.martell<=0)m.martell=0}
}

// ===== BOTES =====
function tiraBota(){
  const g=6;
  botes.push({x:dk.x+30,y:BIGUES[5].y1-10,g:5,dir:pendent(5),estat:'cau',vy:0,foc:Math.random()<0.12});
}
function mouBota(b,dt){
  const v=(0.075+nivell*0.006);
  if(b.estat==='roda'){
    b.x+=b.dir*v*dt;
    if(!dinsBiga(b.g,b.x)){b.estat='cau';b.vy=0;return}
    b.y=bigaY(b.g,b.x)-6;
    // de tant en tant baixa per una escala
    const e=ESCALES.find(s=>s.g===b.g-1&&Math.abs(s.x-b.x)<4);
    if(e&&!e.trencada&&Math.random()<0.02){b.estat='escala';b.esc=e}
  }else if(b.estat==='escala'){
    b.y+=0.09*dt;
    b.x=b.esc.x;
    if(b.y>=bigaY(b.esc.g,b.esc.x)-6){b.g=b.esc.g;b.y=bigaY(b.g,b.x)-6;b.dir=pendent(b.g);b.estat='roda'}
  }else{
    b.vy+=0.0012*dt;b.y+=b.vy*dt;
    for(let g=0;g<BIGUES.length;g++){
      if(!dinsBiga(g,b.x))continue;
      const y=bigaY(g,b.x)-6;
      if(b.y>=y&&b.y<=y+12&&g<b.g||(b.g===undefined)){}
      if(b.y>=y&&b.y<y+14&&y<bigaY(b.g,b.x)+40&&g!==b.g){b.g=g;b.y=y;b.dir=pendent(g);b.estat='roda';break}
    }
    if(b.y>H+20)b.mort=true;
  }
}

// ===== FOCS =====
function mouFoc(f,dt){
  const v=0.045+nivell*0.004;
  if(f.esc){
    f.y+=f.puja?-v*dt:v*dt;
    f.x=f.esc.x;
    const dalt=bigaY(f.esc.g+1,f.esc.x),baix=bigaY(f.esc.g,f.esc.x);
    if(f.puja&&f.y<=dalt){f.y=dalt;f.g=f.esc.g+1;f.esc=null}
    if(!f.puja&&f.y>=baix){f.y=baix;f.g=f.esc.g;f.esc=null}
    return;
  }
  f.x+=f.dir*v*dt;
  if(!dinsBiga(f.g,f.x)){f.dir*=-1;f.x+=f.dir*4}
  f.y=bigaY(f.g,f.x);
  // segueix en Mario per les escales
  const e=ESCALES.find(s=>Math.abs(s.x-f.x)<5&&(s.g===f.g||s.g===f.g-1)&&!s.trencada);
  if(e&&Math.random()<0.012){
    f.esc=e;f.puja=e.g===f.g&&mario.g>f.g;
    if(e.g===f.g-1&&mario.g<f.g){f.esc=e;f.puja=false}
    else if(e.g!==f.g||mario.g<=f.g)f.esc=null;
  }
  if(Math.random()<0.004)f.dir=mario.x>f.x?1:-1;
}

function xoca(ax,ay,bx,by,r){return Math.abs(ax-bx)<r&&Math.abs(ay-by)<r}
function morir(){
  if(state!=='play')return;
  state='mor';sndMor();
  setTimeout(()=>{
    lives--;updateHUD();
    if(lives<=0){state='over';sndFi();finalPartida("GAME OVER")}
    else{novaFase()}
  },1400);
}
async function finalPartida(titol){
  msg(titol);
  const r=await Records.fiPartida(JOC,score);
  msg(titol+(r.posicio?'<br><small style="color:#ff0">Ets el número '+r.posicio+'!</small>':'')+
      '<div style="margin:10px 0">'+r.html+'</div>'+
      Records.peuFinal('o prem ENTER per tornar a jugar'));
  Records.pintaMillor(JOC,document.getElementById('best'),score);
}
function passaFase(){
  state='fi';sndNivell();
  addScore(Math.max(0,Math.floor(bonus/100)*100));
  msg(fase===1?'HAS ARRIBAT A DALT!':'EL DONKEY KONG HA CAIGUT!');
  setTimeout(()=>{
    hideMsg();
    if(fase===1)fase=2; else {fase=1;nivell++}
    novaFase();
  },1800);
}

function update(dt){
  if(state==='over'||paused)return;
  animT+=dt;
  if(state!=='play')return;

  bonusT+=dt;
  if(bonusT>800){bonusT=0;bonus-=100;updateHUD();if(bonus<=0){morir();return}}

  mou(dt);
  const m=mario;

  // el martell
  for(const h of martells){
    if(!h.agafat&&xoca(m.x,m.y-10,h.x,h.y+10,16)){h.agafat=true;m.martell=8000;sndMartell()}
  }

  if(fase===1){
    dkT-=dt;
    if(dkT<=0){tiraBota();dkT=Math.max(700,2100-nivell*160)*(0.6+Math.random()*0.8)}
    for(const b of botes)mouBota(b,dt);
    botes=botes.filter(b=>!b.mort);
    for(let i=botes.length-1;i>=0;i--){
      const b=botes[i];
      if(m.martell>0&&xoca(m.x+m.dir*12,m.y-8,b.x,b.y,16)){
        botes.splice(i,1);addScore(300);sndTrenca();continue;
      }
      if(xoca(m.x,m.y-8,b.x,b.y,12)){morir();return}
      // saltar-la per damunt puntua
      if(m.estat==='salt'&&!m.saltat.includes(b)&&Math.abs(m.x-b.x)<14&&m.y<b.y-6){
        m.saltat.push(b);addScore(100);sndPunts();
      }
    }
    if(m.g===6||(m.y<130&&m.x>60&&m.x<300)){passaFase();return}
  }else{
    // treure els reblons trepitjant-los
    for(const r of reblons){
      if(r.tret)continue;
      const ry=bigaY(r.g,r.x);
      if(m.g===r.g&&Math.abs(m.x-r.x)<12&&Math.abs(m.y-ry)<10){
        r.tret=true;addScore(100);sndPunts();
      }
    }
    if(reblons.every(r=>r.tret)){passaFase();return}
  }

  for(const f of focs)mouFoc(f,dt);
  for(let i=focs.length-1;i>=0;i--){
    const f=focs[i];
    if(m.martell>0&&xoca(m.x+m.dir*12,m.y-8,f.x,f.y-8,16)){focs.splice(i,1);addScore(500);sndTrenca();continue}
    if(xoca(m.x,m.y-8,f.x,f.y-8,12)){morir();return}
  }
}

// ===== DIBUIX =====
function dibuixaMario(){
  const m=mario,px=Math.round(m.x),py=Math.round(m.y);
  const pas=Math.floor(m.anim/140)%2;
  x.fillStyle='#e02020';x.fillRect(px-7,py-18,14,4);           // gorra
  x.fillStyle='#f0b080';x.fillRect(px-6,py-14,12,5);           // cara
  x.fillStyle='#000';x.fillRect(px+(m.dir>0?2:-4),py-13,2,2);
  x.fillStyle='#3050e0';x.fillRect(px-7,py-9,14,6);            // granota
  x.fillStyle='#e02020';x.fillRect(px-7,py-9,4,3);x.fillRect(px+3,py-9,4,3);
  x.fillStyle='#3050e0';
  if(m.estat==='salt'){x.fillRect(px-8,py-3,5,3);x.fillRect(px+3,py-3,5,3)}
  else if(pas){x.fillRect(px-7,py-3,5,3);x.fillRect(px+2,py-3,5,3)}
  else{x.fillRect(px-3,py-3,6,3)}
  if(m.martell>0){
    const alt=Math.floor(m.anim/120)%2;
    x.fillStyle='#a0a0a0';
    x.fillRect(px+m.dir*10-4,py-(alt?30:14),8,7);
    x.fillStyle='#8a5a2a';x.fillRect(px+m.dir*10-1,py-(alt?24:12),2,8);
  }
}
function dibuixaGorila(){
  const px=dk.x,py=dk.y,b=Math.floor(animT/300)%2;
  x.fillStyle='#8a5a2a';
  x.fillRect(px-2,py-4,44,34);                       // cos
  x.fillRect(px+4,py-20,32,18);                      // cap
  x.fillStyle='#c89a6a';x.fillRect(px+10,py-12,20,9);x.fillRect(px+8,py+8,28,16);
  x.fillStyle='#fff';x.fillRect(px+12,py-17,6,5);x.fillRect(px+22,py-17,6,5);
  x.fillStyle='#000';x.fillRect(px+14,py-16,3,3);x.fillRect(px+24,py-16,3,3);
  x.fillStyle='#8a5a2a';
  x.fillRect(px-10,py+(b?0:6),12,20);x.fillRect(px+38,py+(b?6:0),12,20);   // braços
}
function draw(){
  x.fillStyle='#000';x.fillRect(0,0,W,H);
  // bigues
  x.strokeStyle='#e05a2a';x.lineWidth=7;x.lineCap='butt';
  for(const b of BIGUES){x.beginPath();x.moveTo(b.x1,b.y1+3);x.lineTo(b.x2,b.y2+3);x.stroke()}
  // escales
  for(const e of ESCALES){
    const dalt=bigaY(e.g+1,e.x),baix=bigaY(e.g,e.x);
    x.strokeStyle='#4ad8ff';x.lineWidth=2;
    const fi=e.trencada?baix-38:dalt;
    x.beginPath();x.moveTo(e.x-6,baix);x.lineTo(e.x-6,fi);x.moveTo(e.x+6,baix);x.lineTo(e.x+6,fi);x.stroke();
    for(let y=baix-6;y>fi;y-=9){x.beginPath();x.moveTo(e.x-6,y);x.lineTo(e.x+6,y);x.stroke()}
    if(e.trencada){
      x.beginPath();x.moveTo(e.x-6,dalt);x.lineTo(e.x-6,dalt+14);x.moveTo(e.x+6,dalt);x.lineTo(e.x+6,dalt+14);x.stroke();
    }
  }
  // reblons
  if(reblons)for(const r of reblons){
    if(r.tret)continue;
    x.fillStyle='#ffd000';x.beginPath();x.arc(r.x,bigaY(r.g,r.x)+3,4,0,7);x.fill();
  }
  // martells
  for(const h of martells)if(!h.agafat){
    x.fillStyle='#a0a0a0';x.fillRect(h.x-6,h.y,12,8);
    x.fillStyle='#8a5a2a';x.fillRect(h.x-1,h.y+8,2,10);
  }
  // barril de foc i escala del gorila
  dibuixaGorila();
  // Pauline
  x.fillStyle='#ff5ce0';x.fillRect(pauline.x-6,pauline.y,12,16);
  x.fillStyle='#f0d000';x.fillRect(pauline.x-6,pauline.y-8,12,8);
  x.fillStyle='#fff';x.font='11px monospace';x.textAlign='center';
  if(Math.floor(animT/500)%2)x.fillText('HELP!',pauline.x+2,pauline.y-14);
  // botes
  for(const b of botes){
    x.fillStyle=b.foc?'#ff8020':'#c88a3a';
    x.beginPath();x.ellipse(b.x,b.y,9,7,b.estat==='escala'?1.57:0,0,7);x.fill();
    x.strokeStyle='#6a3a10';x.lineWidth=1.5;
    x.beginPath();x.ellipse(b.x,b.y,9,7,b.estat==='escala'?1.57:0,0,7);x.stroke();
  }
  // focs
  for(const f of focs){
    const t=Math.floor(animT/120)%2;
    x.fillStyle=t?'#ffd000':'#ff6000';
    x.beginPath();x.moveTo(f.x,f.y-18);x.lineTo(f.x+7,f.y-4);x.lineTo(f.x-7,f.y-4);x.closePath();x.fill();
    x.fillStyle='#fff';x.fillRect(f.x-4,f.y-11,3,3);x.fillRect(f.x+1,f.y-11,3,3);
  }
  if(state!=='mor')dibuixaMario();
  else{
    const px=mario.x,py=mario.y;
    x.fillStyle='#e02020';x.save();x.translate(px,py-8);x.rotate(animT/120);
    x.fillRect(-7,-8,14,16);x.restore();
  }
  // alçada, com a la maquina
  x.fillStyle='#4ad8ff';x.font='12px monospace';x.textAlign='left';
  x.fillText(fase===1?'25m':'100m',10,20);
}
let last=performance.now();
function loop(t){const dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ===== CONTROLS =====
function bind(id,k){
  const e=document.getElementById(id);
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();if(state==='over'){start();return}keys[k]=true});
  e.addEventListener('pointerup',ev=>{ev.preventDefault();keys[k]=false});
  e.addEventListener('pointercancel',()=>keys[k]=false);
  e.addEventListener('pointerleave',()=>keys[k]=false);
}
bind('left','left');bind('right','right');bind('up','up');bind('down','down');bind('salta','salt');
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  aInit();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
  if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.code==='Space'){if(state==='over')start();else keys.salt=true}
  if(e.code==='KeyP'&&state!=='over'){paused=!paused;paused?msg("PAUSA"):hideMsg()}
  if(e.code==='Enter'&&state==='over')start();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
  if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;
  if(e.code==='Space')keys.salt=false;
});
document.getElementById('msg').addEventListener('click',()=>{if(state==='over'){aInit();start()}});

start();
</script>
