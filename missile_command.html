<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:monospace;overflow:hidden}

<body>
<div id="wrap">
  <div id="hud"><button id="back" onclick="location.href='index.html'">← Tornar</button><span>SCORE <b id="score">0</b></span><span>ONADA <b id="wave">1</b></span><span style="color:#ff0"><b id="best">—</b></span></div>
  <div id="screen"><canvas id="game" width="480" height="560"></canvas></div>
  <div id="controls">
    <button id="b0">ALPHA<br><b>10</b></button><button id="b1">DELTA<br><b>10</b></button><button id="b2">OMEGA<br><b>10</b></button>
  </div>
  <div id="msg"></div>
  <small>toca el cel per disparar · fletxes + ESPAI · pausa: P</small>
</div>
<script src="records.js"></script>
<script>

// ===== CLASSIC ARCADE SOUND ENGINE =====
let audioCtx=null, master=null;
function audioInit(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    master=audioCtx.createGain(); master.gain.value=.12; master.connect(audioCtx.destination);
  }
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function tone(freq,dur,type="square",vol=.35,slide=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), now=audioCtx.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,now);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+dur);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(vol,now+.005);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g); g.connect(master); o.start(now); o.stop(now+dur+.02);
}
function noise(dur=.12,vol=.25,lp=0){
  if(!audioCtx)return;
  const n=audioCtx.sampleRate*dur, b=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),now=audioCtx.currentTime;
  src.buffer=b; g.gain.setValueAtTime(vol,now); g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  let node=src;
  if(lp){const f=audioCtx.createBiquadFilter();f.type="lowpass";f.frequency.value=lp;src.connect(f);node=f}
  node.connect(g);g.connect(master);src.start();src.stop(now+dur);
}
function sndLaunch(){audioInit();tone(180,.16,"sawtooth",.2,520)}
function sndBoom(){audioInit();noise(.34,.32,1400);tone(70,.28,"square",.16,-40)}
function sndEnemyBoom(){audioInit();noise(.42,.38,700);tone(50,.36,"square",.2,-25)}
function sndCity(){audioInit();noise(.5,.4,500);tone(90,.4,"sawtooth",.24,-70)}
function sndEmpty(){audioInit();tone(120,.07,"square",.16)}
function sndPlane(){audioInit();tone(150,.12,"sawtooth",.1,40)}
function sndWave(){audioInit();[330,440,550,660].forEach((f,i)=>setTimeout(()=>tone(f,.12,"square",.26),i*100))}
function sndBonus(){audioInit();tone(880,.06,"square",.2)}
function sndEnd(){audioInit();[300,240,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.3,"square",.28,-60),i*260))}

const c=document.getElementById('game'),x=c.getContext('2d');
const W=480,H=560,GROUND=505;
const CITY_X=[86,140,194,286,340,394], BASE_X=[32,240,448];
const BASE_NAMES=['ALPHA','DELTA','OMEGA'];
// la paleta canvia a cada onada, com a l'original
const PALETTES=[
  {sky:'#000',ground:'#c8a020',city:'#40b0ff',enemy:'#ff4040'},
  {sky:'#000',ground:'#20b070',city:'#ffe040',enemy:'#ff70d0'},
  {sky:'#000',ground:'#8060ff',city:'#40ffa0',enemy:'#ffa020'},
  {sky:'#000',ground:'#ff6060',city:'#80d0ff',enemy:'#ffffff'},
  {sky:'#000',ground:'#40a0ff',city:'#ff80c0',enemy:'#ffe040'}
];

let score=0,wave=1,state='play',paused=false;
let cities=[],bases=[],enemies=[],allies=[],booms=[],planes=[];
let spawnLeft=0,spawnTimer=0,planeTimer=0,waveTimer=0,bonusStep=0,bonusPts=0;
let savedCities=0,nextBonus=10000,pal=PALETTES[0];
let aim={x:W/2,y:200};
const keys={left:false,right:false,up:false,down:false};

const JOC='missile_command';
Records.migra(JOC,'best_missile');
let bestScore=Records.local(JOC);
Records.pintaMillor(JOC,document.getElementById('best'));   // les inicials de qui mana
function saveBest(){
  if(score>bestScore){bestScore=score;Records.desaLocal(JOC,score)}
  Records.marcador(JOC,document.getElementById('best'),score);
}
// en acabar: envia la puntuacio i ensenya la taula dels 10 millors
async function finalPartida(titol){
  msg(titol);
  const r=await Records.fiPartida(JOC,score);
  msg(titol+(r.posicio?'<br><small style="color:#ff0">Ets el número '+r.posicio+'!</small>':'')+
      '<div style="margin:10px 0">'+r.html+'</div>'+
      '<small>Prem ENTER o toca aquí</small>');
  Records.pintaMillor(JOC,document.getElementById('best'),score);
}
function mult(){return Math.min(6,Math.ceil(wave/2))}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('wave').textContent=wave;
  for(let i=0;i<3;i++){
    const btn=document.getElementById('b'+i);
    btn.querySelector('b').textContent=bases[i]&&bases[i].alive?bases[i].ammo:'—';
    btn.disabled=!(bases[i]&&bases[i].alive&&bases[i].ammo>0);
  }
  saveBest();
}
function msg(t){const m=document.getElementById('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){document.getElementById('msg').style.display='none'}
function addScore(n){
  score+=n;
  if(score>=nextBonus){nextBonus+=10000;savedCities++;sndBonus()}
  updateHUD();
}

function startGame(){
  score=0;wave=1;savedCities=0;nextBonus=10000;paused=false;
  cities=CITY_X.map(cx=>({x:cx,alive:true}));
  startWave();
}
function startWave(){
  pal=PALETTES[(wave-1)%PALETTES.length];
  bases=BASE_X.map(bx=>({x:bx,ammo:10,alive:true}));
  enemies=[];allies=[];booms=[];planes=[];
  spawnLeft=Math.min(12+wave*2,32);
  spawnTimer=600;planeTimer=9000+Math.random()*5000;
  state='play';
  updateHUD();sndWave();
  msg("ONADA "+wave+"<br><small>×"+mult()+" punts</small>");
  waveTimer=1300;
}

// ===== TRETS =====
function fireFrom(i,tx,ty){
  const b=bases[i];
  if(state!=='play'||paused||!b||!b.alive||b.ammo<=0){sndEmpty();return false}
  ty=Math.max(14,Math.min(GROUND-14,ty));
  const sy=GROUND-8, sp=(i===1?0.50:0.34); // la bateria central dispara mes rapid
  const dx=tx-b.x, dy=ty-sy, d=Math.hypot(dx,dy)||1;
  allies.push({x:b.x,y:sy,sx:b.x,sy:sy,vx:dx/d*sp,vy:dy/d*sp,tx:tx,ty:ty});
  b.ammo--;sndLaunch();updateHUD();
  return true;
}
function fireNearest(tx,ty){
  let best=-1,bd=1e9;
  for(let i=0;i<3;i++){
    const b=bases[i];
    if(!b.alive||b.ammo<=0)continue;
    const d=Math.abs(b.x-tx); if(d<bd){bd=d;best=i}
  }
  if(best<0){sndEmpty();return false}
  return fireFrom(best,tx,ty);
}
function boom(bx,by,enemy){
  booms.push({x:bx,y:by,r:2,max:enemy?26:30,grow:true,enemy:enemy});
  enemy?sndEnemyBoom():sndBoom();
}

// ===== ENEMICS =====
function targets(){
  const t=[];
  cities.forEach(ci=>{if(ci.alive)t.push(ci.x)});
  bases.forEach(b=>{if(b.alive)t.push(b.x)});
  return t.length?t:[W/2];
}
function spawnEnemy(sx){
  const t=targets(), tx=t[Math.floor(Math.random()*t.length)];
  const sp=0.028+wave*0.005;
  const startX=sx!==undefined?sx:Math.random()*W;
  const dx=tx-startX, dy=GROUND-0, d=Math.hypot(dx,dy)||1;
  enemies.push({x:startX,y:0,sx:startX,sy:0,vx:dx/d*sp,vy:dy/d*sp,tx:tx,
                mirv:wave>=3&&Math.random()<.3, smart:wave>=6&&Math.random()<.15});
}
function splitMirv(m){
  m.mirv=false;
  const n=2+Math.floor(Math.random()*2), t=targets(), sp=Math.hypot(m.vx,m.vy);
  for(let i=0;i<n;i++){
    const tx=t[Math.floor(Math.random()*t.length)];
    const dx=tx-m.x, dy=GROUND-m.y, d=Math.hypot(dx,dy)||1;
    enemies.push({x:m.x,y:m.y,sx:m.x,sy:m.y,vx:dx/d*sp,vy:dy/d*sp,tx:tx,mirv:false,smart:false});
  }
}
function spawnPlane(){
  const fromLeft=Math.random()<.5, sat=Math.random()<.5;
  planes.push({x:fromLeft?-20:W+20,y:50+Math.random()*90,vx:(fromLeft?1:-1)*(0.05+wave*0.004),
               sat:sat,drop:1800+Math.random()*1200});
  sndPlane();
}

function hitGround(m){
  // esclata on cau de debo: les bombes intel.ligents es desvien del seu objectiu
  boom(m.x,GROUND-4,true);
}
function update(dt){
  if(paused||state==='over')return;
  if(waveTimer>0){waveTimer-=dt;if(waveTimer<=0)hideMsg()}

  // punteria amb teclat
  const ks=0.4*dt;
  if(keys.left)aim.x-=ks; if(keys.right)aim.x+=ks;
  if(keys.up)aim.y-=ks; if(keys.down)aim.y+=ks;
  aim.x=Math.max(4,Math.min(W-4,aim.x)); aim.y=Math.max(10,Math.min(GROUND-14,aim.y));

  if(state==='play'){
    // aparicio d'enemics
    spawnTimer-=dt;
    if(spawnTimer<=0&&spawnLeft>0){
      spawnEnemy();spawnLeft--;
      spawnTimer=Math.max(320,1500-wave*90)*(0.6+Math.random()*0.8);
    }
    // avions i satel.lits
    if(wave>=2){
      planeTimer-=dt;
      if(planeTimer<=0){spawnPlane();planeTimer=10000+Math.random()*8000}
    }
  }

  // missils propis
  for(let i=allies.length-1;i>=0;i--){
    const m=allies[i];
    m.x+=m.vx*dt; m.y+=m.vy*dt;
    if((m.tx-m.x)*m.vx+(m.ty-m.y)*m.vy<=0){boom(m.tx,m.ty,false);allies.splice(i,1)}
  }
  // missils enemics
  for(let i=enemies.length-1;i>=0;i--){
    const m=enemies[i];
    if(m.smart){
      // les bombes intel.ligents esquiven les explosions
      for(const b of booms){
        const dx=m.x-b.x, dy=m.y-b.y, d=Math.hypot(dx,dy);
        if(d<b.r+42&&d>0){m.vx+=(dx/d)*0.0016*dt; m.vy-=Math.abs(m.vy)*0.0004*dt}
      }
      const sp=Math.hypot(m.vx,m.vy)||1, want=0.028+wave*0.004;
      m.vx=m.vx/sp*want; m.vy=Math.max(0.01,m.vy/sp*want);
    }
    m.x+=m.vx*dt; m.y+=m.vy*dt;
    if(m.mirv&&m.y>150+Math.random()*40){splitMirv(m)}
    if(m.y>=GROUND-4){hitGround(m);enemies.splice(i,1);continue}
    if(m.x<-30||m.x>W+30){enemies.splice(i,1)}
  }
  // avions
  for(let i=planes.length-1;i>=0;i--){
    const p=planes[i];
    p.x+=p.vx*dt; p.drop-=dt;
    if(p.drop<=0&&state==='play'){
      const t=targets(), tx=t[Math.floor(Math.random()*t.length)];
      const dx=tx-p.x, dy=GROUND-p.y, d=Math.hypot(dx,dy)||1, sp=0.028+wave*0.004;
      enemies.push({x:p.x,y:p.y,sx:p.x,sy:p.y,vx:dx/d*sp,vy:dy/d*sp,tx:tx,mirv:false,smart:false});
      p.drop=1800+Math.random()*1500;
    }
    if(p.x<-40||p.x>W+40)planes.splice(i,1);
  }
  // explosions
  for(let i=booms.length-1;i>=0;i--){
    const b=booms[i];
    if(b.grow){b.r+=0.055*dt; if(b.r>=b.max)b.grow=false}
    else{b.r-=0.038*dt; if(b.r<=0){booms.splice(i,1);continue}}
    // destrueix missils enemics (reaccio en cadena)
    for(let j=enemies.length-1;j>=0;j--){
      const m=enemies[j];
      if(Math.hypot(m.x-b.x,m.y-b.y)<b.r){
        enemies.splice(j,1);
        addScore((m.smart?125:25)*mult());
        boom(m.x,m.y,false);
      }
    }
    // destrueix avions
    for(let j=planes.length-1;j>=0;j--){
      const p=planes[j];
      if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+6){
        planes.splice(j,1);addScore(100*mult());boom(p.x,p.y,false);
      }
    }
    // les explosions enemigues arrasen ciutats i bateries
    if(b.enemy){
      for(const ci of cities){
        if(ci.alive&&Math.abs(ci.x-b.x)<b.r+8&&b.y>GROUND-40){ci.alive=false;sndCity()}
      }
      for(const ba of bases){
        if(ba.alive&&Math.abs(ba.x-b.x)<b.r+8&&b.y>GROUND-40){ba.alive=false;ba.ammo=0;sndCity();updateHUD()}
      }
    }
  }

  // sense cap ciutat la partida s'acaba: no arriben mes atacants,
  // nomes cauen els missils que ja son a l'aire
  if(state==='play'&&!cities.some(ci=>ci.alive)){spawnLeft=0;planes.length=0}

  // fi d'onada
  if(state==='play'&&spawnLeft===0&&!enemies.length&&!planes.length&&!allies.length&&!booms.length){
    if(!cities.some(ci=>ci.alive)){
      state='over';sndEnd();
      finalPartida("THE END");
    }else{
      state='bonus';bonusStep=0;bonusPts=0;waveTimer=0;
      const ammo=bases.reduce((s,b)=>s+(b.alive?b.ammo:0),0);
      const alive=cities.filter(ci=>ci.alive).length;
      bonusPts=ammo*5*mult()+alive*100*mult();
      let extra='';
      while(savedCities>0&&cities.some(ci=>!ci.alive)){
        cities.find(ci=>!ci.alive).alive=true;savedCities--;extra='<br>+1 CIUTAT EXTRA';
      }
      addScore(bonusPts);
      msg("BONUS<br><small>"+ammo+" míssils × 5 × "+mult()+"<br>"+alive+" ciutats × 100 × "+mult()+"<br><b>"+bonusPts+" punts</b>"+extra+"</small>");
      waveTimer=2600;
    }
  }
  if(state==='bonus'){
    waveTimer-=dt;
    if(waveTimer<=0){hideMsg();wave++;startWave()}
  }
}

// ===== DIBUIX =====
function drawCity(ci){
  const y=GROUND-20;
  x.fillStyle=ci.alive?pal.city:'#4a3a1a';
  if(ci.alive){
    x.fillRect(ci.x-16,y+10,32,10);
    x.fillRect(ci.x-13,y+2,7,18); x.fillRect(ci.x-3,y-6,7,26); x.fillRect(ci.x+7,y+4,7,16);
  }else{
    // runes
    x.fillRect(ci.x-16,y+16,32,4);
    x.fillRect(ci.x-10,y+12,5,4); x.fillRect(ci.x+2,y+13,6,3);
  }
}
function drawBase(b){
  const y=GROUND;
  x.fillStyle=b.alive?pal.city:'#4a3a1a';
  x.beginPath();x.moveTo(b.x-24,y);x.lineTo(b.x-13,y-18);x.lineTo(b.x+13,y-18);x.lineTo(b.x+24,y);x.closePath();x.fill();
  if(b.alive&&b.ammo>0){
    x.fillStyle='#fff';
    const rows=[[0],[ -6,6],[-12,0,12]];
    let n=Math.min(b.ammo,10),k=0;
    for(let r=0;r<3&&k<n;r++){
      for(const off of rows[r]){
        if(k>=n)break;
        x.fillRect(b.x+off-1,y-8-r*5,3,4);k++;
      }
    }
  }
}
function draw(){
  x.fillStyle=pal.sky;x.fillRect(0,0,W,H);
  // terra
  x.fillStyle=pal.ground;x.fillRect(0,GROUND,W,H-GROUND);
  cities.forEach(drawCity);
  bases.forEach(drawBase);
  // rastres enemics
  x.lineWidth=1.4;
  x.strokeStyle=pal.enemy;
  for(const m of enemies){
    x.beginPath();x.moveTo(m.sx,m.sy);x.lineTo(m.x,m.y);x.stroke();
    x.fillStyle=m.smart?'#fff':pal.enemy;
    x.fillRect(m.x-2,m.y-2,4,4);
  }
  // rastres propis
  x.strokeStyle='#7fe0ff';
  for(const m of allies){
    x.beginPath();x.moveTo(m.sx,m.sy);x.lineTo(m.x,m.y);x.stroke();
    x.fillStyle='#fff';x.fillRect(m.x-1.5,m.y-1.5,3,3);
    x.fillRect(m.tx-3,m.ty-1,6,2);x.fillRect(m.tx-1,m.ty-3,2,6);
  }
  // avions i satel.lits
  for(const p of planes){
    x.fillStyle=pal.enemy;
    if(p.sat){
      x.fillRect(p.x-4,p.y-4,8,8);
      x.fillRect(p.x-13,p.y-2,7,4);x.fillRect(p.x+6,p.y-2,7,4);
    }else{
      x.beginPath();x.moveTo(p.x-12*Math.sign(p.vx),p.y);x.lineTo(p.x+8*Math.sign(p.vx),p.y-4);
      x.lineTo(p.x+8*Math.sign(p.vx),p.y+4);x.closePath();x.fill();
      x.fillRect(p.x-4,p.y-8,7,16);
    }
  }
  // explosions parpellejants
  for(const b of booms){
    const cols=['#fff','#ffd000','#ff5000','#ff9000'];
    x.fillStyle=cols[Math.floor(performance.now()/60+b.x)%4];
    x.beginPath();x.arc(b.x,b.y,Math.max(0,b.r),0,6.283);x.fill();
  }
  // punt de mira
  if(state!=='over'){
    x.strokeStyle='#fff';x.lineWidth=1.5;
    x.beginPath();
    x.moveTo(aim.x-9,aim.y);x.lineTo(aim.x-3,aim.y);
    x.moveTo(aim.x+3,aim.y);x.lineTo(aim.x+9,aim.y);
    x.moveTo(aim.x,aim.y-9);x.lineTo(aim.x,aim.y-3);
    x.moveTo(aim.x,aim.y+3);x.lineTo(aim.x,aim.y+9);
    x.stroke();
  }
}

let last=performance.now();
function loop(t){const dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ===== CONTROLS =====
function canvasPoint(ev){
  const r=c.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*W/r.width, y:(ev.clientY-r.top)*H/r.height};
}
c.addEventListener('pointerdown',ev=>{
  ev.preventDefault();audioInit();
  if(state==='over'){startGame();return}
  const p=canvasPoint(ev); aim.x=p.x; aim.y=Math.min(p.y,GROUND-14);
  fireNearest(aim.x,aim.y);
});
c.addEventListener('pointermove',ev=>{
  if(ev.pointerType==='mouse'){const p=canvasPoint(ev);aim.x=p.x;aim.y=Math.min(p.y,GROUND-14)}
});
document.addEventListener('contextmenu',e=>e.preventDefault());
for(let i=0;i<3;i++){
  document.getElementById('b'+i).addEventListener('pointerdown',ev=>{
    ev.preventDefault();audioInit();
    if(state==='over'){startGame();return}
    fireFrom(i,aim.x,aim.y);
  });
}
document.addEventListener('keydown',e=>{
  audioInit();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
  if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.code==='Space'){if(state==='over')startGame();else fireNearest(aim.x,aim.y)}
  if(e.code==='Digit1')fireFrom(0,aim.x,aim.y);
  if(e.code==='Digit2')fireFrom(1,aim.x,aim.y);
  if(e.code==='Digit3')fireFrom(2,aim.x,aim.y);
  if(e.code==='KeyP'&&state!=='over'){paused=!paused;paused?msg("PAUSA"):hideMsg()}
  if(e.code==='Enter'&&state==='over')startGame();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
  if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;
});
document.getElementById('msg').addEventListener('click',()=>{if(state==='over'){audioInit();startGame()}});

startGame();
</script>
</body>
</html>
