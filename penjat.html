<script>

// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){}
}
function tone(f,d,type='sine',vol=.2,slide=0,ret=0){
  if(!AC)return;const t=AC.currentTime+ret,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+d+.02);
}
const so={
  tecla(){aInit();tone(620,.04,'triangle',.06)},
  be(){aInit();tone(784,.1,'triangle',.16);tone(1047,.14,'triangle',.16,0,.08)},
  mal(){aInit();tone(220,.22,'sawtooth',.1,-90)},
  guanya(){aInit();[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.2,0,i*.1))},
  // el riure del bruixot
  riu(){aInit();[392,370,349,330,311,294].forEach((f,i)=>tone(f,.13,'square',.08,-30,i*.14))},
  corda(){aInit();tone(900,.08,'square',.1,-700)},
};

// ===== LES PARAULES =====
// Paraules corrents, de 5 a 10 lletres, cada una amb el seu tema (que surt
// de pista: sense, seria una loteria). S'escriuen ben escrites; per jugar
// van sense accents, la ç és una C i la l·l són dues L (`pla`).
const TEMES=[
  ['UNA FRUITA','préssec cirera maduixa plàtan taronja llimona albercoc mandarina magrana nespra síndria pruna pinya codony'],
  ['UN ANIMAL DE GRANJA','gallina ovella cabra cavall conill gallet pollastre porquet vedell'],
  ['A LA CUINA','paella cullera forquilla ganivet nevera aigüera cassola escorredor tovalló torradora batedora cafetera'],
  ['UN COLOR','vermell negre blanc daurat platejat marró turquesa granat'],
  ['A LA PLATJA','sorra tovallola petxina banyador galleda ombrel·la onada'],
  ['UN OFICI','metge fuster pagès cuiner pintor mestre forner pastor bomber pilot jutge paleta sastre barber infermer carter perruquer advocat cambrer'],
  ['UNA PART DEL COS','genoll colze espatlla esquena panxa cuixa turmell orella cervell costella melic llavi'],
  ['UN ARBRE','roure alzina olivera pollancre castanyer xiprer freixe bedoll avellaner noguera salze'],
  ['UN INSTRUMENT','piano guitarra violí flauta trompeta tambor gralla tenora acordió bateria'],
  ['UNA PART DE LA CASA','finestra teulada paret sostre escala balcó cuina menjador lavabo passadís terrat garatge'],
  ['UN ESPORT','futbol tennis bàsquet handbol natació ciclisme atletisme hoquei'],
  ['A LA FESTA MAJOR','castell enxaneta acotxador gegant capgròs diables sardana cercavila envelat'],
  ['EL TEMPS QUE FA','pluja núvol boira glaçada calamarsa llamp tempesta calor rosada xàfec'],
  ["A L'ESCOLA",'llapis llibre llibreta motxilla pissarra regle tisores estoig deures'],
  ['UNA VERDURA','tomàquet enciam pastanaga patata carbassó albergínia pebrot bròquil espinacs mongeta carxofa'],
  ['UN ANIMAL DEL BOSC','guineu senglar esquirol cérvol teixó eriçó cabirol mussol òliba geneta llebre'],
  ['UNA PECA DE ROBA','camisa pantaló jersei jaqueta faldilla vestit mitjons sabata barret bufanda guants corbata samarreta cinturó espardenya'],
  ['DEL MAR','sardina anxova bacallà tonyina calamar gamba musclo llagosta escamarlà balena tauró'],
  ['UN TRANSPORT','cotxe vaixell bicicleta camió metro tramvia globus helicòpter furgoneta patinet'],
  ['UN JOC','escacs dames parxís dominó cartes botifarra bitlles'],
  ['A LA MUNTANYA','cingle refugi cascada estany carena glacera'],
  ['PER ESMORZAR','mantega melmelada galeta torrada pernil formatge ensaïmada xocolata iogurt'],
  ['UNA EINA','martell serra cargol tornavís alicates raspall pinzell aixada destral'],
  ['UN MOBLE','cadira armari calaix prestatge còmoda tamboret butaca escriptori bressol mirall'],
  ['UN OCELL','pardal oreneta gavina àliga merla garsa colom cigonya oriol perdiu falcia cadernera tórtora estornell'],
  ['UNA CIUTAT DE CASA','girona tarragona manresa figueres tortosa terrassa sabadell blanes calella igualada solsona taradell'],
  ['UN DOLÇ','pastís caramel gelat panellet bunyol magdalena xuixo torró'],
  ['PER NADAL','pessebre caganer estrella camell regal escudella canelons galets neula'],
  ['UN ANIMAL SALVATGE','elefant girafa tigre zebra cocodril hipopòtam rinoceront goril·la'],
  ['UNA FLOR O UNA HERBA','margarida tulipa clavell gessamí violeta romaní farigola espígol rosella'],
  ['UN MES O UNA ESTACIÓ','gener febrer abril juliol agost setembre octubre novembre desembre primavera estiu tardor hivern'],
  ['A LA CIUTAT','semàfor vorera parada fanal carrer estació botiga mercat'],
  ['UN SENTIMENT','alegria tristesa sorpresa vergonya enveja ràbia'],
  ['UN BITXO','formiga abella papallona mosquit aranya marieta escarabat grill'],
];
const pla=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z]/g,'').toUpperCase();
const MIN=5,MAX=10,ERRORS=7;
// totes les paraules, cada una amb el seu tema
const PARAULES=[];
TEMES.forEach(([t,ll],i)=>ll.split(' ').forEach(w=>{const p=pla(w);if(p.length>=MIN&&p.length<=MAX)PARAULES.push({w,t:i})}));

function hashText(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
  return (h^h>>>16)>>>0;
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function barreja(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== EL DIA =====
const JOC='penjat',taulaDia=d=>JOC+'_dia/'+d;
// Punts del dia: 800 sense cap error, 100 menys per error; penjat, 0
const puntsDe=(guanyat,errors)=>guanyat?100*(8-errors):0;
const errorsDe=p=>8-p/100;
const formatDia=p=>p?'✓ '+errorsDe(p)+(errorsDe(p)===1?' error':' errors'):'✗';
Records.formata(JOC+'_dia',formatDia);
function diaAvui(){
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(new Date())}
  catch(e){return new Date().toISOString().slice(0,10)}
}
// la primera, la #1, és la del 9 de novembre del 2026
const numeroDe=d=>Math.round((Date.parse(d+'T12:00:00Z')-Date.parse('2026-11-09T12:00:00Z'))/864e5)+1;
const nomDia=d=>{const[a,m,dd]=d.split('-');return Number(dd)+'/'+Number(m)+'/'+a};
const llegeix=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}};
const desa=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
// La paraula de cada dia: totes barrejades per tandes (cap no es repeteix
// fins que no han sortit totes), i mai dos dies seguits del mateix tema.
function ordreTanda(t){
  const o=barreja(mulberry(hashText('PENJAT-'+t)),PARAULES.map((_,i)=>i));
  for(let i=1;i<o.length;i++)if(PARAULES[o[i]].t===PARAULES[o[i-1]].t){
    // la canvia per la primera de més endavant que sigui d'un altre tema
    for(let j=i+1;j<o.length;j++)if(PARAULES[o[j]].t!==PARAULES[o[i-1]].t){[o[i],o[j]]=[o[j],o[i]];break}
  }
  return o;
}
function paraulaDe(n){
  const L=PARAULES.length,t=Math.floor((n-1)/L);
  return PARAULES[ordreTanda(t)[(n-1)%L]];
}

const NUS=[478,92],CALAVERA=[930,360];

// ===== LA PARTIDA =====
let P=null,mode='dia',dia='',numero=0,paused=false,brut=true;
// P: el que es desa. Porta la paraula escrita: si algun dia canviés la
// llista, la partida desada no canviaria de paraula.
function novaP(m,par){return {v:1,mode:m,dia,n:numero,w:par.w,t:par.t,lletres:[],errors:0,fi:false,guanyat:false,nou:false,comencada:false}}
const clau=()=>mode==='dia'?'penjat-'+P.dia:'penjat-practica';
function desaP(){if(P)desa(clau(),P)}
let stats=llegeix('penjat-stats',{jugades:0,encerts:0,ratxa:0,millor:0,ultim:''});
// les lletres de la paraula, i les que es poden endevinar (la ç amb la C)
const lletresDe=w=>[...w.toUpperCase()].map(c=>({c,p:pla(c)}));
const falten=()=>lletresDe(P.w).filter(x=>x.p&&!P.lletres.includes(x.p)).length;
let anims=[];   // quan surt cada tros, per fer-lo aparèixer a poc a poc
function carrega(){anims=[];fi=null;pintaTot()}
function obreDia(){
  mode='dia';dia=diaAvui();numero=numeroDe(dia);
  const d=llegeix('penjat-'+dia,null);
  P=d&&d.v===1&&d.n===numero?d:novaP('dia',paraulaDe(numero));
  P.comencada=true;carrega();desaP();hideMsg();pintaLider();
  if(P.fi){posaFi(true);finalPartida()}
}
function obrePractica(nova){
  mode='practica';dia=diaAvui();numero=numeroDe(dia);
  const d=llegeix('penjat-practica',null);
  if(!nova&&d&&d.v===1&&!d.fi)P=d;
  else{
    const avui=paraulaDe(numero);let par;
    do par=PARAULES[Math.floor(Math.random()*PARAULES.length)];while(par.w===avui.w&&PARAULES.length>1);
    P=novaP('practica',par);
  }
  P.comencada=true;carrega();desaP();hideMsg();pintaLider();
}
const jugant=()=>P&&!P.fi&&!paused&&$('msg').style.display!=='block';

function prova(l){
  if(!jugant())return;
  l=pla(l);if(!l||l.length!==1)return;
  if(P.lletres.includes(l)){avisa('La '+l+' ja l\'has provada');return}
  P.lletres.push(l);
  const hi=lletresDe(P.w).some(x=>x.p===l);
  if(hi){so.be();if(!falten()){P.guanyat=true;acaba()}}
  else{P.errors++;anims[P.errors-1]=performance.now();so.mal();if(P.errors>=ERRORS)acaba()}
  desaP();pintaTot();
}

    (d&&d.fi?bt('m-dia',d.guanyat?'☀ LA D\'AVUI: ENDEVINADA':'☀ LA D\'AVUI: PENJAT','color:#9fd0a0;background:#16241a;border:1px solid #3a6a40','#'+numero+' · demà n\'hi haurà una altra')
      :bt('m-dia',d&&d.lletres&&d.lletres.length?'☀ CONTINUA LA D\'AVUI':'☀ LA PARAULA D\'AVUI ▸','color:#16141f;background:#9dff8a','#'+numero+' · '+nomDia(dia)+' · igual per a tothom'))+
    (pr&&!pr.fi&&pr.lletres&&pr.lletres.length?bt('m-cont','CONTINUA LA PRÀCTICA','color:#ece6fa;background:#2a2440;border:1px solid #463c66',TEMES[pr.t][0].toLowerCase()+' · '+pr.errors+' errors'):'')+
    bt('m-prac','PRÀCTICA: UNA ALTRA PARAULA','color:#ece6fa;background:#2a2440;border:1px solid #463c66','no compta per a res')+
    '<small style="color:#7a6a98;margin-top:12px">La d\'avui va a la taula: 800 punts sense cap error, i 100 menys per cada error.</small>');
  enllac('m-dia',obreDia);enllac('m-cont',()=>obrePractica(false));enllac('m-prac',()=>obrePractica(true));
}
function enllac(id,fn){const a=document.getElementById(id);if(a)a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();aInit();fn()})}

// ===== DIBUIX =====
const $=id=>document.getElementById(id);
const CV=$('c'),g=CV.getContext('2d');
// L'escena és de 300 × 250 i s'escala a la pantalla
const EW=300,EH=250;
let L={k:1,dpr:1,w:300,h:250};
function mesura(){
  const sc=$('screen').getBoundingClientRect();
  const k=Math.max(.5,Math.min(sc.width/EW,sc.height/EH));
  L.k=k;L.dpr=Math.min(3,window.devicePixelRatio||1);L.w=Math.floor(EW*k);L.h=Math.floor(EH*k);
  CV.style.width=L.w+'px';CV.style.height=L.h+'px';
  CV.width=Math.round(L.w*L.dpr);CV.height=Math.round(L.h*L.dpr);brut=true;
}
addEventListener('resize',mesura);
// El paisatge (cel, lluna, estels, turons i la forca) es pinta un sol cop
let fons=null;
function pintaFons(){
  const c=document.createElement('canvas');c.width=EW*2;c.height=EH*2;const x=c.getContext('2d');x.scale(2,2);
  const cel=x.createLinearGradient(0,0,0,EH);cel.addColorStop(0,'#123a4c');cel.addColorStop(.55,'#2f6f70');cel.addColorStop(1,'#d79a58');
  x.fillStyle=cel;x.fillRect(0,0,EW,EH);
  const r=mulberry(77);
  for(let i=0;i<40;i++){x.fillStyle='rgba(255,255,240,'+(.3+r()*.6)+')';x.fillRect(r()*EW,r()*EH*.45,1,1)}
  // la lluna
  const ll=x.createRadialGradient(250,46,4,250,46,44);ll.addColorStop(0,'rgba(255,250,215,.55)');ll.addColorStop(1,'rgba(255,250,215,0)');
  x.fillStyle=ll;x.beginPath();x.arc(250,46,44,0,7);x.fill();
  x.fillStyle='#fbf3cf';x.beginPath();x.arc(250,46,22,0,7);x.fill();
  x.fillStyle='rgba(200,190,150,.35)';[[244,40,4],[256,52,3],[252,38,2]].forEach(([a,b,rr])=>{x.beginPath();x.arc(a,b,rr,0,7);x.fill()});
  // turons llunyans i el terra
  x.fillStyle='#244848';x.beginPath();x.moveTo(0,205);
  for(let i=0;i<=EW;i+=10)x.lineTo(i,198-14*Math.sin(i/37)-8*Math.sin(i/13));x.lineTo(EW,EH);x.lineTo(0,EH);x.fill();
  x.fillStyle='#1a2a24';x.beginPath();x.moveTo(0,228);
  for(let i=0;i<=EW;i+=10)x.lineTo(i,226-5*Math.sin(i/23));x.lineTo(EW,EH);x.lineTo(0,EH);x.fill();
  // herbes
  x.strokeStyle='#2c4434';x.lineWidth=1;for(let i=0;i<70;i++){const a=r()*EW,b=228+r()*20;x.beginPath();x.moveTo(a,b);x.lineTo(a+(r()-.5)*4,b-3-r()*4);x.stroke()}
  // la forca, de fusta
  const fusta=(x1,y1,x2,y2,amp)=>{x.strokeStyle='#2a1a10';x.lineWidth=amp+3;x.lineCap='round';x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
    x.strokeStyle='#7a5434';x.lineWidth=amp;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
    x.strokeStyle='rgba(255,220,170,.25)';x.lineWidth=1.5;x.beginPath();x.moveTo(x1-amp/4,y1);x.lineTo(x2-amp/4,y2);x.stroke()};
  fusta(14,238,90,238,8);
  fusta(38,236,38,14,9);
  fusta(30,18,200,18,8);
  fusta(40,58,80,18,5);
  fons=c;
}
// la corda: de la biga fins on sigui el nus (que es mou quan es gronxa)
const BIGA=[180,22];
function corda(x2,y2){g.strokeStyle='#3a2a14';g.lineWidth=3.2;g.beginPath();g.moveTo(BIGA[0],BIGA[1]);g.lineTo(x2,y2);g.stroke();
  g.strokeStyle='#c8a868';g.lineWidth=1.8;g.beginPath();g.moveTo(BIGA[0],BIGA[1]);g.lineTo(x2,y2);g.stroke()}
const ESC=.205;   // de la imatge (1.024) a l'escena
let fi=null;      // l'animació del final: {t0, guanyat}
function posaFi(ja){fi={t0:ja?performance.now()-9e3:performance.now(),guanyat:P.guanyat}}
function dibuixa(t){
  if(!fons)pintaFons();
  g.setTransform(L.dpr*L.k,0,0,L.dpr*L.k,0,0);
  g.drawImage(fons,0,0,EW,EH);
  if(!P)return;
  const nusX=BIGA[0],nusY=48;
  // el gronxament i la caiguda
  let ang=0,dy=0,alfa=1,trencada=false;
  if(fi&&!fi.guanyat){const s=(t-fi.t0)/1000;ang=Math.sin(s*2.4)*.12*Math.max(.25,Math.exp(-s*.25))}
  if(fi&&fi.guanyat){const s=Math.max(0,(t-fi.t0)/1000-.35);trencada=true;dy=260*s*s;alfa=Math.max(0,1-s*.9)}
  else if(P.errors&&!fi){const s=t/1000;ang=Math.sin(s*1.6)*.025}
  if(trencada){
    // la corda trencada: un tros penja de la biga, l'altre cau amb el bruixot
    corda(nusX,34);
  }
  g.save();
  g.translate(BIGA[0],BIGA[1]);g.rotate(ang);g.translate(-BIGA[0],-BIGA[1]);
  g.translate(0,dy);g.globalAlpha=alfa;
  if(!trencada)corda(nusX,nusY);
  else{g.strokeStyle='#c8a868';g.lineWidth=1.8;g.beginPath();g.moveTo(nusX,40);g.lineTo(nusX,nusY);g.stroke()}
  // el bruixot, tros a tros
  const x0=nusX-NUS[0]*ESC,y0=nusY-NUS[1]*ESC+2;
  if(IMG.complete&&IMG.naturalWidth){
    const sz=1024*ESC;
    const n=fi&&!fi.guanyat?TROSSOS.length:P.errors;
    for(let i=0;i<n;i++){
      const a0=anims[i]?Math.min(1,(t-anims[i])/450):1;
      g.save();g.globalAlpha=alfa*a0;
      g.beginPath();TROSSOS[i][1].forEach(([px,py],k)=>{const X=x0+px*ESC,Y=y0+py*ESC;k?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.clip();
      g.drawImage(IMG,x0,y0+(1-a0)*-6,sz,sz);
      g.restore();
    }
    // si surt sencer, la calavera s'encén
    if(fi&&!fi.guanyat){const s=(t-fi.t0)/1000,k=.55+.45*Math.sin(s*6);
      const cx=x0+CALAVERA[0]*ESC,cy=y0+CALAVERA[1]*ESC,gr=g.createRadialGradient(cx,cy,2,cx,cy,34);
      gr.addColorStop(0,'rgba(170,255,140,'+(.75*k)+')');gr.addColorStop(1,'rgba(120,255,120,0)');
      g.globalCompositeOperation='lighter';g.fillStyle=gr;g.beginPath();g.arc(cx,cy,34,0,7);g.fill();g.globalCompositeOperation='source-over'}
  }
  g.restore();
  if(P.errors===0&&!fi){g.fillStyle='rgba(255,255,255,.55)';g.font='10px monospace';g.textAlign='center';g.fillText('el bruixot espera...',150,120)}
  if(paused){g.fillStyle='rgba(22,20,31,.96)';g.fillRect(0,0,EW,EH)}
}
function pintaTot(){
  if(!P)return;
  $('tema').textContent=TEMES[P.t][0]+(mode==='dia'?' · #'+P.n:' · PRÀCTICA');
  const el=$('paraula');el.innerHTML='';
  const ll=lletresDe(P.w),mida=Math.max(16,Math.min(22,Math.floor(320/ll.length)));
  ll.forEach(x=>{const s=document.createElement('span');
    if(!x.p){s.className='fix';s.textContent=x.c}
    else if(P.lletres.includes(x.p))s.textContent=x.c;
    else if(P.fi){s.textContent=x.c;s.className='falta'}
    s.style.fontSize=mida+'px';el.appendChild(s)});
  document.querySelectorAll('#teclat button[data-l]').forEach(b=>{const l=b.dataset.l;
    b.className=P.lletres.includes(l)?(ll.some(x=>x.p===l)?'si':'no'):''});
  $('errors').textContent=P.errors+'/'+ERRORS;
  brut=true;
}

// ===== EL TECLAT =====
// Un de propi, que el del mòbil taparia el bruixot. Sense accents: la A val
// per la À, i la C per la Ç.
const FILES=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
FILES.forEach((f,i)=>{const d=document.createElement('div');
  for(const t of f){const b=document.createElement('button');b.textContent=t;b.dataset.l=t;d.appendChild(b)}
  if(i===2){const b=document.createElement('button');b.textContent='MENÚ';b.id='menu';b.className='ample';d.appendChild(b)}
  $('teclat').appendChild(d)});
$('teclat').addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('button');if(!b)return;ev.preventDefault();aInit();
  if(paused){posaPausa(false);return}
  if(b.id==='menu'){menu();return}
  if(b.dataset.l){so.tecla();prova(b.dataset.l)}
});
let avisT=null;
function avisa(t){$('lider').textContent=t;$('lider').style.color='#ffb070';clearTimeout(avisT);avisT=setTimeout(()=>{$('lider').style.color='';pintaLider()},2500)}

// ===== EL FINAL =====
function acaba(){
  P.fi=true;
  if(mode==='dia'){
    P.nou=true;
    if(stats.ultim!==P.dia){
      const ahir=new Date(Date.parse(P.dia+'T12:00:00Z')-864e5).toISOString().slice(0,10);
      stats.jugades++;if(P.guanyat)stats.encerts++;
      stats.ratxa=P.guanyat?(stats.ultim===ahir&&stats.ratxa>0?stats.ratxa+1:1):0;
      stats.millor=Math.max(stats.millor,stats.ratxa);stats.ultim=P.dia;desa('penjat-stats',stats);
    }
  }
  desaP();posaFi(false);updateHUD();
  if(P.guanyat){so.corda();setTimeout(so.guanya,250)}else setTimeout(so.riu,300);
  setTimeout(finalPartida,P.guanyat?1600:2200);
}
function textCompartir(){
  return 'El Penjat'+(mode==='dia'?' #'+P.n:' (pràctica)')+' · '+TEMES[P.t][0].toLowerCase()+'\n'+
    (P.guanyat?'✅ endevinada amb '+P.errors+(P.errors===1?' error':' errors'):'🧙 m\'ha penjat el bruixot')+'\n'+
    '🟥'.repeat(P.errors)+'⬜'.repeat(ERRORS-P.errors);
}
let enFinal=false;
async function finalPartida(){
  if(enFinal)return;enFinal=true;
  try{
    if(!P||!P.fi){msg('<div style="color:#9dff8a">EL PENJAT</div><small>encara és a mig fer</small>'+Records.peuFinal('o toca per tancar'));potTancar=!!P;return}
    const pt=puntsDe(P.guanyat,P.errors),dia2=P.dia;
    let t='<div style="color:'+(P.guanyat?'#7dff9b':'#ffb3a8')+'">'+(P.guanyat?(P.errors?'L\'HAS ENDEVINADA!':'SENSE CAP ERROR!'):'EL BRUIXOT T\'HA GUANYAT')+'</div>'+
      '<div style="font-size:28px;font-weight:bold;color:#fff;letter-spacing:.06em">'+P.w.toUpperCase()+'</div>'+
      '<small style="color:#b8a8d8">'+TEMES[P.t][0].toLowerCase()+' · '+P.errors+(P.errors===1?' error':' errors')+(mode==='dia'?' · <b style="color:#fff">'+pt+' punts</b>':'')+'</small>';
    if(mode==='dia'){
      t+='<small style="color:#aaa">ratxa: '+stats.ratxa+' · la millor: '+stats.millor+' · endevinades: '+stats.encerts+' de '+stats.jugades+'</small>';
      const tx=textCompartir(),enl=location.href.split('#')[0];
      t+='<div class="reptes"><a target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(enl)+'&text='+encodeURIComponent(tx)+'">ENVIA A TELEGRAM</a>'+
        '<a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(tx+'\n'+enl)+'">A WHATSAPP</a></div>'+
        '<div id="taula" style="margin:8px 0;color:#888;font-size:12px">…</div>';
    }else t+='<small style="color:#a898c8">les de pràctica no compten per a cap taula</small>';
    t+='<a href="#" class="bt" id="f-prac" style="color:#ece6fa;background:#2a2440;border:1px solid #463c66">PRÀCTICA: UNA ALTRA PARAULA</a>'+
      '<a href="#" id="f-menu" style="display:block;margin-top:12px;font:12px monospace;color:#b8a8d8">torna al menú del joc</a>';
    msg(t+Records.peuFinal(mode==='dia'?'demà n\'hi haurà una altra':'o toca per tancar'));potTancar=true;
    enllac('f-prac',()=>obrePractica(true));enllac('f-menu',menu);
    if(mode==='dia'){
      // Les dues taules: la d'avui (els punts; només compta la primera de
      // cada inicials) i les paraules endevinades de sempre (cadascú un cop)
      let r={html:'',posicio:0};
      const nova=P.nou;
      if(nova){r=await Records.fiPartida(taulaDia(dia2),pt);P.nou=false;desaP()}
      else r.html=Records.taulaHTML(await Records.llista(taulaDia(dia2)),null,taulaDia(dia2));
      if(nova&&P.guanyat&&stats.encerts>0&&Records.nom())await Records.envia(JOC,stats.encerts);
      const sempre=Records.taulaHTML(await Records.llista(JOC));
      const titol=t2=>'<div style="color:#9dff8a;font-size:13px;margin-top:8px">'+t2+'</div>';
      const el=document.getElementById('taula');
      if(el)el.innerHTML=titol('☀ LA D\'AVUI')+r.html+
        (r.posicio===1?'<div style="color:#ff0;font-size:13px">ARA MATEIX GUANYES LA D\'AVUI!<br><span style="color:#aaa">demà al matí el bot ho dirà al grup</span></div>':
         r.posicio?'<div style="color:#ff0;font-size:13px">Ets el número '+r.posicio+' d\'avui!</div>':'')+
        titol('★ PARAULES ENDEVINADES')+sempre;
      Records.pintaMillor(JOC,$('best'),stats.encerts);
      refrescaLiders();
    }
  }finally{enFinal=false}
}
let potTancar=false;
function msg(t){potTancar=false;const m=$('msg');m.innerHTML=t;m.style.display='block'}
function hideMsg(){$('msg').style.display='none'}
function updateHUD(){
  $('score').textContent=stats.encerts;
  Records.desaLocal(JOC,stats.encerts);
  Records.marcador(JOC,$('best'),stats.encerts);
}
let liderDia=null,liderSempre=null;
function pintaLider(){
  $('lider').textContent=mode==='practica'?'PRÀCTICA · no compta per a cap taula':
    '☀ #'+numero+' AVUI: '+(liderDia?liderDia.n+' '+formatDia(liderDia.p):'ningú')+'  ·  DE SEMPRE: '+(liderSempre?liderSempre.n+' '+liderSempre.p:'ningú');
}
async function refrescaLiders(){
  try{liderDia=await Records.lider(taulaDia(diaAvui()));liderSempre=await Records.lider(JOC)}catch(e){}
  pintaLider();
}

// ===== EL BUCLE =====
function loop(t){
  const viu=fi||anims.some(a=>a&&t-a<500)||(P&&P.errors);
  if(brut||viu){dibuixa(t);brut=false}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function posaPausa(v){paused=v;$('pausa').style.display=v?'flex':'none';brut=true;if(paused)desaP()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)desaP()});
addEventListener('pagehide',desaP);
document.addEventListener('contextmenu',e=>e.preventDefault());
// La P del teclat de l'ordinador s'escriu: només fa pausa la P de mentida
// que envia el botó de pausa del marcador.
document.addEventListener('keydown',e=>{
  aInit();
  if((e.code==='KeyP'&&!e.isTrusted)||e.key==='Escape'){posaPausa(!paused);return}
  if(paused||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key.length===1&&/[a-zà-úç]/i.test(e.key)){e.preventDefault();prova(e.key)}
});
$('pausa').addEventListener('pointerdown',ev=>{ev.preventDefault();posaPausa(false)});
$('msg').addEventListener('click',e=>{if(!e.target.closest('a')&&potTancar)hideMsg()});

mesura();
updateHUD();
Records.pintaMillor(JOC,$('best'),stats.encerts);
refrescaLiders();
// en entrar, el menú: la d'avui, continuar la pràctica o fer-ne una altra
menu();

// En entrar al joc, els records uns segons, com les màquines de debò.
Records.pantallaInicial(JOC,()=>paused=true,()=>{paused=false;brut=true},
  [['☀ LA D\'AVUI',taulaDia(diaAvui())],['★ PARAULES ENDEVINADES',JOC]]);
</script>
