// ===== SO =====
let AC=null,MG=null;
function aInit(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type="sine",vol=.3,slide=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+dur);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.008);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(MG);o.start(now);o.stop(now+dur+.02);
}
const so={
  toc(){aInit();tone(600,.04,'triangle',.12)},
  posa(){aInit();tone(440,.05,'triangle',.14,80)},
  daus(){aInit();for(let i=0;i<4;i++)setTimeout(()=>tone(300+Math.random()*500,.03,'square',.06),i*35)},
  guanya(){aInit();[523,784].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.2),i*70))},
  perd(){aInit();tone(200,.2,'sawtooth',.12,-60)},
  conquesta(){aInit();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.2),i*60))},
  no(){aInit();tone(160,.1,'square',.1,-40)},
  fi(){aInit();[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.24),i*120))},
  derrota(){aInit();[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.24,-40),i*200))},
};

// ==REGLES==
// Com el joc de conquesta de taula de tota la vida, amb les comarques: tres
// exercits (tu, els VERMELLS i els GROCS) i les vegueries fan de continents.
//   1. REFORÇA: un soldat per cada tres comarques (com a minim 3), mes el
//      premi de cada vegueria que tinguis sencera.
//   2. ATACA les comarques del costat: tu tires fins a 3 daus (un menys que
//      els soldats que hi tens), ell fins a 2. Es comparen de gran a petit, i
//      a cada parella perd un soldat qui ha tret menys (si empaten, perd qui
//      ataca). Si la deixes buida, es teva i hi passes soldats.
//   3. MOU soldats d'una comarca teva a una altra, si s'hi pot arribar
//      passant per comarques teves. Nomes un cop per torn.
// Guanya qui arriba primer a 30 comarques.
const N=43,OBJECTIU=30,MAX_RONDES=25;
const VEI=MAPA.comarques.map(c=>c.veines.map(v=>v-1));
const BONUS={'Alt Pirineu i Aran':3,'Ponent':3,'Camp de Tarragona':3,"Terres de l'Ebre":2,'Penedès':2,'Catalunya Central':3,'Comarques Gironines':4,'Àmbit Metropolità':3};
const VEGS=Object.entries(MAPA.vegueries).map(([nom,ids])=>({nom,cs:ids.map(i=>i-1),bonus:BONUS[nom]}));
const JUGADORS=[{nom:'TU',de:'teves',col:'#2f72e0',clar:'#8fb6f2'},{nom:'VERMELLS',de:'dels VERMELLS',col:'#d24040',clar:'#f0a097'},{nom:'GROCS',de:'dels GROCS',col:'#d4a017',clar:'#f2d679'}];

function hashText(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
  return (h^h>>>16)>>>0;
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Cada dau surt de la llavor i del seu numero d'ordre: la mateixa partida,
// jugada igual, treu els mateixos daus. Aixi la batalla del dia es justa.
function dau(S){return 1+Math.floor(mulberry(hashText(S.seed+':'+(S.daus++)))()*6)}

function novaPartida(seed){
  const r=mulberry(hashText('CONQUESTA-'+seed));
  const ordre=[...Array(N).keys()];
  for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1));[ordre[i],ordre[j]]=[ordre[j],ordre[i]]}
  const S={seed,ronda:1,torn:0,fase:'reforc',dueny:Array(N).fill(0),soldats:Array(N).fill(1),posar:0,daus:0,fi:null,vius:[true,true,true]};
  ordre.forEach((c,i)=>S.dueny[c]=i%3);
  // 35 soldats per cap, repartits a l'atzar per les seves comarques
  for(let p=0;p<3;p++){const meves=ordre.filter(c=>S.dueny[c]===p);
    for(let k=meves.length;k<35;k++)S.soldats[meves[Math.floor(r()*meves.length)]]++}
  S.posar=reforcos(S,0);
  return S;
}
const comarquesDe=(S,p)=>S.dueny.reduce((n,d)=>n+(d===p),0);
function vegueriesDe(S,p){return VEGS.filter(v=>v.cs.every(c=>S.dueny[c]===p))}
function reforcos(S,p){return Math.max(3,Math.floor(comarquesDe(S,p)/3))+vegueriesDe(S,p).reduce((n,v)=>n+v.bonus,0)}
const veines=(a,b)=>VEI[a].includes(b);
function potAtacar(S,a,d){return S.dueny[a]!==S.dueny[d]&&veines(a,d)&&S.soldats[a]>=2}
// Una tirada: torna els daus i qui perd que
function tirada(S,a,d){
  const na=Math.min(3,S.soldats[a]-1),nd=Math.min(2,S.soldats[d]);
  const da=Array.from({length:na},()=>dau(S)).sort((x,y)=>y-x),dd=Array.from({length:nd},()=>dau(S)).sort((x,y)=>y-x);
  let pa=0,pd=0;
  for(let i=0;i<Math.min(na,nd);i++){if(da[i]>dd[i])pd++;else pa++}
  S.soldats[a]-=pa;S.soldats[d]-=pd;
  const r={a,d,da,dd,pa,pd,conquesta:false,min:na};
  if(S.soldats[d]<=0){
    const vell=S.dueny[d];S.dueny[d]=S.dueny[a];S.soldats[d]=0;r.conquesta=true;r.de=vell;
    if(!comarquesDe(S,vell))S.vius[vell]=false;
  }
  return r;
}
// Despres de conquerir-la, hi passes com a minim tants soldats com daus has tirat
function ocupa(S,a,d,n,min){n=Math.max(min,Math.min(n,S.soldats[a]-1));S.soldats[a]-=n;S.soldats[d]+=n;return n}
// les comarques teves on es pot arribar des d'una, passant per les teves
function connectades(S,a){
  const p=S.dueny[a],vist=new Set([a]),cua=[a];
  while(cua.length){const c=cua.pop();for(const v of VEI[c])if(S.dueny[v]===p&&!vist.has(v)){vist.add(v);cua.push(v)}}
  vist.delete(a);return vist;
}
function mou(S,a,b,n){if(S.dueny[a]!==S.dueny[b]||!connectades(S,a).has(b))return 0;n=Math.min(n,S.soldats[a]-1);S.soldats[a]-=n;S.soldats[b]+=n;return n}
// qui ha arribat a l'objectiu
function guanyador(S){for(let p=0;p<3;p++)if(comarquesDe(S,p)>=OBJECTIU)return p;return -1}
function seguentTorn(S){
  do{S.torn=(S.torn+1)%3;if(S.torn===0)S.ronda++}while(!S.vius[S.torn]);
  S.fase='reforc';S.posar=reforcos(S,S.torn);S.mogut=false;
}

// ===== LA MAQUINA =====
// Juga com una persona assenyada: reforça la frontera on te mes a guanyar,
// ataca nomes quan te avantatge clar, va a completar vegueries i, si algu
// s'escapa cap a les 30, li va al darrere. Torna la llista de coses que ha fet,
// per ensenyar-les a poc a poc.
const AGRESSIU=2;                // amb quants soldats de mes ataca la maquina
function amenaça(S,c){return VEI[c].filter(v=>S.dueny[v]!==S.dueny[c]).reduce((m,v)=>Math.max(m,S.soldats[v]),0)}
function valorObjectiu(S,p,d){
  let v=0;const veg=VEGS.find(g=>g.cs.includes(d));
  const meves=veg.cs.filter(c=>S.dueny[c]===p).length,altres=veg.cs.length-meves;
  if(altres===1)v+=3*veg.bonus;else v+=meves/veg.cs.length*2;
  const lider=[0,1,2].filter(q=>q!==p).sort((x,y)=>comarquesDe(S,y)-comarquesDe(S,x))[0];
  if(S.dueny[d]===lider&&comarquesDe(S,lider)>=OBJECTIU-8)v+=4;       // ningu no ha d'arribar a 30
  // trencar una vegueria sencera d'un altre li treu el premi
  if(veg.cs.every(c=>S.dueny[c]===S.dueny[d]))v+=veg.bonus;
  return v;
}
function iaReforça(S,p,quants){
  const fets=[];let millor=-1,mv=-1e9;
  for(let c=0;c<N;c++)if(S.dueny[c]===p){
    const enemics=VEI[c].filter(v=>S.dueny[v]!==p);if(!enemics.length)continue;
    const v=Math.max(...enemics.map(e=>valorObjectiu(S,p,e)-S.soldats[e]*.6))+S.soldats[c]*.15;
    if(v>mv){mv=v;millor=c}
  }
  if(millor<0)millor=S.dueny.findIndex(d=>d===p);
  S.soldats[millor]+=quants;fets.push({t:'reforç',c:millor,n:quants});
  return fets;
}
function iaTriaAtac(S,p,agressiu=AGRESSIU){
  let millor=null,mv=-1e9;
  for(let a=0;a<N;a++)if(S.dueny[a]===p&&S.soldats[a]>=3)for(const d of VEI[a]){
    if(S.dueny[d]===p||S.soldats[a]<S.soldats[d]+agressiu)continue;
    const v=valorObjectiu(S,p,d)+(S.soldats[a]-S.soldats[d])*.5;
    if(v>mv){mv=v;millor=[a,d]}
  }
  return millor;
}
function iaOcupa(S,a,d,min){
  const resta=VEI[a].some(v=>S.dueny[v]!==S.dueny[a]);
  return ocupa(S,a,d,resta?Math.ceil((S.soldats[a]-1)/2):S.soldats[a]-1,min);
}
function iaMou(S,p){
  // els soldats de les comarques de dins, cap a la frontera mes amenaçada
  let a=-1,ma=1;
  for(let c=0;c<N;c++)if(S.dueny[c]===p&&S.soldats[c]>ma&&!VEI[c].some(v=>S.dueny[v]!==p)){ma=S.soldats[c];a=c}
  if(a<0)return null;
  let b=-1,mb=-1;for(const c of connectades(S,a)){const am=amenaça(S,c);if(am>mb){mb=am;b=c}}
  if(b<0||mb<=0)return null;
  const n=mou(S,a,b,S.soldats[a]-1);return n?{t:'mou',a,c:b,n}:null;
}
// un torn sencer de la maquina, pas a pas
function* iaTorn(S,p,agressiu=AGRESSIU){
  for(const f of iaReforça(S,p,S.posar)){S.posar=0;yield f}
  S.fase='atac';
  for(let k=0;k<60;k++){
    if(guanyador(S)>=0)return;
    const at=iaTriaAtac(S,p,agressiu);if(!at)break;
    const [a,d]=at;
    while(S.soldats[a]>=2&&S.dueny[d]!==p&&S.soldats[a]>=S.soldats[d]+1){
      const r=tirada(S,a,d);
      if(r.conquesta){r.n=iaOcupa(S,a,d,r.min);yield {t:'atac',...r};break}
      yield {t:'atac',...r};
    }
  }
  if(guanyador(S)>=0)return;
  S.fase='mou';
  const m=iaMou(S,p);if(m)yield m;
}

function enllac(id,fn){const a=document.getElementById(id);if(a)a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();aInit();fn()})}
function comenca(m){
  mode=m;dia=diaAvui();numero=numeroDe(dia);

}
function continua(q){mode=q.mode;dia=q.dia;numero=numeroDe(dia);S=q.S;hideMsg();sel=null;ultima=null;
  if(S.torn!==0)comencaIA();pinta()}

// ===== EL TEU TORN =====
function toca(c){
  if(!S||S.fi||paused||ia||pendent)return;
  if(S.torn!==0)return;
  if(S.fase==='reforc'){
    if(S.dueny[c]!==0){so.no();avisa('Els reforços van a les comarques teves (blaves).');return}
    S.soldats[c]++;S.posar--;sel=c;so.posa();
    if(S.posar<=0){S.fase='atac';sel=null}
    desaPartida();pinta();return;
  }
  if(S.fase==='atac'){
    if(S.dueny[c]===0){
      if(S.soldats[c]<2){so.no();avisa('Per atacar des d\'aquí hi has de tenir 2 soldats o més.');sel=null;pinta();return}
      sel=c;obj=null;so.toc();pinta();return;
    }
    if(sel===null){so.no();avisa('Primer toca una comarca teva, i després la que vols atacar.');return}
    if(!veines(sel,c)){so.no();avisa(MAPA.comarques[c].nom+' no és del costat de '+MAPA.comarques[sel].nom+'.');return}
    obj=c;ataca(false);return;
  }
  if(S.fase==='mou'){
    if(S.dueny[c]!==0){so.no();return}
    if(sel===null||sel===c||!connectades(S,sel).has(c)){
      if(S.soldats[c]<2){so.no();avisa('Tria una comarca teva amb 2 soldats o més.');sel=null;pinta();return}
      sel=c;obj=null;so.toc();pinta();return;
    }
    obj=c;so.toc();pendent={t:'mou',a:sel,b:c};pinta();
  }
}
// una tirada, o totes fins que la conquereixes o et quedes sense
function ataca(aFons){
  const a=sel,d=obj;if(a===null||d===null||!potAtacar(S,a,d)){so.no();return}
  const ca=S.dueny[a],cd=S.dueny[d],rs=[];let r;
  do{r=tirada(S,a,d);rs.push(r)}while(aFons&&!r.conquesta&&S.soldats[a]>=2);
  // ATAC A FONS: s'ensenyen totes, una darrere l'altra (si en son moltes,
  // cada una es queda menys estona, que si no s'hi passaria la tarda)
  ultima=r;so.daus();setTimeout(r.pd>r.pa?so.guanya:so.perd,120);
  ensenyaDaus(rs,ca,cd);
  if(r.conquesta){
    so.conquesta();
    const g=guanyador(S);
    if(g>=0){ocupa(S,a,d,S.soldats[a]-1,r.min);acabaPartida(g);return}
    // quants hi passes: com a minim els daus que has tirat
    if(S.soldats[a]-1<=r.min){ocupa(S,a,d,r.min,r.min);sel=d;obj=null}
    else pendent={t:'ocupa',a,d,min:r.min};
  }else if(S.soldats[a]<2){sel=null;obj=null}
  desaPartida();pinta();
}
function triaQuants(n){
  if(!pendent)return;
  const p=pendent;pendent=null;so.toc();
  if(p.t==='ocupa'){ocupa(S,p.a,p.d,n,p.min);sel=S.soldats[p.d]>=2?p.d:null;obj=null}
  else{mou(S,p.a,p.b,n);sel=null;obj=null;acabaTorn();return}
  desaPartida();pinta();
}
function quantitats(){
  const p=pendent,max=S.soldats[p.a]-1,min=p.t==='ocupa'?p.min:1;
  return [...new Set([min,Math.max(min,Math.ceil(max/2)),max])].filter(n=>n>=min&&n<=max);
}
function acabaAtacs(){if(!S||S.torn!==0||S.fase!=='atac'||pendent)return;$('daus').style.display='none';S.fase='mou';sel=null;obj=null;so.toc();desaPartida();pinta()}
function acabaTorn(){
  if(!S||S.torn!==0)return;
  sel=null;obj=null;pendent=null;
  seguentTorn(S);
  if(S.ronda>MAX_RONDES){acabaPartida(-1);return}
  desaPartida();comencaIA();pinta();
}
function posaTots(){
  if(!S||S.torn!==0||S.fase!=='reforc'||sel===null||S.dueny[sel]!==0)return;
  S.soldats[sel]+=S.posar;S.posar=0;S.fase='atac';sel=null;so.posa();desaPartida();pinta();
}

// ===== EL TORN DE LA MAQUINA =====
function comencaIA(){
  if(S.fi||S.torn===0)return;
  ia=iaTorn(S,S.torn);iaSeguent=null;iaT=depressa?0:.4;
}
let iaSeguent=null;      // el pas que ja s'ha tret mirant si l'atac seguia
function treuPas(){if(iaSeguent){const r=iaSeguent;iaSeguent=null;return r}return ia.next()}
function pasIA(){
  const r=treuPas();
  if(r.done){
    ia=null;
    const g=guanyador(S);if(g>=0){acabaPartida(g);return}
    if(!S.vius[0]){acabaPartida(-2);return}
    seguentTorn(S);
    if(S.ronda>MAX_RONDES){acabaPartida(-1);return}
    sel=null;desaPartida();
    if(S.torn!==0)comencaIA();else depressa=false;
    pinta();return;
  }
  let f=r.value;ultima=f.t==='atac'?f:null;
  if(f.t==='atac'){
    // Totes les tirades seguides contra la mateixa comarca, juntes: es veu
    // l'ultima, quieta, i el que s'hi ha perdut en total. Una per una, el
    // torn de cada un duraria mig minut.
    const ca=S.dueny[f.a],cd=f.conquesta?f.de:S.dueny[f.d],tot={n:1,pa:f.pa,pd:f.pd};
    while(!depressa&&!f.conquesta){
      const q=ia.next();
      if(!q.done&&q.value.t==='atac'&&q.value.a===f.a&&q.value.d===f.d){f=q.value;tot.n++;tot.pa+=f.pa;tot.pd+=f.pd;continue}
      iaSeguent=q;break;
    }
    ultima=f;
    const dura=ensenyaDaus([f],ca,f.conquesta?f.de:cd,{tot,rapid:depressa,queda:1600});
    if(!depressa){so.daus();if(f.conquesta&&f.de===0)setTimeout(so.perd,100)}
    iaT=depressa?.02:(dura+(f.conquesta?1500:1200))/1000;
  }else iaT=depressa?.02:.45;
  sel=f.t==='atac'?f.a:f.c;obj=f.t==='atac'?f.d:null;
  pinta();
}

// ===== EL FINAL =====
function acabaPartida(g){
  if(S.fi)return;
  S.fi={guanya:g,ronda:S.ronda};ia=null;pendent=null;sel=null;obj=null;
  const pt=punts(S);
  desa('conquesta-partida',{v:1,mode,dia,S});
  const f={mode,dia,numero,guanya:g,ronda:Math.min(S.ronda,MAX_RONDES),comarques:comarquesDe(S,0),punts:pt,nova:true};
  if(mode==='dia')desa('conquesta-fi-'+dia,f);
  if(g===0)so.fi();else so.derrota();
  pinta();
  setTimeout(()=>finalPartida(f),900);
}
let enFinal=false;
async function finalPartida(f){
  if(enFinal)return;enFinal=true;
  try{
    if(!f){msg('LA CONQUESTA'+Records.peuFinal('o toca per tancar'));return}
    const titol=f.guanya===0?'<div style="color:#7dff9b">HAS CONQUERIT CATALUNYA!</div><small>30 comarques a la ronda '+f.ronda+'</small>'
      :f.guanya>0?'<div style="color:#ff9b8a">ELS '+JUGADORS[f.guanya].nom+' HAN ARRIBAT A 30</div>'
      :f.guanya===-2?'<div style="color:#ff9b8a">T\'HAN FET FORA DEL MAPA</div>'
      :'<div style="color:#ffd27a">S\'HAN ACABAT LES '+MAX_RONDES+' RONDES</div>';
    const compte=f.guanya===0?'1.000 per guanyar + 50 × '+(MAX_RONDES-f.ronda)+' rondes que et sobren':f.comarques+' comarques × 10';
    let t=titol+'<div style="font-size:30px;font-weight:bold;margin-top:6px">'+xifra(f.punts)+'<span style="font-size:15px;color:#9fb3c6"> punts</span></div><small style="color:#aaa">'+compte+'</small>'+
      (f.mode==='dia'?'<small style="color:#9fb3c6">la batalla d\'avui, #'+f.numero+'</small>':'<small style="color:#9fb3c6">partida lliure</small>');
    const enl=location.href.split('#')[0];
    const tx='La Conquesta'+(f.mode==='dia'?' #'+f.numero:'')+': '+(f.guanya===0?'he conquerit Catalunya a la ronda '+f.ronda:'he acabat amb '+f.comarques+' comarques')+' · '+xifra(f.punts)+' punts';
    t+='<div class="reptes"><a target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(enl)+'&text='+encodeURIComponent(tx)+'">ENVIA A TELEGRAM</a>'+
      '<a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(tx+'\n'+enl)+'">A WHATSAPP</a></div>';
    t+='<div id="taula" style="margin:8px 0;color:#888;font-size:12px">…</div>';
    t+='<a href="#" class="bt" id="f-menu" style="color:#ffd27a;background:#111;border:1px solid #a07a30">TORNA AL MENÚ DEL JOC</a>';
    msg(t+Records.peuFinal(f.mode==='dia'?'demà hi haurà una altra batalla':'o toca per tancar'));
    enllac('f-menu',menu);
    // Les dues taules, cadascuna amb el seu titol: la d'avui (nomes la primera
    // partida del dia) i la de sempre (les partides lliures).
    const idDia=JOC+'_dia/'+diaAvui();
    let r={html:'',posicio:0};
    if(f.nova&&f.punts>0)r=await Records.fiPartida(f.mode==='dia'?JOC+'_dia/'+f.dia:JOC,f.punts);
    if(f.nova){f.nova=false;if(f.mode==='dia')desa('conquesta-fi-'+f.dia,f)}
    const htmlDia=f.mode==='dia'&&r.html?r.html:Records.taulaHTML(await Records.llista(idDia));
    const htmlSempre=f.mode!=='dia'&&r.html?r.html:Records.taulaHTML(await Records.llista(JOC));
    const tt=t2=>'<div style="color:#ffd27a;font-size:13px;margin-top:8px">'+t2+'</div>';
    const el=document.getElementById('taula');
    if(el)el.innerHTML=tt('☀ LA BATALLA D\'AVUI')+htmlDia+
      (r.posicio===1&&f.mode==='dia'?'<div style="color:#ff0;font-size:13px">ARA MATEIX GUANYES LA D\'AVUI!<br><span style="color:#aaa">demà al matí el bot ho dirà al grup</span></div>':
       r.posicio?'<div style="color:#ff0;font-size:13px">Ets el número '+r.posicio+'!</div>':'')+
      tt('DE SEMPRE <span style="color:#888">(partides lliures)</span>')+htmlSempre;
    Records.pintaMillor(JOC,document.getElementById('best'),f.punts);
    $('score').textContent=xifra(f.punts);
  }finally{enFinal=false}
}

function pinta(){
  const fase=S&&!S.fi?S.fase:null,meu=S&&S.torn===0&&!ia;
  const dest=new Set();
  if(S&&meu&&sel!==null){
    if(fase==='atac')for(const v of VEI[sel])if(S.dueny[v]!==0)dest.add(v);
    if(fase==='mou')for(const v of connectades(S,sel))dest.add(v);
  }
  MAPA.comarques.forEach((c,i)=>{
    const p=S?S.dueny[i]:-1,j=JUGADORS[p];
    ZONES[i].setAttribute('fill',p<0?'#24384a':(dest.has(i)||i===sel||i===obj)?j.clar:j.col);
    ZONES[i].setAttribute('fill-opacity',p<0?1:(sel===null||i===sel||i===obj||dest.has(i)||!meu)?.92:.5);
    const e=ETIQ[i];
    e.cer.setAttribute('fill',p<0?'#24384a':j.col);
    e.cer.setAttribute('fill-opacity',1);
    e.cer.setAttribute('stroke',i===sel?'#ffe66a':i===obj?'#fff':dest.has(i)?'#ffe66a':'#0d1b26');
    e.cer.setAttribute('stroke-width',i===sel||i===obj?6:dest.has(i)?4:2.5);
    e.cer.setAttribute('r',i===sel||i===obj?33:28);
    e.tx.textContent=S?S.soldats[i]:'';
  });
  if(S&&sel!==null&&obj!==null){const a=ETIQ[sel],b=ETIQ[obj];
    FLETXA.setAttribute('x1',a.x);FLETXA.setAttribute('y1',a.y);FLETXA.setAttribute('x2',b.x);FLETXA.setAttribute('y2',b.y);
    FLETXA.setAttribute('opacity',.85);SVG.appendChild(FLETXA);ETIQ[sel].g.parentNode.appendChild(ETIQ[sel].g);ETIQ[obj].g.parentNode.appendChild(ETIQ[obj].g)}
  else FLETXA.setAttribute('opacity',0);
  pintaMarca();pintaEstat();pintaInfo();pintaBotons();
}

    '<span style="color:#9fb3c6">RONDA '+Math.min(S.ronda,MAX_RONDES)+'/'+MAX_RONDES+'</span>';

// ===== ELS DAUS =====
// Grossos, a dalt del mapa: els de qui ataca a dalt, els de qui defensa a
// sota, cada dau davant del que li toca. El que perd la parella queda apagat
// i amb un −1 (un soldat menys per a aquell costat), i el dau de mes que no
// te parella surt ratllat: no compta.
// En Carles no els veia (abans nomes sortien petits a la ratlla de sota), i
// despres no els entenia: als torns dels altres cada tirada durava menys que
// el que trigaven els daus a rodolar, i nomes se'n veien els numeros de
// mentida de quan rodolen. Ara cada tirada s'atura i es queda una estona.
const DAUS_RODA=6,DAUS_PAS=70;                 // rodolen 6 vegades, 70 mil·lèsimes cada una
const DAUS_QUIET=1000;                         // cada tirada, quieta, abans de la seguent (600 si n'hi ha mes de 4)
let dausT=null;
// rs: les tirades, en ordre; o.tot: el que es va perdre en total (si n'hi ha
// mes de les que s'ensenyen); o.queda: quanta estona es queda l'ultima.
// Torna quant dura, perque els torns dels altres hi puguin esperar.
function ensenyaDaus(rs,ca,cd,o={}){
  const el=$('daus');clearTimeout(dausT);
  if(o.rapid){el.style.display='none';return 0}
  const r0=rs[0],nomA=MAPA.comarques[r0.a].nom,nomD=MAPA.comarques[r0.d].nom;
  const n=o.tot?o.tot.n:rs.length;
  const pa=o.tot?o.tot.pa:rs.reduce((x,r)=>x+r.pa,0),pd=o.tot?o.tot.pd:rs.reduce((x,r)=>x+r.pd,0);
  const nomCurt=c=>c===0?'TU':JUGADORS[c].nom;
  const cap='<b style="color:'+JUGADORS[ca].clar+'">'+nomA+'</b> ataca <b style="color:'+JUGADORS[cd].clar+'">'+nomD+'</b>';
  const dg=(v,col,cls,menys)=>'<span class="cel"><span class="dg'+(cls?' '+cls:'')+'" style="background:'+col+'">'+v+'</span>'+(menys?'<span class="menys">−1</span>':'')+'</span>';
  const et=c=>'<span class="et" style="color:'+JUGADORS[c].clar+'">'+nomCurt(c)+'</span>';
  // una tirada, quieta
  const quieta=(r,k,ultima)=>{
    const parells=Math.min(r.da.length,r.dd.length);
    const fila=(ds,c,altre,soc)=>'<div class="fila">'+et(c)+ds.map((v,i)=>{
      if(i>=parells)return dg(v,JUGADORS[c].col,'sobra');
      const perd=soc==='a'?v<=altre[i]:v<altre[i];
      return dg(v,JUGADORS[c].col,perd?'perd':'',perd)}).join('')+'<span class="et"></span></div>';
    const perden=(x,y)=>(y?nomD+' perd '+y:'')+(x&&y?' · ':'')+(x?nomA+' perd '+x:'');
    let res;
    if(ultima&&r.conquesta)res='<b style="color:#7dff9b">'+nomD+' és '+(ca===0?'teva':'dels '+JUGADORS[ca].nom)+'!</b>'+(n>1?' <span class="tir">('+n+' tirades)</span>':'');
    else if(ultima&&n>1)res='En '+n+' tirades: '+perden(pa,pd);
    else res=perden(r.pa,r.pd);
    el.innerHTML=cap+quina(k)+
      fila(r.da,ca,r.dd,'a')+fila(r.dd,cd,r.da,'d')+'<div class="res">'+res+'</div>'+
      '<div class="regla">el més alt contra el més alt · si empaten, guanya qui defensa</div>';
  };
  // rodolant (de mentida: el resultat ja hi es)
  const quina=k=>rs.length>1?' <span class="tir">· tirada '+(k+1)+' de '+n+'</span>':'';
  const rodola=(r,k)=>{
    const fila=(ds,c,b)=>'<div class="fila">'+et(c)+ds.map(()=>dg(1+Math.floor(Math.random()*6),JUGADORS[c].col,'roda'+(b?' b':''))).join('')+'<span class="et"></span></div>';
    el.innerHTML=cap+quina(k)+fila(r.da,ca,false)+fila(r.dd,cd,true)+'<div class="res">&nbsp;</div><div class="regla">&nbsp;</div>';
  };
  el.style.display='block';
  const quiet=rs.length>4?600:DAUS_QUIET;
  let k=0,f=0;
  const pas=()=>{
    const r=rs[k];
    if(f<DAUS_RODA){f++;rodola(r,k);dausT=setTimeout(pas,DAUS_PAS);return}
    const ultima=k===rs.length-1;quieta(r,k,ultima);
    if(!ultima){k++;f=0;dausT=setTimeout(pas,quiet);return}
    dausT=setTimeout(()=>{el.style.display='none'},o.queda||3200);
  };
  pas();
  return rs.length*DAUS_RODA*DAUS_PAS+(rs.length-1)*quiet;
}

// el dit: la comarca tocada, o la del numero mes proper (les petites)
function comarcaA(ev){
  const t=ev.target.closest&&ev.target.closest('[data-c]');
  if(t)return +t.getAttribute('data-c');
  const pt=SVG.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
  const q=pt.matrixTransform(SVG.getScreenCTM().inverse());
  let m=-1,md=55;ETIQ.forEach((e,i)=>{const d=Math.hypot(e.x-q.x,e.y-q.y);if(d<md){md=d;m=i}});
  return m<0?null:m;
}
SVG.addEventListener('pointerdown',ev=>{ev.preventDefault();aInit();const c=comarcaA(ev);
  if(ia&&!paused){depressa=true;iaT=0;return}
  if(c!==null){avis='';if(!(S&&S.fase==='atac'&&S.dueny[c]!==0))ultima=null;toca(c)}});

let last=performance.now();
function loop(t){
  const dt=Math.min(.1,(t-last)/1000);last=t;
  if(!paused&&ia){iaT-=dt;let k=0;while(ia&&iaT<=0&&k++<400)pasIA()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
